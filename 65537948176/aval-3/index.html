<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="avaliaçao jorge02.css">
  <title>App social freed - funcional</title>

  <!-- 🔗 Arquivo CSS externo -->
  <link rel="stylesheet" href="avaliaçao jorge02.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <h1>Postagens</h1>
  <header></header>
  <a></a><p></p>
  <h2></h2>
  <nav>
    <button data-target="inicio">Início</button>
    <button data-target="perfil">Perfil</button>
    <button data-target="postagens">Postagens</button>
    <button data-target="todos">Mostrar todos</button>
  </nav>

  <main class="container" id="cards-container">

    <!-- CARD 1 -->
    <article id="inicio" class="card">
      <div class="header">
        <div class="avatar" style="background-image:url('https://www.portaldodog.com.br/wp-content/uploads/2024/09/4-curiosidades-sobre-racas-de-cachorros-pequenos.jpg');"></div>
        <div><strong>keve.77@</strong></div>
      </div>
      <img class="main-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnxp6tfb4FlGfQLMMZS-6jE9si8c2LM2BjYg&s" alt="Imagem" />
      <div class="content">
      Um time brasileiro ira enfrenta o melhor time da Europa atualmente, Seu nome e PSG.
      </div>
    </article>

    <!-- CARD 2 -->
    <article id="perfil" class="card hidden">
      <div class="header">
         <div class="avatar" style="background-image:url('https://www.portaldodog.com.br/wp-content/uploads/2024/09/4-curiosidades-sobre-racas-de-cachorros-pequenos.jpg');"></div>
        <div><strong>keve.77@</strong></div>
      </div>
      <img class="main-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKZyA4mjburx3kcIgMTob37TxVJw-Si2cB4A&s" alt="Imagem" />
      <div class="content">
      Atualmente maior campeao da libertadores
        <span class="meta">Há 30 minutos</span>
      </div>
    </article>

    <!-- CARD 3 -->
    <article id="postagens" class="card hidden">
      <div class="header">
         <div class="avatar" style="background-image:url('https://www.portaldodog.com.br/wp-content/uploads/2024/09/4-curiosidades-sobre-racas-de-cachorros-pequenos.jpg');"></div>
        <div><strong>keve.77@</strong></div>
      </div>
      <img class="main-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiPMdBbEckuvNyBrk18u_3VWCFv1Jn9AE9zQ&s" alt="Imagem" />
      <div class="content">
      Atualmente o melhor jogador, E a estrela do time e arrascaeta
        <span class="meta">Há 1 hora</span>
      </div>
    </article>

  </main>

  <script>
    function mostrarCard(id) {
      const cards = document.querySelectorAll('#cards-container .card');
      cards.forEach(card => {
        if (id === 'todos') {
          card.classList.remove('hidden');
        } else {
          if (card.id === id) {
            card.classList.remove('hidden');
            setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
          } else {
            card.classList.add('hidden');
          }
        }
      });
    }

    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        mostrarCard(target);
      });
    });
  </script>

</body>
</html>
