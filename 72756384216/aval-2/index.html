<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TN Esportes — E‑commerce Completo (Demo)</title>
<link rel="icon" href="" />
<style>
/* ====================== THEME VARIABLES ====================== */
:root{
  --bg:#05070a; --surface:#0d1115; --muted:#9fbfcf; --accent:#00aaff; --accent-2:#0066ff; --card:rgba(255,255,255,0.04);
}
.light{ --bg:#f4fbff; --surface:#ffffff; --muted:#234; --accent:#0077aa; --accent-2:#004e7a; --card:rgba(0,0,0,0.04); }
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--muted)}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit}

/* ====================== LAYOUT ====================== */
.header{position:sticky;top:0;z-index:60;background:linear-gradient(180deg, rgba(0,0,0,0.35), transparent);backdrop-filter:blur(8px);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,0.03)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 22px rgba(0,170,255,0.08);display:grid;place-items:center;color:#001}
.search{flex:1;max-width:680px;margin:0 16px}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:10px;border-radius:10px;color:var(--muted);cursor:pointer}
.icon-btn:hover{box-shadow:0 6px 22px rgba(0,170,255,0.06)}

.container{max-width:1200px;margin:28px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.col-3{grid-column:span 3}
.col-4{grid-column:span 4}
.col-6{grid-column:span 6}
.col-12{grid-column:span 12}

/* ====================== SIDEBAR / FILTER ====================== */
.sidebar{background:var(--card);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);}
.category{display:flex;flex-direction:column;gap:8px}
.category button{padding:8px;border-radius:8px;border:none;background:transparent;color:var(--muted);text-align:left;cursor:pointer}
.category button.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#002}

/* ====================== PRODUCT CARD ====================== */
.product{background:var(--card);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column;gap:8px}
.product .thumb{height:180px;border-radius:8px;overflow:hidden}
.product h3{font-size:16px;margin:6px 0;color:var(--muted)}
.product .price{font-weight:700;color:var(--accent)}
.product .actions{display:flex;gap:8px;margin-top:auto}
.btn{padding:10px;border-radius:10px;border:none;cursor:pointer}
.btn.primary{background:var(--accent);color:#001}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}

/* ====================== CART PANEL ====================== */
.cart-panel{position:fixed;right:0;top:0;width:360px;height:100%;background:var(--surface);box-shadow:-30px 0 60px rgba(0,0,0,0.6);transform:translateX(100%);transition:transform .35s;z-index:90;padding:18px;display:flex;flex-direction:column}
.cart-panel.open{transform:translateX(0)}
.cart-items{flex:1;overflow:auto;margin-top:10px}
.cart-item{display:flex;gap:8px;padding:10px;border-radius:8px;background:var(--card);margin-bottom:10px}
.cart-item img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.qty{display:flex;gap:6px;align-items:center}

/* ====================== MODAL ====================== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.modal-box{width:90%;max-width:720px;background:var(--surface);padding:18px;border-radius:12px}

/* ====================== CHECKOUT FORM ====================== */
.form-row{display:flex;gap:10px}
.input{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--muted)}

/* ====================== RESPONSIVE ====================== */
@media (max-width:980px){
  .grid{grid-template-columns:repeat(6,1fr)}
  .col-3{grid-column:span 6}
  .col-4{grid-column:span 6}
  .col-6{grid-column:span 6}
}
@media (max-width:600px){
  .search{display:none}
}

/* small utility */
.h4{font-size:14px;color:var(--muted);margin-bottom:8px}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="brand"><div class="logo">TN</div><div><strong>TN Esportes</strong><div style="font-size:12px;opacity:.7">Moda Esportiva</div></div></div>
  <div class="search"><input id="searchInput" placeholder="Pesquisar produtos..." aria-label="Pesquisar" /></div>
  <div class="actions">
    <button id="themeToggle" class="icon-btn" title="Alternar tema">🌗</button>
    <button id="openCart" class="icon-btn" title="Abrir carrinho">🛒 <span id="cartCount" style="margin-left:6px">0</span></button>
  </div>
</header>

<!-- MAIN -->
<main class="container">
  <div class="grid">
    <!-- SIDEBAR -->
    <aside class="col-3">
      <div class="sidebar">
        <div class="h4">Categorias</div>
        <div class="category" id="categoryList"></div>

        <div style="height:12px"></div>
        <div class="h4">Filtrar por preço</div>
        <input id="priceMin" class="input" placeholder="Preço mínimo" />
        <input id="priceMax" class="input" placeholder="Preço máximo" />
        <button id="applyPrice" class="btn ghost" style="margin-top:8px">Aplicar</button>
      </div>
    </aside>

    <!-- PRODUTOS -->
    <section class="col-6">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2>Produtos</h2>
        <select id="sortSelect" class="input" style="max-width:180px"><option value="relevant">Mais relevantes</option><option value="priceAsc">Preço ↑</option><option value="priceDesc">Preço ↓</option></select>
      </div>
      <div id="productsGrid" class="grid"></div>
      <div style="margin-top:18px;text-align:center"><button id="loadMore" class="btn ghost">Carregar mais</button></div>
    </section>

    <!-- DESTAQUES / CHECKOUT -->
    <aside class="col-3">
      <div class="sidebar">
        <div class="h4">Destaques</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="background:var(--card);padding:10px;border-radius:8px">Promoção: -20% em kits</div>
          <div style="background:var(--card);padding:10px;border-radius:8px">Frete grátis acima de R$200</div>
          <div style="background:var(--card);padding:10px;border-radius:8px">Suporte via WhatsApp</div>
        </div>

        <div style="height:18px"></div>
        <div class="h4">Checkout Rápido</div>
        <button id="quickCheckout" class="btn primary">Ir para checkout</button>
      </div>
    </aside>
  </div>
</main>

<!-- CART PANEL -->
<aside id="cartPanel" class="cart-panel" aria-hidden="true">
  <h3>Seu Carrinho</h3>
  <div id="cartItems" class="cart-items"></div>
  <div style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div>Subtotal</div><div id="subtotal">R$0,00</div></div>
    <button id="checkoutBtn" class="btn primary" style="width:100%">Finalizar compra</button>
    <button id="closeCart" class="btn ghost" style="width:100%;margin-top:8px">Fechar</button>
  </div>
</aside>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal" aria-hidden="true"><div class="modal-box">
  <div style="display:flex;gap:12px">
    <div style="flex:1"><img id="modalImg" src="" alt="" /></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <h3 id="modalTitle">Nome</h3>
      <div id="modalPrice" style="font-weight:700;color:var(--accent)">R$0,00</div>
      <div class="h4">Descrição</div>
      <p id="modalDesc" style="opacity:.9">—</p>
      <div style="margin-top:auto;display:flex;gap:8px">
        <input id="modalQty" type="number" min="1" value="1" style="width:90px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--muted)" />
        <button id="addToCartBtn" class="btn primary">Adicionar ao carrinho</button>
      </div>
    </div>
  </div>
  <div style="text-align:right;margin-top:10px"><button id="closeModal" class="btn ghost">Fechar</button></div>
</div></div>

<!-- CHECKOUT MODAL -->
<div id="checkoutModal" class="modal" aria-hidden="true"><div class="modal-box">
  <h3>Finalizar Compra</h3>
  <div style="display:flex;flex-direction:column;gap:8px">
    <input id="nomeCliente" class="input" placeholder="Nome completo" />
    <input id="emailCliente" class="input" placeholder="Email" />
    <input id="telCliente" class="input" placeholder="Telefone" />
    <input id="enderecoCliente" class="input" placeholder="Endereço" />
    <div style="display:flex;gap:8px"><button id="confirmOrder" class="btn primary">Confirmar pedido</button><button id="cancelOrder" class="btn ghost">Cancelar</button></div>
  </div>
</div></div>

<script>
/* =============== SAMPLE DATA =============== */
const PRODUCTS = [
  {id:1,name:'Tênis Performance Pro',cat:'calcado',price:329.90,stock:12,thumb:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80',desc:'Tênis leve, amortecimento responsivo e sola aderente.'},
  {id:2,name:'Camiseta Dry Fit Max',cat:'camiseta',price:89.90,stock:40,thumb:'https://images.unsplash.com/photo-1528701800489-20be1c40c2d0?auto=format&fit=crop&w=900&q=80',desc:'Tecido que afasta suor, costura flat e toque suave.'},
  {id:3,name:'Shorts FlexMove',cat:'shorts',price:79.90,stock:30,thumb:'https://images.unsplash.com/photo-1539889721560-47a6b5ad7d5e?auto=format&fit=crop&w=900&q=80',desc:'Shorts compressivo, bolsos com zíper e corte livre.'},
  {id:4,name:'Jaqueta WindRunner',cat:'casaco',price:199.90,stock:8,thumb:'https://images.unsplash.com/photo-1540569014015-19a9d6a0f9a8?auto=format&fit=crop&w=900&q=80',desc:'Resistente à água, leve e compactável.'},
  {id:5,name:'Meias SportGrip (3p)',cat:'acessorio',price:29.90,stock:120,thumb:'https://images.unsplash.com/photo-1520975668704-9c8f3a5f3b64?auto=format&fit=crop&w=900&q=80',desc:'Meias antiderrapantes para treino intenso.'}
];

/* =============== STATE & HELPERS =============== */
let state={products:[...PRODUCTS],cart:JSON.parse(localStorage.getItem('cart')||'[]')};
const $ = (sel)=>document.querySelector(sel);
const $$ = (sel)=>document.querySelectorAll(sel);

function money(v){return 'R$'+v.toFixed(2).replace('.',',');}

/* =============== RENDER CATEGORIES =============== */
function renderCategories(){
  const cats=['all',...new Set(state.products.map(p=>p.cat))];
  const container = document.getElementById('categoryList'); container.innerHTML='';
  cats.forEach(c=>{
    const btn=document.createElement('button'); btn.textContent=c==='all'? 'Todos': c;
    btn.dataset.cat=c; if(c==='all') btn.classList.add('active');
    btn.onclick=()=>{ $$('.category button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderProducts(c); };
    container.appendChild(btn);
  });
}

/* =============== RENDER PRODUCTS =============== */
const productsGrid = $('#productsGrid');
function renderProducts(filter='all', options={}){
  productsGrid.innerHTML='';
  let list = state.products.slice();
  if(filter!=='all') list = list.filter(p=>p.cat===filter);
  // search
  const q = $('#searchInput').value?.toLowerCase().trim(); if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
  // price filter
  const min = parseFloat($('#priceMin').value)||0; const max = parseFloat($('#priceMax').value)||Infinity; list = list.filter(p=>p.price>=min && p.price<=max);
  // sort
  const s = $('#sortSelect').value; if(s==='priceAsc') list.sort((a,b)=>a.price-b.price); if(s==='priceDesc') list.sort((a,b)=>b.price-a.price);

  list.forEach(p=>{
    const col = document.createElement('div'); col.className='col-4';
    col.innerHTML = `
      <div class="product">
        <div class="thumb"><img src="${p.thumb}" alt="${p.name}"></div>
        <h3>${p.name}</h3>
        <div class="price">${money(p.price)}</div>
        <div class="actions">
          <button class="btn primary" onclick="openModal(${p.id})">Ver</button>
          <button class="btn ghost" onclick="addToCartId(${p.id})">Adicionar</button>
        </div>
      </div>`;
    productsGrid.appendChild(col);
  });
}

/* =============== MODAL LOGIC =============== */
function openModal(id){
  const p = state.products.find(x=>x.id===id);
  $('#modalImg').src = p.thumb; $('#modalTitle').textContent=p.name; $('#modalPrice').textContent=money(p.price); $('#modalDesc').textContent=p.desc; $('#productModal').classList.add('open'); $('#productModal').setAttribute('aria-hidden','false'); $('#addToCartBtn').onclick=()=>{ addToCartId(id, parseInt($('#modalQty').value||1)); };
}
$('#closeModal').onclick=()=>{ $('#productModal').classList.remove('open'); $('#productModal').setAttribute('aria-hidden','true'); }

/* =============== CART =============== */
function saveCart(){ localStorage.setItem('cart', JSON.stringify(state.cart)); renderCart(); updateCartCount(); }
function addToCartId(id, qty=1){ const p = state.products.find(x=>x.id===id); if(!p) return; const exist = state.cart.find(i=>i.id===id); if(exist){ exist.qty += qty; } else { state.cart.push({id:id,qty:qty,price:p.price,name:p.name,thumb:p.thumb}); } saveCart(); alert('Produto adicionado ao carrinho'); }
function removeCartIndex(i){ state.cart.splice(i,1); saveCart(); }
function changeQty(i,delta){ state.cart[i].qty = Math.max(1, state.cart[i].qty + delta); saveCart(); }

function renderCart(){ const container = $('#cartItems'); container.innerHTML=''; let subtotal=0; state.cart.forEach((it,idx)=>{ subtotal += it.price*it.qty; const el = document.createElement('div'); el.className='cart-item'; el.innerHTML = `
  <img src="${it.thumb}" alt>
  <div style="flex:1">
    <div style=\"font-weight:700\">${it.name}</div>
    <div style=\"margin-top:8px\">${money(it.price)} x ${it.qty} = <strong>${money(it.price*it.qty)}</strong></div>
    <div style=\"margin-top:8px;display:flex;gap:6px;align-items:center\">
      <button class=\"btn ghost\" onclick=\"changeQty(${idx},-1)\">-</button>
      <div style=\"padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:6px\">${it.qty}</div>
      <button class=\"btn ghost\" onclick=\"changeQty(${idx},1)\">+</button>
      <button class=\"btn ghost\" style=\"margin-left:auto\" onclick=\"removeCartIndex(${idx})\">Remover</button>
    </div>
  </div>`; container.appendChild(el); }); $('#subtotal').textContent = money(subtotal); }

function updateCartCount(){ $('#cartCount').textContent = state.cart.reduce((s,i)=>s+i.qty,0); }

/* =============== CHECKOUT =============== */
$('#checkoutBtn').onclick=()=>{ if(state.cart.length===0){ alert('Carrinho vazio'); return; } $('#checkoutModal').classList.add('open'); $('#checkoutModal').setAttribute('aria-hidden','false'); }
$('#cancelOrder').onclick=()=>{ $('#checkoutModal').classList.remove('open'); $('#checkoutModal').setAttribute('aria-hidden','true'); }
$('#confirmOrder').onclick=()=>{
  const nome = $('#nomeCliente').value.trim(); const email = $('#emailCliente').value.trim();
  if(!nome||!email){ alert('Preencha nome e email'); return; }
  // fake order processing
  const order = {id:Date.now(),name:nome,email:email,items:state.cart,subtotal:state.cart.reduce((s,i)=>s+i.qty*i.price,0)};
  console.log('ORDER',order);
  state.cart = []; saveCart(); $('#checkoutModal').classList.remove('open'); $('#checkoutModal').setAttribute('aria-hidden','true'); alert('Pedido confirmado! Obrigado, ' + nome);
}

/* =============== UI HOOKS =============== */
$('#openCart').onclick=()=>{ $('#cartPanel').classList.add('open'); $('#cartPanel').setAttribute('aria-hidden','false'); renderCart(); }
$('#closeCart').onclick=()=>{ $('#cartPanel').classList.remove('open'); $('#cartPanel').setAttribute('aria-hidden','true'); }
$('#themeToggle').onclick=()=>{ document.documentElement.classList.toggle('light'); document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('light')? 'light' : 'dark'); }
$('#searchInput').addEventListener('input', ()=> renderProducts(document.querySelector('.category button.active')?.dataset.cat || 'all'));
$('#sortSelect').addEventListener('change', ()=> renderProducts(document.querySelector('.category button.active')?.dataset.cat || 'all'));
$('#applyPrice').onclick=()=> renderProducts(document.querySelector('.category button.active')?.dataset.cat || 'all');

/* quick actions */
$('#quickCheckout').onclick=()=>{ if(state.cart.length===0){ alert('Adicione itens ao carrinho'); return; } $('#checkoutModal').classList.add('open'); }
$('#loadMore').onclick=()=>{ alert('Demo: carregar mais produtos (implemente API)') }

/* keyboard accessibility */
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ $('#productModal').classList.remove('open'); $('#checkoutModal').classList.remove('open'); $('#cartPanel').classList.remove('open'); } });

/* init */
(function init(){ renderCategories(); renderProducts(); renderCart(); updateCartCount(); if(localStorage.getItem('theme')==='light') document.documentElement.classList.add('light'); })();

</script>
<script src="script.js"></script></body>
</html>

        <a>
            <article>
                <footer>
