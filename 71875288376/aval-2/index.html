<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Curso</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Avaliação do Curso</h1>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Cursos</a>
    <a href="#">Contato</a>
</nav>

<div class="container">
    <main>

        <article>
            <h2>Formulário de Avaliação</h2>
            <h3>Informações do Aluno</h3>
            
            <img src="https://via.placeholder.com/600x150.png?text=Banner+do+Curso" alt="Banner do Curso" class="banner">

            <form>
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">

                <label>Curso Avaliado</label>
                <input type="text" placeholder="Nome do curso">

                <label>Qualidade do Curso</label>
                <select>
                    <option>Excelente</option>
                    <option>Bom</option>
                    <option>Regular</option>
                    <option>Ruim</option>
                </select>

                <label>Comentário</label>
                <textarea rows="5" placeholder="Escreva sua opinião"></textarea>

                <button>Enviar Avaliação</button>
            </form>
        </article>

    </main>

    <aside>
        <h2>Informações</h2>
        <h3>Avisos Recentes</h3>
        <p>Veja notícias, avisos e informações úteis sobre nossos cursos.</p>
        <img src="https://via.placeholder.com/250x150.png?text=Dicas+Rápidas" alt="Dicas do Curso">
    </aside>
</div>

<footer>
    © 2025 - Sistema de Avaliação de Cursos
</footer>

</body>
</html>
