<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyFeed - Brinquedos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <h1>ToyFeed 🧸</h1>
        <div class="user-profile">
            <i class="fas fa-user-circle"></i>
        </div>
    </header>
    
    <nav class="main-nav">
        <ul>
            <li><a href="#"><i class="fas fa-home"></i> Início</a></li>
            <li><a href="#"><i class="fas fa-search"></i> Explorar</a></li>
            <li><a href="#"><i class="fas fa-plus-square"></i> Postar</a></li>
            <li><a href="#"><i class="fas fa-shopping-bag"></i> Minhas Compras</a></li>
        </ul>
    </nav>

    <h2 class="feed-title">Brinquedos em Destaque para Você!</h2>

    <main class="feed-container" id="feed-container">
        
        <div class="post-card">
            <div class="post-header">
                <img src="avatar.jpg" alt="Vendedor" class="vendor-avatar">
                <span class="vendor-name">@LojaFeliz</span>
            </div>
            <div class="post-image-container">
                <img src="https://m.media-amazon.com/images/I/71KCXfVJ6TL.jpg" alt="Brinquedo A" class="post-image">
            </div>
            <div class="post-actions">
                <button class="action-btn like-btn"><i class="fas fa-heart"></i> 150</button>
                <button class="action-btn comment-btn"><i class="fas fa-comment"></i> 12</button>
                <button class="action-btn buy-btn"><i class="fas fa-shopping-cart"></i> Comprar</button>
            </div>
            <div class="post-details">
                <p class="product-price">R$ 49,90</p>
                <p class="product-caption">
                    <span class="vendor-name-caption">@LojaFeliz</span> Quebra-cabeça 3D do Dragão! Perfeito para desenvolver o raciocínio. #QuebraCabeça #Brinquedos
                </p>
            </div>
        </div>
        </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
