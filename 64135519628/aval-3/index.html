<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Futurista</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="Logotipo do NeonFeed" class="logo" />
      <h1>🌐 <span class="highlight">NeonFeed</span></h1>

      <nav>
        <ul class="menu">
          <li><a href="#">Início</a></li>
          <li><a href="#">Explorar</a></li>
          <li><a href="#">Perfil</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="new-post glass">
        <h2>Nova Postagem</h2>
        <textarea id="postText" placeholder="Compartilhe seus pensamentos..."></textarea>
        <button id="postButton">🚀 Publicar</button>
      </section>

      <section id="feed" class="feed">
        <h2>Feed de Publicações</h2>
        <p>Seja o primeiro a postar algo incrível!</p>
      </section>
    </main>

    <footer>
      <p>Feito com <span class="heart">💙</span> por Você</p>
    </footer>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
