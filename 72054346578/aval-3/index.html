<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Social Feed - Futebol</title>
                <link rel="stylesheet" href="styles.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <header class="topbar">
                            <h1>Social Feed</h1>

                                            <main>

                                                                                                                                                                                                                                                                                                                                                                                                            <span>⚽ 245 curtidas</span>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <article class="post">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <img class="post-image" src="IMG-20251211-WA0017.jpg" alt="Foto 2 de futebol">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
