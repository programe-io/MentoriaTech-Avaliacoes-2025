<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoTech Quantum — Perfil Futurista</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>AutoTech Quantum — Futuro da Mecânica</header>
<div class="container">

  <div class="card">
    <h2>Sobre a Empresa</h2>
    <p>A AutoTech Quantum é especialista em manutenção automotiva avançada, utilizando tecnologia holográfica, IA preditiva e diagnósticos de última geração.</p>
  </div>

  <div class="card">
    <h2>Carrossel Futurista</h2>
    <div class="carrossel">
      <img src="https://i.imgur.com/Z7t6c1G.jpeg" />
      <img src="https://i.imgur.com/G0wIY0j.jpeg" />
      <img src="https://i.imgur.com/yLJQzW0.jpeg" />
    </div>
  </div>

  <div class="card cadastro">
    <h2>Cadastro de Cliente</h2>
    <form id="formCadastro">
      <input type="text" name="nome" placeholder="Nome completo" required />
      <input type="email" name="email" placeholder="Seu e-mail" required />
      <input type="tel" name="telefone" placeholder="Telefone" required />
      <input type="text" name="carro" placeholder="Modelo do veículo" required />
      <textarea name="msg" rows="4" placeholder="Observações"></textarea>
      <button type="submit">Enviar Cadastro</button>
    </form>
  </div>

</div>

<button id="toggleDark">🌙</button>
<button id="whatsappBtn">💬</button>

<!-- Assistente virtual -->
<div id="chatWidget">
  <div id="chatHeader">Assistente AutoTech ▸</div>
  <div id="chatBody">
    <div id="chatLog"></div>
    <div class="chatInputBox">
      <input id="chatInput" placeholder="Escreva sua dúvida...">
      <button id="sendChat">Enviar</button>
    </div>
  </div>
</div>

<!-- PDF -->
<button id="downloadPdf" class="pdfBtn">📄 Gerar Orçamento (PDF)</button>

<!-- Áudios -->
<audio id="sndClick">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>
<audio id="sndNotify">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script src="script.js"></script>
<script src="script.js"></script></body>
</html>
