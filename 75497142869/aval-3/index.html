<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Social Pooh</title> 
     <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<!-- Navbar -->
<header class="navbar">
    <div class="logo">URSINHO POOH! 🍯</div>

    <nav>
        <a href="#">Início</a>
        <a href="#">Amigos</a>
        <a href="#">Perfil</a>
    </nav>
</header>

<!-- POSTS -->
<main class="container">

    <!-- CARD 1 -->
    <div class="card">
        <div class="user-info">
            <img class="avatar" src="https://m.media-amazon.com/images/I/81wTK+fArOL._AC_UF1000,1000_QL80_.jpg" alt="">
            <h2>Ursinho Pooh</h2>
        </div>

        <img class="post-img" src="https://mimosidades.com.br/wp-content/uploads/2025/02/image-3-1024x691.png" alt="Pooh com mel">

        <p>
            Hoje encontrei um pote de mel quase cheio! Um dia perfeito! 🍯🐻
        </p>
        <span class="time">há 10 minutos</span>
    </div>

    <!-- CARD 2 -->
    <div class="card">
        <div class="user-info">
            <img class="avatar" src="https://m.media-amazon.com/images/I/81wTK+fArOL._AC_UF1000,1000_QL80_.jpg" alt="">
            <h2>Leitão</h2>
        </div>

        <img class="post-img" src="https://static.ndmais.com.br/2024/10/leitao-800x551.png" alt="Leitão com flores">

        <p>
            Passei a manhã observando as plantas. Tão bonitas e delicadas! 🌸✨
        </p>
        <span class="time">há 5 minutos</span>
    </div>

    <!-- CARD 3 -->
    <div class="card">
        <div class="user-info">
            <img class="avatar" src="https://m.media-amazon.com/images/I/81wTK+fArOL._AC_UF1000,1000_QL80_.jpg" alt="">
            <h2>Tigrão</h2>
        </div>

        <img class="post-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiFTo4WIC-258uKs9ErrCloOCOXBv6hQRtRA&s" alt="Tigrão pulando">

        <p>
            Pular é o que os Tigrões fazem de melhor! 🐯💥
        </p>
        <span class="time">há 20 minutos</span>
    </div>

</main>

</body>
</html>
