<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sabor&Vitta</title>
  <meta name="description" content="Sabor&Vitta — site de receitas com layout em azul e prata, feito com Tailwind CSS e JavaScript." />

  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "brand-blue": {
              50: '#f3f8ff',
              100: '#e6f0ff',
              200: '#bfe0ff',
              300: '#99d0ff',
              400: '#4db0ff',
              500: '#1a90ff',
              600: '#1578d1',
              700: '#0f569b',
              800: '#0b3c6d',
              900: '#06203a'
            },
            silver: '#c7c9cc',
            darkGray: '#d1d5db',
            plateGray: '#e5e7eb'
          },
          boxShadow: {
            'card': '0 8px 30px rgba(2,15,43,0.08)'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: white;
    }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.45));
      backdrop-filter: blur(6px);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-white min-h-screen text-slate-800">
  <header class="max-w-6xl mx-auto p-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gradient-to-tr from-brand-blue-500 to-silver shadow-card text-white font-bold">S</div>
      <div>
        <h1 class="text-2xl font-semibold text-brand-blue-700">Sabor&Vitta</h1>
        <p class="text-sm text-slate-500">Sabores que inspiram sabor e vida</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <input id="searchInput" type="search" placeholder="Buscar receitas..." class="px-4 py-2 rounded-lg border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-blue-300" />
      <button id="addBtn" class="px-4 py-2 rounded-lg bg-brand-blue-500 text-white shadow hover:bg-brand-blue-600">Nova receita</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 pb-12">
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <article class="md:col-span-2 rounded-2xl p-6 shadow-card border border-slate-100 bg-gray-200">
        <div class="flex items-start gap-6">
          <img src="https://images.unsplash.com/photo-1512058564366-c9e3c4a00e0b?auto=format&fit=crop&w=800&q=60" alt="Prato destaque" class="w-48 h-36 object-cover rounded-xl shadow" />
          <div>
            <h2 class="text-2xl font-semibold text-brand-blue-800">Salmão Assado com Ervas</h2>
            <p class="text-slate-600 mt-2">Rápido, saudável e perfeito para jantares elegantes. Tempo: 25 min · Dificuldade: Fácil</p>
            <div class="mt-4 flex gap-3">
              <button class="px-4 py-2 rounded-lg bg-white border border-slate-200 shadow-sm">Ver receita</button>
              <button class="px-4 py-2 rounded-lg bg-brand-blue-100 text-brand-blue-800">Salvar</button>
            </div>
          </div>
        </div>
      </article>

      <aside class="rounded-2xl p-4 glass border border-slate-100 shadow-card">
        <h3 class="font-semibold text-lg text-brand-blue-700">Filtros</h3>
        <div class="mt-4 space-y-3">
          <label class="flex items-center gap-2"><input type="checkbox" value="vegetariana" class="filter-checkbox"> Vegetariana</label>
          <label class="flex items-center gap-2"><input type="checkbox" value="rapida" class="filter-checkbox"> Rápida (&lt;30min)</label>
          <label class="flex items-center gap-2"><input type="checkbox" value="doce" class="filter-checkbox"> Doce</label>
        </div>
      </aside>
    </section>

    <section class="mt-8">
      <h3 class="text-xl font-semibold text-brand-blue-700 mb-4">Receitas</h3>
      <div id="recipesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-6">
    <div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-card">
      <button id="closeModal" class="ml-auto block text-slate-500">Fechar ✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="mt-12 py-8 border-t border-slate-100 text-center text-slate-500">
    © <span id="year"></span> Sabor&Vitta — Feito com Tailwind CSS
  </footer>

  <script>
    const recipes = [
      {
        id: 1,
        title: 'Salmão Assado com Ervas',
        tags: ['rapida'],
        time: '25 min',
        difficulty: 'Fácil',
        img: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=60',
        ingredients: ['Salmão', 'Limão', 'Ervas finas', 'Azeite', 'Sal e pimenta'],
        steps: ['Pré-aqueça o forno a 200°C', 'Tempere o salmão', 'Asse por 12-15 minutos']
      },
      {
        id: 2,
        title: 'Mousse de Chocolate',
        tags: ['doce', 'vegetariana'],
        time: '45 min',
        difficulty: 'Médio',
        img: 'https://images.unsplash.com/photo-1543185376-1b5a4b1d63ad?auto=format&fit=crop&w=800&q=60',
        ingredients: ['Chocolate amargo', 'Ovos', 'Açúcar', 'Creme de leite'],
        steps: ['Derreta o chocolate', 'Bata claras em neve', 'Misture cuidadosamente e resfrie']
      },
      {
        id: 3,
        title: 'Salada Mediterrânea',
        tags: ['vegetariana', 'rapida'],
        time: '15 min',
        difficulty: 'Fácil',
        img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=60',
        ingredients: ['Tomate', 'Pepino', 'Azeitonas', 'Queijo feta', 'Azeite'],
        steps: ['Corte os ingredientes', 'Misture com azeite e sal', 'Sirva fresca']
      }
    ];

    const grid = document.getElementById('recipesGrid');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const searchInput = document.getElementById('searchInput');
    const yearSpan = document.getElementById('year');
    yearSpan.textContent = new Date().getFullYear();

    function renderRecipes(list) {
      grid.innerHTML = '';
      list.forEach(r => {
        const card = document.createElement('article');
        card.className = 'rounded-xl overflow-hidden bg-gray-200 border border-slate-300 shadow-card';
        card.innerHTML = `
          <img src="${r.img}" alt="${r.title}" class="w-full h-40 object-cover" />
          <div class="p-4">
            <h4 class="font-semibold text-lg text-brand-blue-800">${r.title}</h4>
            <p class="text-sm text-slate-600 mt-1">${r.time} · ${r.difficulty}</p>
            <div class="mt-3 flex items-center justify-between">
              <div class="text-xs text-slate-700">${r.tags.map(t=>`<span class=\"inline-block px-2 py-1 border rounded-full text-[11px] bg-gray-300\">${t}</span>`).join(' ')}</div>
              <div class="flex gap-2">
                <button data-id="${r.id}" class="viewBtn px-3 py-1 rounded-lg bg-brand-blue-50 text-brand-blue-700">Abrir</button>
                <button class="px-3 py-1 rounded-lg border">Curtir</button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll('.viewBtn').forEach(b => b.addEventListener('click', (ev)=>{
        const id = Number(ev.currentTarget.dataset.id);
        openModal(id);
      }));
    }

    function openModal(id) {
      const r = recipes.find(x=>x.id===id);
      if(!r) return;
      modalContent.innerHTML = `
        <h2 class=\"text-2xl font-bold text-brand-blue-800\">${r.title}</h2>
        <img src=\"${r.img}\" alt=\"${r.title}\" class=\"w-full h-48 object-cover rounded-lg mt-4\" />
        <div class=\"mt-4 grid grid-cols-1 md:grid-cols-2 gap-4\">\n          <div>\n            <h3 class=\"font-semibold\">Ingredientes</h3>\n            <ul class=\"list-disc list-inside text-slate-600\">${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>\n          </div>\n          <div>\n            <h3 class=\"font-semibold\">Modo de preparo</h3>\n            <ol class=\"list-decimal list-inside text-slate-600\">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>\n          </div>\n        </div>\n      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    document.getElementById('closeModal').addEventListener('click', ()=>{
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    searchInput.addEventListener('input', ()=>applyFilters());
    document.querySelectorAll('.filter-checkbox').forEach(ch=>ch.addEventListener('change', ()=>applyFilters()));

    function applyFilters(){
      const q = searchInput.value.trim().toLowerCase();
      const active = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(c=>c.value);
      const filtered = recipes.filter(r=>{
        const matchesQ = r.title.toLowerCase().includes(q) || r.ingredients.join(' ').toLowerCase().includes(q);
        const matchesFilters = active.every(a=>r.tags.includes(a));
        return matchesQ && matchesFilters;
      });
      renderRecipes(filtered);
    }

    document.getElementById('addBtn').addEventListener('click', ()=>{
      modalContent.innerHTML = `
        <h2 class=\"text-2xl font-bold text-brand-blue-800\">Adicionar receita (demo)</h2>
        <p class=\"mt-3 text-slate-600\">Este botão serve de exemplo — para adicionar uma receita real, implemente um formulário e persistência.</p>
        <div class=\"mt-4\"><button id=\"closeAfter\" class=\"px-4 py-2 rounded bg-brand-blue-500 text-white\">Fechar</button></div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(()=>{
        const closeAfter = document.getElementById('closeAfter');
        if(closeAfter) closeAfter.addEventListener('click', ()=>{
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        });
      }, 50);
    });

    renderRecipes(recipes);
  </script>
  <nav>
<a>
</body>
</html>
