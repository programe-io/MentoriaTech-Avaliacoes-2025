<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversor de Temperatura</title>
  <link rel="stylesheet" href="styles.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Conversor de Temperatura</h1>
  </header>

  <nav>
    <ul class="nav-menu">
      <li><a href="#">Início</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
  </nav>

  <div class="main-container">
    <main>
      <article class="container">
        <label for="valor">Digite a temperatura:</label>
        <input type="number" id="valor" placeholder="Ex: 25" />

        <label for="de">De:</label>
        <select id="de">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>

        <label for="para">Para:</label>
        <select id="para">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>

        <button onclick="converter()">Converter</button>

        <div class="resultado" id="resultado">
          <p></p>
        </div>
      </article>
    </main>

    <aside class="imagem-container">
      <h3>Imagem ilustrativa</h3>
      <img src="https://cdn-icons-png.flaticon.com/512/861/861059.png" alt="Termômetro" />
    </aside>
  </div>

  <footer>
    <p>&copy; 2025 Conversor de Temperatura. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
