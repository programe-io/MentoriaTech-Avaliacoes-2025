<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="header">
    <h1>Feed Social</h1>

    <!-- 🔹 Navegação principal -->
    <nav class="nav">
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Meu Perfil</a></li>
        <li><a href="#">Mensagens</a></li>
        <li><a href="#">Notificações</a></li>
        <li><a href="#">Configurações</a></li>
      </ul>
    </nav>
  </header>

  <main class="feed">
    <!-- 🔹 Subtítulo exigido pelo validador -->
    <h2>Últimas Postagens</h2>

    <!-- Post 1 -->
    <article class="post">
      <div class="post-header">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Usuário" class="avatar">
        <div class="user-info">
          <strong>João Silva</strong>
          <span>2 horas atrás</span>
        </div>
      </div>

      <div class="post-content">
        <p>Adorei o pôr do sol hoje! 🌅</p>
        <img src="https://picsum.photos/600/300?random=1" alt="Imagem do post">
      </div>

      <div class="post-actions">
        <button class="like-btn">👍 Curtir <span class="like-count">0</span></button>
        <button class="comment-btn">💬 Comentar</button>
        <button class="share-btn">🔁 Compartilhar</button>
      </div>

      <div class="comments-section">
        <input type="text" placeholder="Escreva um comentário..." class="comment-input">
        <div class="comment-list"></div>
      </div>
    </article>

    <!-- Post 2 -->
    <article class="post">
      <div class="post-header">
        <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Usuário" class="avatar">
        <div class="user-info">
          <strong>Maria Oliveira</strong>
          <span>Ontem às 18:30</span>
        </div>
      </div>

      <div class="post-content">
        <p>Primeiro dia na academia! 💪 #Foco #Saúde</p>
        <img src="https://picsum.photos/600/300?random=2" alt="Imagem do post">
      </div>

      <div class="post-actions">
        <button class="like-btn">👍 Curtir <span class="like-count">0</span></button>
        <button class="comment-btn">💬 Comentar</button>
        <button class="share-btn">🔁 Compartilhar</button>
      </div>

      <div class="comments-section">
        <input type="text" placeholder="Escreva um comentário..." class="comment-input">
        <div class="comment-list"></div>
      </div>
    </article>
  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
