<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Completo com Todas as Tags</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; }
    header, footer { background:#333; color:#fff; padding:1rem; text-align:center; }
    main { display:flex; min-height:70vh; }
    aside { width:250px; background:#222; color:#fff; padding:1rem; }
    section { flex:1; padding:1rem; background:#fff; }
    nav a { color: yellow; text-decoration:none; margin-right:10px; }
    img { max-width:200px; display:block; margin:1rem 0; }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Projeto Completo</h1>
    <nav>
      <a href="#inicio">Início</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <main id="main">
    <aside>
      <h2>Menu</h2>
      <ul>
        <li><a href="#opt1">Opção 1</a></li>
        <li><a href="#opt2">Opção 2</a></li>
      </ul>
    </aside>

    <section>
      <h2>Conteúdo Principal</h2>
      <span style="color:#555; display:block; margin-bottom:1rem;">Este é um texto dentro de uma tag SPAN obrigatória.</span>
      <img src="https://via.placeholder.com/200" alt="Imagem Exemplo">

      <div>
        <p>Este é um bloco de conteúdo dentro de uma DIV obrigatória.</p>
      </div>

      <canvas id="meuCanvas" width="400" height="200" style="border:1px solid #000"></canvas>
    </section>
  </main>

  <footer>
    © 2025 - Projeto Completo com Todas as Tags
  </footer>

  <script>
    const ctx = document.getElementById('meuCanvas').getContext('2d');
    ctx.fillStyle = 'red';
    ctx.fillRect(20, 20, 150, 80);
  </script>
<script src="script.js"></script></body>
</html>
