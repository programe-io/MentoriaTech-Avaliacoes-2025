<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Social.Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-800 to-blue-900 min-h-screen text-white">
  <!-- HEADER -->
  <header class="shadow-md p-5 flex justify-between items-center bg-blue-900">
    <div class="uppercase font-bold text-xl">
      Logo
    </div> 
    <nav class="flex gap-6 font-bold">
      <a href="#" class="hover:text-gray-300">Início</a>
      <a href="#" class="hover:text-gray-300">Sobre</a>
      <a href="#" class="hover:text-gray-300">Contato</a>
    </nav>
  </header>

  <!-- MAIN FEED -->
  <main class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold underline text-center mb-6">Social Feed</h1>

    <!-- POST CARD -->
    <div class="bg-blue-950 shadow-md rounded-lg p-4 mb-6">
      <!-- Cabeçalho do Post -->
      <div class="flex items-center gap-3 mb-3">
        <img class="h-12 w-12 rounded-full" src="https://th.bing.com/th/id/R.294539556bfa5292b1ba4f916f5dc445?rik=O81X%2fbvOUZuE2g&riu=http%3a%2f%2fwww.pixelstalk.net%2fwp-content%2fuploads%2f2015%2f12%2fnike-logo-wallpapers-white-black.jpg&ehk=OS8whl5LL8mGvd2rrN9gSVQTttmuXNkqsxEUEoaQG84%3d&risl=&pid=ImgRaw&r=0" alt="Avatar">
        <h2 class="font-bold">FroJHo</h2>
      </div>

      <!-- Imagem do Post -->
      <div class="mb-3">
        <img class="w-full rounded-lg" src="https://barbearia.org/wp-content/uploads/2023/06/Fotos-tenis-mais-vendido-da-nike.webp" alt="Imagem do post">
      </div>

      <!-- Texto e tempo -->
      <div>
        <p class="mb-2">
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
          Et repellendus possimus porro assumenda molestiae,
          reiciendis praesentium enim iure ea dolor quidem magni?
        </p>
        <span class="text-sm text-gray-400">há 10 minutos</span>
      </div>
    </div>
  </main>
</body> 
</html>
