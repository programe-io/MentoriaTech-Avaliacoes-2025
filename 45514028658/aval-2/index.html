<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuteira Shop - Chuteiras de Campo</title>
    <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <div class="logo">
            <h1><a href="/">CHUTEIRA SHOP</a></h1>
        </div>
        <nav class="menu-principal">
            <ul>
                <li><a href="categoria.html?tipo=campo">Campo</a></li>
                <li><a href="categoria.html?tipo=society">Society</a></li>
                </ul>
        </nav>
        <div class="icones-usuario">
            <a href="busca.html" title="Buscar"><img src="icon-busca.svg" alt="Buscar"></a>
            <a href="carrinho.html" title="Meu Carrinho"><img src="icon-carrinho.svg" alt="Carrinho"></a>
        </div>
    </header>

    <main class="conteudo-categoria">

        <h2>Chuteiras de Campo</h2>

        <div class="vitrine-layout">

            <aside class="barra-lateral-filtros">
                <h3>Filtrar Resultados</h3>
                
                <section class="filtro-grupo">
                    <h4>Marca</h4>
                    <ul>
                        <li><label><input type="checkbox" name="marca" value="nike"> Nike</label></li>
                        <li><label><input type="checkbox" name="marca" value="adidas"> Adidas</label></li>
                        <li><label><input type="checkbox" name="marca" value="puma"> Puma</label></li>
                    </ul>
                </section>

                <section class="filtro-grupo">
                    <h4>Preço</h4>
                    <input type="range" min="100" max="1500" value="1500" class="slider-preco">
                    <p>Até: R$ <span id="valor-preco">1500</span></p>
                </section>

                <section class="filtro-grupo">
                    <h4>Tamanho</h4>
                    <div class="tamanhos-disponiveis">
                        <span class="tamanho-chip">38</span>
                        <span class="tamanho-chip">39</span>
                        <span class="tamanho-chip">40</span>
                        <span class="tamanho-chip">41</span>
                    </div>
                </section>
                
                <button class="botao-aplicar">Aplicar Filtros</button>
            </aside>

            <section class="lista-produtos-categoria">
                
                <article class="produto-card" data-id="pdt-nike-phantom-001">
                    <a href="produto-1.html">
                        <img src="chuteira-modelo-a.jpg" alt="Chuteira Nike Phantom">
                        <h3>Nike Phantom GT Elite FG</h3>
                        <p class="preco">R$ 999,90</p>
                        <span class="tipo-campo">Campo</span>
                    </a>
                    <button class="adicionar-carrinho">Adicionar ao Carrinho</button>
                </article>

                <article class="produto-card" data-id="pdt-adidas-predator-002">
                    <a href="produto-2.html">
                        <img src="chuteira-modelo-b.jpg" alt="Chuteira Adidas Predator">
                        <h3>Adidas Predator Edge.1 TF</h3>
                        <p class="preco-antigo">R$ 799,90</p>
                        <p class="preco-promocao">R$ 649,90</p>
                        <span class="tipo-campo">Society</span>
                    </a>
                    <button class="adicionar-carrinho">Adicionar ao Carrinho</button>
                </article>
                
                </section>

        </div>
    </main>

    <footer class="rodape">
        <div class="copyright">
            <p>&copy; 2024 Chuteira Shop. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
