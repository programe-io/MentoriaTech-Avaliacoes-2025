<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Social - Avaliação</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- CABEÇALHO -->
  <header class="topo">
    <div class="logo">LOGO</div>

    <nav class="menu">
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <!-- PERFIL -->
  <section class="perfil">
    <img src="https://i.pravatar.cc/100?img=3" alt="Foto de perfil">
    <h2>FroJho</h2>
  </section>

  <!-- LISTA DE POSTS -->
  <main class="posts">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1606755962773-bfe9a092d8b2?auto=format&fit=crop&w=600&q=80" alt="Hambúrguer delicioso">
      <p>🍔 Novo lanche especial da semana! Peça o seu agora!</p>
      <span>❤️ 152 curtidas</span>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1606813902971-cb7b0b4d2b52?auto=format&fit=crop&w=600&q=80" alt="Aplicativo de delivery em smartphone">
      <p>📱 Nosso app de delivery ficou de cara nova — confira!</p>
      <span>❤️ 98 curtidas</span>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1549923746-c502d488b3ea?auto=format&fit=crop&w=600&q=80" alt="Mapa de entrega no celular">
      <p>🗺️ Agora entregamos em toda a cidade! Veja as rotas no app.</p>
      <span>❤️ 203 curtidas</span>
    </div>

  </main>

</body>
</html>
