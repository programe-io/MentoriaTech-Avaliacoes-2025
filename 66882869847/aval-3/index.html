<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">LOGO</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Amigos</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <!-- FEED -->
    <main class="feed" id="feed">

        <!-- CARD OBRIGATÓRIO COM IMG, H2 E SPAN -->
        <div class="card">
            <div class="usuario">
                <img src="https://i.imgur.com/6VBx3io.png" alt="foto usuário">
                <h3>Isaac Prado</h3>
            </div>

            <h2>Publicação</h2>

            <!-- SPAN OBRIGATÓRIO -->
            <span class="descricao-curta">Uma descrição rápida da publicação</span>

            <img src="https://i.imgur.com/PU1G6Lm.png" class="img-post" alt="post imagem">

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Quod beatae quas nihil sed fugit voluptatibus repellat delectus
                ut tempora debitis est dolorum deserunt.
            </p>

            <div class="tempo">há 10 minutos</div>
        </div>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
