<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link href="style.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex items-center">
    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      Venda de bolos
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>
      <a href="#" class="hover:text-blue-400">Amigos</a>
      <a href="#" class="hover:text-blue-400">Perfil</a>
    </nav>
  </header>

  <!-- POSTS -->
  <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://guiadacozinha.com.br/wp-content/uploads/2019/04/Bolo-de-abacaxi-facil.jpg" alt="">
        <h2 class="text-lg font-semibold">Bolo de abacaxi</h2>
      </div>
      <!-- CARD IMAGE -->
      <img class="w-full h-48 object-cover" src="https://guiadacozinha.com.br/wp-content/uploads/2019/04/Bolo-de-abacaxi-facil.jpg" alt="">
      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
        Bolo de abacaxi com uma cobertura saborosa.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://s2-receitas.glbimg.com/mkFHOXlrBLlpqP3eaRxMbcucn_Q=/1280x0/filters:format(jpeg)/https://i.s3.glbimg.com/v1/AUTH_1f540e0b94d8437dbbc39d567a1dee68/internal_photos/bs/2022/f/f/DLO9veTbiW41gbCjujVQ/bolo-de-morango-com-chantilly-receita.jpg" alt="">
        <h2 class="text-lg font-semibold">Bolo de morango</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://s2-receitas.glbimg.com/mkFHOXlrBLlpqP3eaRxMbcucn_Q=/1280x0/filters:format(jpeg)/https://i.s3.glbimg.com/v1/AUTH_1f540e0b94d8437dbbc39d567a1dee68/internal_photos/bs/2022/f/f/DLO9veTbiW41gbCjujVQ/bolo-de-morango-com-chantilly-receita.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          .bolo de morango com chantilly
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://www.mebrasi.com.br/wp-content/uploads/2020/12/bolo-cenoura.jpg" alt="">
        <h2 class="text-lg font-semibold">Bolo de cenoura</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://www.mebrasi.com.br/wp-content/uploads/2020/12/bolo-cenoura.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Bolo de cenoura com cobertura de chocolate.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

  </main>

</body>
</html>
