<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Social</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
  <header>
    <h2>Bem-vindo ao seu feed</h2>
    <p>Este é um espaço para compartilhar suas ideias e posts.</p>
    <span class="info-span">Divirta-se postando!</span>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Perfil</a></li>
        <li><a href="#">Configurações</a></li>
      </ul>
    </nav>
    <img src="https://via.placeholder.com/120x40" alt="Logo do site" class="logo">
    <h1>Meu Feed Social</h1>
  </header>

  <main>
    <section class="post-form">
      <textarea id="postInput" placeholder="O que está pensando?"></textarea>
      <button onclick="addPost()">Publicar</button>
    </section>

    <section id="feed" class="feed"></section>
  </main>

  <script>
    function addPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if (text === '') return;

      const feed = document.getElementById('feed');
      const post = document.createElement('div');
      post.className = 'post';
      post.innerHTML = `<p>${text}</p>`;

      feed.prepend(post);
      input.value = '';
    }
  </script>
  </div>
</body>
</html>
