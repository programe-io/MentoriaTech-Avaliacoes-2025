<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Robótico Interativo</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <div class="container">
        <h1>Controle do Sistema Robótico</h1>
        
        <div class="robot-area">
            <div class="robot" id="robot"></div>
        </div>

        <div class="controls">
            <h2>Painel de Controle</h2>
            <button onclick="moveRobot('up')">Cima</button>
            <button onclick="moveRobot('down')">Baixo</button>
            <button onclick="moveRobot('left')">Esquerda</button>
            <button onclick="moveRobot('right')">Direita</button>
            <button onclick="resetPosition()">Resetar</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
