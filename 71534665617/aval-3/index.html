        <h1>O Fascinante Mundo das Tulipas</h1>

        <p>As tulipas são flores da primavera conhecidas por suas cores vibrantes e formatos elegantes.</p>
        
        <button onclick="changeTulipColor()">Mudar Cor da Tulipa</button>
