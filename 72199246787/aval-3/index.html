<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Minha Galeria de Imagens</title>
    <style>
        /* CSS Básico para visualização inicial */
        .galeria-container {
            display: flex; /* Permite que os itens fiquem lado a lado */
            flex-wrap: wrap; /* Faz com que os itens quebrem para a próxima linha */
            gap: 10px; /* Espaçamento entre os itens da galeria */
            padding: 10px;
        }

        .galeria-item {
            flex-basis: calc(33.333% - 10px); /* 3 itens por linha (100%/3 - o espaço do gap) */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            overflow: hidden; /* Garante que a imagem se ajuste ao container */
        }

        .galeria-item img {
            width: 100%; /* A imagem ocupa toda a largura do seu container */
            height: auto;
            display: block;
            transition: transform 0.3s ease; /* Efeito de transição para o hover */
        }
        
        .galeria-item img:hover {
            transform: scale(1.05); /* Zoom suave ao passar o mouse */
        }

        /* Responsividade básica para telas menores */
        @media (max-width: 600px) {
            .galeria-item {
                flex-basis: calc(50% - 10px); /* 2 itens por linha em telas pequenas */
            }
        }
        @media (max-width: 400px) {
            .galeria-item {
                flex-basis: 100%; /* 1 item por linha em telas muito pequenas */
            }
        }
    </style>
