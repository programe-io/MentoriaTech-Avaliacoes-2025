<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link rel="stylesheet" href="./style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 h-screen text-white">
  
  <header class="shadow-md p-5 flex">
    <div class="flex-1 uppercase font-bold text-center md:text-left">
      Logo
    </div>

    <nav class="font-bold gap-3 hidden md:flex">
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <!-- POST LIST -->
  <main class="py-4 px-2 flex flex-col gap-6 md:flex-row items-center justify-center flex-wrap">

    <!-- POST CARD -->
    <div class="post-card bg-gray-800 rounded-lg shadow-md max-w-96">

      <!-- CARD HEADER -->
      <div class="card-header text-center px-4 pb-4">
        <img class="profile-img" src="Dean.jpg" alt="Foto de perfil de EroJho">
        <h2 class="username">EroJho</h2>
      </div>

      <!-- CARD IMAGE -->
      <img class="post-image" src="supernatural.jpg" alt="Imagem da postagem">

      <!-- CARD CONTENT -->
      <div class="card-content px-4 pt-4">
        <p class="text-sm text-justify">
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Velit dicta error 
          suscipit quas autem laudantium consectetur, maxime cumque magnam explicabo 
          eius esse nesciunt facere odio iusto! Unde animi autem nobis?
        </p>

        <span class="text-xs text-gray-300 text-right block mt-4">há 10 minutos</span>
      </div>
    </div>

  </main>

</body>
</html>
