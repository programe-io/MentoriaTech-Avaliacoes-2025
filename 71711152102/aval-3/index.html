<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Cards</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <div>
      <h1><span>Meu</span> Blog</h1>
    </div>
  </header>

  <nav>
    <div>
      <span><a href="#">Início</a></span> |
      <span><a href="#">Posts</a></span> |
      <span><a href="#">Contato</a></span>
    </div>
  </nav>

  <main>
    <section>
      <div>

        <article>
          <div>
            <img src="post1.jpg" alt="Imagem do Post 1" width="300">
          </div>
          <div>
            <h2><span>Post</span> Card 1</h2>
            <p>
              <span>Resumo:</span> Um pequeno texto chamativo para o leitor.
            </p>
          </div>
        </article>

        <article>
          <div>
            <img src="post2.jpg" alt="Imagem do Post 2" width="300">
          </div>
          <div>
            <h2><span>Post</span> Card 2</h2>
            <p>
              <span>Resumo:</span> Conteúdo interessante e relevante.
            </p>
          </div>
        </article>

        <article>
          <div>
            <img src="post3.jpg" alt="Imagem do Post 3" width="300">
          </div>
          <div>
            <h2><span>Post</span> Card 3</h2>
            <p>
              <span>Resumo:</span> Clique para ler mais detalhes.
            </p>
          </div>
        </article>

      </div>
    </section>

    <aside>
      <div>
        <h3><span>Sobre</span> o Blog</h3>
        <p>
          <span>Descrição:</span> Um blog simples com post cards em HTML.
        </p>
      </div>
    </aside>
  </main>

  <footer>
    <div>
      <p>
        <span>&copy; 2025</span> - <span>Meu Blog</span>
      </p>
    </div>
  </footer>

</html>
