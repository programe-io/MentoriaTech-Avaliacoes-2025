<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Variedade & Estilo</title>
  <link rel="stylesheet" href="styles.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">Variedades & Estilo</h1>
      <div class="controls">
        <input id="search" type="search" placeholder="Pesquisar produtos..." aria-label="Pesquisar produtos" />
        <select id="sort">
          <option value="default">Ordenar</option>
          <option value="price-asc">Menor preço</option>
          <option value="price-desc">Maior preço</option>
          <option value="name">Nome</option>
        </select>
        <button id="cart-button" class="cart-btn" aria-controls="cart">Carrinho (<span id="cart-count">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Bem-vindo à nossa loja</h2>
      <p>Produtos selecionados, entrega rápida e checkout simples.</p>
    </section>

    <section>
      <div id="products" class="products-grid" aria-live="polite"></div>
    </section>
  </main>

  <aside id="cart" class="cart">
    <div class="cart-header">
      <h3>Seu Carrinho</h3>
      <button id="close-cart" aria-label="Fechar carrinho">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">Total: R$ <span id="cart-total">0.00</span></div>
      <div class="cart-actions">
        <button id="clear-cart" class="btn btn-danger">Limpar</button>
        <button id="checkout" class="btn btn-primary">Finalizar compra</button>
      </div>
    </div>
  </aside>

  <div id="cart-backdrop" class="backdrop" hidden></div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Variedade & Estilo — Projeto de Avaliação</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
