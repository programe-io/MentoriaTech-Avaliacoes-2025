<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Card Completo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        header {
            background: #4A6CFF;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #3248b7;
            text-align: center;
            padding: 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        section {
            width: 350px;
        }

        article {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        article img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        article .content {
            padding: 15px;
        }

        article h2 {
            margin: 0;
            font-size: 24px;
        }

        article p {
            margin-top: 10px;
            font-size: 15px;
            color: #555;
        }

        span.tag {
            background: #4A6CFF;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        footer {
            background: #ddd;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
            font-weight: bold;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <h1>Meu Post Card</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Cards</a>
        <a href="#">Contato</a>
    </nav>

    <main>
        <section>

            <article>
                <img src="https://picsum.photos/600/300" alt="Imagem do Card">

                <div class="content">
                    <h2>Título do Card <span class="tag">Novo</span></h2>
                    <p>
                        Este é um exemplo de post card criado usando todas as tags solicitadas, 
                        incluindo <span class="tag">span</span> para marcar elementos especiais no texto.
                    </p>
                </div>
            </article>

        </section>
    </main>

    <footer>
        © 2025 — Post Card Completo
    </footer>

</body>
</html>
