<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Céu Encantado</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1><span>Céu Encantado</span></h1>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Galeria</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Seção do Céu -->
        <section class="sky">
            <div class="sun"></div>
            <div class="moon"></div>
            <div class="stars"></div>
        </section>

        <!-- Galeria de imagens com informações -->
        <section class="gallery">
            <h2>Minhas Imagens do Céu</h2>

            <div class="image-card">
                <img src="https://img.freepik.com/fotos-gratis/ao-por-do-sol-na-praia-tropical-e-no-mar-com-coqueiro_74190-1075.jpg" alt="Imagem do pôr do sol">
                <div class="info">
                    <h3>Pôr do Sol Laranja</h3>
                    <p>Um lindo pôr do sol com tons alaranjados e lilases no horizonte.</p>
                </div>
            </div>

            <div class="image-card">
                <img src="https://img.pikbest.com/back_our/bg/20200713/bg/7994c507ba072_356941.jpg!w700wp" alt="Imagem da lua">
                <div class="info">
                    <h3>Luar Prateado</h3>
                    <p>Lua cheia iluminando a noite estrelada.</p>
                </div>
            </div>

            <div class="image-card">
                <img src="https://img.freepik.com/fotos-premium/silhuetas-de-arvores-contra-o-ceu-a-noite_1048944-23229915.jpg?semt=ais_hybrid&w=740&q=80" alt="Imagem das estrelas">
                <div class="info">
                    <h3>Céu Estrelado</h3>
                    <p>Noite clara repleta de estrelas brilhantes.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Céu Encantado</p>
    </footer>
</body>
</html>
