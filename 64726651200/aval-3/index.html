<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plano de Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-100 p-6">

  <!-- HEADER -->
  <header class="bg-white shadow-md p-4 mb-6 rounded-xl flex justify-between items-center">
    <h1 class="text-2xl font-bold">Meu Plano de Estudos</h1>
    <nav>
      <ul class="flex gap-6 text-lg">
        <li><a href="#" class="hover:text-blue-600">Início</a></li>
        <li><a href="#cards" class="hover:text-blue-600">Planos</a></li>
        <li><a href="#contato" class="hover:text-blue-600">Contato</a></li>
      </ul>
    </nav>
  </header>

  

  <main id="cards" class="max-w-6xl mx-auto">
  <!-- GRID DE CARDS -->
  <div class="cards grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">

    <!-- CARD 1 -->
    <div class="card bg-white shadow-lg rounded-xl p-4">
      <img src="https://i.pinimg.com/736x/c6/ba/a6/c6baa67b32d4fda9b32ce8ee4f45cdaa.jpg" alt="Cronograma de Estudos" />
      <h2>Cronograma de Estudos</h2>
      <span>Organização</span>
      <p>Planeje seus horários e mantenha a constância.</p>
    </div>

    <!-- CARD 2 -->
    <div class="card bg-white shadow-lg rounded-xl p-4">
      <img src="https://i.pinimg.com/736x/26/96/13/269613f64b7d14318e4032e7d0a0cdcc.jpg" alt="Checklist de Estudos" />
      <h2>Checklist Diário</h2>
      <span>Prioridades</span>
      <p>Marque o que já foi concluído e avance no dia.</p>
    </div>

    <!-- CARD 3 -->
    <div class="card bg-white shadow-lg rounded-xl p-4">
      <img src="https://i.pinimg.com/736x/9a/4e/ea/9a4eeac5d30ef4f984d148e1ec0aa3d3.jpg" alt="Tabela de Estudos" />
      <h2>Tabela de Metas</h2>
      <span>Progresso</span>
      <p>Acompanhe sua evolução ao longo da semana.</p>
    </div>

  </div>
</main>

</body>
</html>
