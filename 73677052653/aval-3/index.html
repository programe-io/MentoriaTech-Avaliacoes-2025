<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>CAMINHÃO</title> 
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>  
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head> 
 
<body class="bg-gradient-to-b from-blue-800 to-blue-900 min-h-screen text-white">  
 
    <header class="shadow-md p-5 flex items-center bg-blue-950/50"> 
 
        <div class="flex-1 uppercase font-extrabold text-2xl"> 
            AM caminhões
        </div> 
        <nav class="font-bold flex gap-4 hidden md:flex"> 
            <a href="#Inicio" class="hover:text-blue-300 transition duration-300">Início</a> 
            <a href="#Produtos" class="hover:text-blue-300 transition duration-300">Produtos</a> 
            <a href="#Contato" class="hover:text-blue-300 transition duration-300">Contato</a> 
        </nav> 
    </header> 
 
    <main class="py-6 px-4 flex flex-col gap-6 md:flex-row md:justify-center">  
         
        <div class="bg-gray-800 p-4 rounded-lg shadow-xl md:w-1/3 w-full">  
             
            <div class="flex items-center pb-4 gap-3">  
                 
                <img class="h-12 w-12 rounded-full border-2 border-blue-500 object-cover" 
src="https://mlqt0se4pk9p.i.optimole.com/q:85/https://www.autodata.com.br/wordpress/wp-content/uploads//2024/01/VOLVO-FH-scaled.jpg" alt="Foto de Perfil">  
                 
                <h2 class="text-xl font-semibold"> AM caminhões </h2>  
            </div> 
             
            <img class="w-full rounded-lg max-h-60 object-cover" 
src="https://mlqt0se4pk9p.i.optimole.com/q:85/https://www.autodata.com.br/wordpress/wp-content/uploads//2024/01/VOLVO-FH-scaled.jpg" alt="Imagem"> 
             
            <div class="pt-4">  
                <p class="text-sm text-justify text-gray-200"> 
                   Caminhão na estrada, fé no motor, Deus no comando.
                </p> 
 
                <span class="text-xs text-gray-400 block text-right mt-4">  
                    18 minutos 
                </span> 
            </div> 
        </div> 
 
        <div class="bg-gray-800 p-4 rounded-lg shadow-xl md:w-1/3 w-full">  
             <h3 class="text-lg font-bold mb-2">CAMINHÃO BRANCO</h3> 
             <p class="text-sm text-gray-300"> R$ 350,000.00</p> 
             <img class="w-full rounded-lg mt-2 max-h-32 object-cover" 
src="https://mlqt0se4pk9p.i.optimole.com/q:85/https://www.autodata.com.br/wordpress/wp-content/uploads//2024/01/VOLVO-FH-scaled.jpg" alt="2"> 
        </div> 
 
        <div class="bg-gray-800 p-4 rounded-lg shadow-xl md:w-1/3 w-full">  
             <h3 class="text-lg font-bold mb-2">CAMINHÃO VERDE</h3> 
             <p class="text-sm text-gray-300">. R$ 150,00.00</p> 
             <img class="w-full rounded-lg mt-2 max-h-32 object-cover" 
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSW4KbN3TG87EEkkl1TtLO9fQ9kT-lYnQPydw&s" alt="3"> 
</div>
