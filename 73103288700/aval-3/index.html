<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Social Feed</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="topbar">
    <h2 class="page-title">Social Feed</h2>

    <div class="logo">LOGO</div>

    <nav class="menu">
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <main class="feed">
    <article class="card">
      <figure>
        <img src="https://images.pexels.com/photos/3225517/pexels-photo-3225517.jpeg" alt="Paisagem noturna com baleia">
        <figcaption>Ilustração de uma noite estrelada com uma baleia saltando no mar.</figcaption>
      </figure>
      <div class="card-header">
        <h2 class="card-user">loren</h2>
      </div>
      <p class="text">
        
      </p>
      <span class="time">há 10 minutos</span>
    </article>

    <article class="card">
      <figure>
        <img src="https://images.pexels.com/photos/3586966/pexels-photo-3586966.jpeg" alt="Casas iluminadas à noite">
        <figcaption>Cidade iluminada à noite com casas coloridas.</figcaption>
      </figure>
      <div class="card-header">
        <h2 class="card-user">loren</h2>
      </div>
      <p class="text">
        
      </p>
      <span class="time">há 10 minutos</span>
    </article>

    <article class="card">
      <figure>
        <img src="https://images.pexels.com/photos/572897/pexels-photo-572897.jpeg" alt="Montanhas ao pôr do sol">
        <figcaption>Cadeia de montanhas com céu alaranjado ao pôr do sol.</figcaption>
      </figure>
      <div class="card-header">
        <h2 class="card-user">loren</h2>
      </div>
      <p class="text">
        
      </p>
      <span class="time">há 10 minutos</span>
    </article>
  </main>
</body>
</html>
