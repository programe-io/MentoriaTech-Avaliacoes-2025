!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sobre Mim</title>
<style>
<<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sobre Mim — Completo com Span</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* HEADER */
header {
    text-align: center;
    padding: 30px 0;
    background: linear-gradient(90deg, #ff8c00, #ff0080);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* NAV */
nav {
    text-align: center;
    margin: 15px 0;
    font-family: Arial, sans-serif;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #444;
    font-weight: bold;
    transition: color 0.3s;
}

nav a:hover {
    color: #ff0080;
}

/* MAIN */
main {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    background: linear-gradient(135deg, #ece9ff, #ffe7f3);
    font-family: Arial, sans-serif;
}

/* ASIDE */
aside {
    width: 400px;
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* ARTICLE */
article {
    padding: 10px;
    text-align: center;
}

/* DIV container */
article .container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TÍTULO H2 */
h2 {
    font-size: 26px;
    margin-bottom: 10px;
    color: #333;
}

/* TÍTULO H3 */
h3 {
    font-size: 22px;
    margin-bottom: 15px;
    color: #555;
}

/* PARÁGRAFO */
p {
    font-size: 16px;
    color: #555;
    margin-bottom: 20px;
    line-height: 1.5;
}

/* SPAN de destaque */
p span {
    color: #ff0080;
    font-weight: bold;
}

/* IMAGEM DE PERFIL */
img.perfil {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid #ff0080;
    object-fit: cover;
    margin-bottom: 15px;
}

/* BOTÃO COM GRADIENTE ANIMADO */
a.sobre-mim {
    display: inline-block;
    text-align: center;
    padding: 14px 25px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    color: white;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
    background-size: 400%;
    animation: gradientFlow 6s ease infinite;
    transition: transform 0.3s;
}

a.sobre-mim:hover {
    transform: scale(1.05);
}

/* ANIMAÇÃO DO GRADIENTE */
@keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    Meu Portfólio
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Projetos</a>
    <a href="#">Contato</a>
</nav>

<main>
    <aside>
        <article>
            <div class="container">
                <h2>Olá, eu sou Lívia Clara </h2>
                <h3>Sobre Mim</h3>
                <img src="https://via.placeholder.com/150" alt="Minha Foto" class="perfil">
                <p>Sou um(a) desenvolvedor(a) apaixonado(a) por <span>tecnologia</span> e <span>design</span>. Gosto de criar interfaces modernas, intuitivas e responsivas.</p>
                <a href="#" class="sobre-mim">Clique para saber mais</a>
            </div>
        </article>
    </aside>
</main>

</body>
</html>
