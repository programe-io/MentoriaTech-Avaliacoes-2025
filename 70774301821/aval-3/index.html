<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraqueWear - Loja de Roupas Estilo Jogador</title>

<style>
/* ----------------------  CSS  ---------------------- */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

header {
  background: #0A2150;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 { margin: 0; }

nav button {
  background: #FFD400;
  border: none;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

.hero {
  background: url('https://images.pexels.com/photos/11670661/pexels-photo-11670661.jpeg') center/cover no-repeat;
  color: white;
  padding: 120px 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.card img {
  width: 100%;
  border-radius: 10px;
  height: 260px;
  object-fit: cover;
}

.card h3 { margin-bottom: 5px; }
.card p { font-size: 14px; color: #555; }
.card button {
  background: #0A2150;
  color: white;
  border: none;
  padding: 8px 12px;
  margin-top: 10px;
  cursor: pointer;
  border-radius: 6px;
}

footer {
  text-align: center;
  padding: 20px;
  background: #0A2150;
  color: white;
  margin-top: 40px;
}

#cartBox {
  position: fixed;
  top: 0;
  right: -350px;
  width: 320px;
  height: 100vh;
  background: white;
  box-shadow: -2px 0 8px rgba(0,0,0,0.2);
  padding: 20px;
  transition: 0.3s;
  overflow-y: auto;
}

.cart-item {
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header>
  <h1>CraqueWear</h1>
  <nav>
    <button onclick="toggleCart()">Carrinho (<span id='cartCount'>0</span>)</button>
  </nav>
</header>

<div class="hero">
  Vista como os craques. Estilo de jogo, treino e rua.
</div>

<div class="container">
  <h2>Produtos em Destaque</h2>

  <div class="grid" id="productsGrid"></div>
</div>

<div id="cartBox">
  <h2>Carrinho</h2>
  <div id="cartItems"></div>
  <h3>Total: R$ <span id="cartTotal">0.00</span></h3>
  <button onclick="clearCart()">Limpar Carrinho</button>
</div>

<footer>
  © 2025 CraqueWear — Estilo jogador, dentro e fora do campo.
</footer>

<script>
/* ----------------------  JAVASCRIPT  ---------------------- */

const products = [
  {
    id: 1,
    name: "Camisa Treino Pro",
    price: 129.90,
    img: "https://images.pexels.com/photos/5886048/pexels-photo-5886048.jpeg"
  },
  {
    id: 2,
    name: "Jaqueta Warm-Up Elite",
    price: 249.90,
    img: "https://images.pexels.com/photos/6311571/pexels-photo-6311571.jpeg"
  },
  {
    id: 3,
    name: "Chuteira Street Control",
    price: 359.90,
    img: "https://images.pexels.com/photos/3622613/pexels-photo-3622613.jpeg"
  },
  {
    id: 4,
    name: "Moletom Pós-Jogo",
    price: 199.90,
    img: "https://images.pexels.com/photos/7679723/pexels-photo-7679723.jpeg"
  },
  {
    id: 5,
    name: "Shorts Drible Rápido",
    price: 89.90,
    img: "<img src="https://www.highsnobiety.com/static-assets/dato/1697789107-arsenal.jpg" alt="The Ultimate Guide To Football And Fashion | Highsnobiety"/>
  },
  {
    id: 6,
    name: "Meião Profissional",
    price: 39.90,
    img: <img src="https://www.highsnobiety.com/static-assets/dato/1697789107-arsenal.jpg" alt="The Ultimate Guide To Football And Fashion | Highsnobiety"/>
  }
];

let cart = [];

/* Renderizar produtos */
const grid = document.getElementById("productsGrid");

products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>R$ ${p.price.toFixed(2)}</p>
      <button onclick="addToCart(${p.id})">Adicionar ao Carrinho</button>
    </div>
  `;
});

/* Carrinho */
function toggleCart() {
  let box = document.getElementById("cartBox");
  box.style.right = box.style.right === "0px" ? "-350px" : "0px";
}

function addToCart(id) {
  const product = products.find(p => p.id === id);
  cart.push(product);
  updateCart();
}

function updateCart() {
  document.getElementById("cartCount").innerText = cart.length;

  let cartHTML = "";
  let total = 0;

  cart.forEach((item, i) => {
    total += item.price;
    cartHTML += `
      <div class="cart-item">
        ${item.name} — R$ ${item.price.toFixed(2)}
        <br>
        <button onclick="removeItem(${i})">Remover</button>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = cartHTML;
  document.getElementById("cartTotal").innerText = total.toFixed(2);
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCart();
}

function clearCart() {
  cart = [];
  updateCart();
}
</script>

<script src="script.js"></script></body>
</html>
