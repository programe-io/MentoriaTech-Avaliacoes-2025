<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Online - Eletrônicos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>🛍️ Minha Loja de Eletrônicos</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Ofertas</a>
            <a href="#">Carrinho</a>
        </nav>
    </header>
    
    <div class="container">
        
        <aside class="sidebar">
            <h2>🔎 Filtrar por</h2>
            
            <section class="filter-group">
                <h3>Categoria</h3>
                <label><input type="checkbox" name="category" value="smartphone"> Smartphone</label>
                <label><input type="checkbox" name="category" value="notebook"> Notebook</label>
                <label><input type="checkbox" name="category" value="tv"> TV</label>
            </section>
            
            <section class="filter-group">
                <h3>Preço Máximo</h3>
                <input type="range" id="price-range" min="100" max="5000" value="5000">
                <p>R$ <span id="max-price">5000</span></p>
            </section>
            
            <button onclick="aplicarFiltros()">Aplicar Filtros</button>
        </aside>

        <main class="product-grid" id="product-grid">
            
            <article class="product-card" data-category="smartphone" data-price="2500">
                <img src="https://via.placeholder.com/280x180?text=Smartphone+X10" alt="Smartphone X10">
                <h3>Smartphone X10</h3>
                <p class="price">R$ 2.500,00</p>
                <button class="add-to-cart">Adicionar ao Carrinho</button>
            </article>

            <article class="product-card" data-category="notebook" data-price="4200">
                <img src="https://via.placeholder.com/280x180?text=Notebook+Ultra" alt="Notebook Ultra">
                <h3>Notebook Ultra</h3>
                <p class="price">R$ 4.200,00</p>
                <button class="add-to-cart">Adicionar ao Carrinho</button>
            </article>
            
            </main>

    </div>

    <footer>
        <p>&copy; 2025 Minha Loja Online. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
