<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Feed</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <h1 class="logo">LOGO</h1>

      <!-- SPAN adicionado (obrigatório) -->
      <span class="menu-icon">☰</span>

      <ul class="nav-links">
        <li><a href="#">Início</a></li>
        <li><a href="#">Perfil</a></li>
        <li><a href="#">Configurações</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- CARD 1 -->
    <div class="post-card">
      <div class="post-header">
        <img src="images/profile_01.jpg" alt="Perfil" class="avatar">
        <h2>FroJho</h2>
      </div>

      <div class="post-image">
        <img src="images/post_01.jpg" alt="Post">
      </div>

      <div class="post-content">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod beatae quas nihil sed fugiat fugit repellat delectus ut tempora debitis deserunt.</p>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="post-card">
      <div class="post-header">
        <img src="images/profile_02.jpg" alt="Perfil" class="avatar">
        <h2>Jane Doe</h2>
      </div>

      <div class="post-image">
        <img src="images/post_02.jpg" alt="Post">
      </div>

      <div class="post-content">
        <p>Esse é outro exemplo de card para o feed social feito com HTML, CSS e JavaScript.</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
