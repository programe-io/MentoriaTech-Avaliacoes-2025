<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Completo com Nav</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <h1>Meu <span class="highlight">Site Completo</span></h1>
      <!-- NAV -->
      <nav>
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="main-container">

      <!-- ARTICLE -->
      <article>
        <h2>Bem-vindo!</h2>
        <p>Este é um site de exemplo usando HTML, CSS e JavaScript.</p>
        <img src="https://via.placeholder.com/600x200" alt="Imagem de exemplo">
        <p>Pressione o botão para mudar a cor de fundo:</p>
        <button id="btnColor">Mudar Cor</button>
        <p>Cor atual: <span id="currentColor">#f0f0f0</span></p>
      </article>

      <!-- ASIDE -->
      <aside>
        <div class="aside-container">
          <h3>Informações Extras</h3>
          <p>Conteúdo adicional ou links úteis podem ficar aqui.</p>
          <img src="https://via.placeholder.com/200x150" alt="Imagem lateral">
        </div>
      </aside>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <p>&copy; 2025 Meu Site Completo</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
