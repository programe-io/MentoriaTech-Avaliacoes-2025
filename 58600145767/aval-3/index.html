<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed Completo</title>

    <!-- Importa o arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<header class="header">
    <h1>Logo</h1>
    <nav class="nav">
        <a href="">Início</a>
        <a href="">Amigos</a>
        <a href="">Perfil</a>
    </nav>
    <button class="btn-primary">Menu</button>
</header>

<section class="new-post-box">
    <h2>Criar Publicação</h2>
    <textarea class="new-post-textarea" placeholder="O que você está pensando?"></textarea>
    <br><br>
    <button class="btn-primary">Enviar</button>
</section>

<article class="post-card">
    <div class="post-header">
        <img class="profile-img" src="images/profile_01.jpg">
        <div>
            <h2>Annevic</h2>
            <small>há 2 horas</small>
        </div>
    </div>

    <img class="post-img" src="images/post_01.png">

    <div class="post-content">
        <p>
            Hoje foi um dia incrível para testar novas tecnologias!  
            O que vocês acham desse novo projeto?
        </p>
    </div>

    <div class="post-actions">
        <button>👍 Curtir</button>
        <button>💬 Comentar</button>
        <button>🔄 Compartilhar</button>
    </div>

    <div class="comments-box">
        <div class="comment"><strong class="comment-author">Anna:</strong> Ficou incrível! 👏</div>
        <div class="comment"><strong class="comment-author">Marcelo:</strong> Quero ver mais disso!</div>
        <input class="comment-input" placeholder="Escreva um comentário...">
    </div>
</article>
<main>
    <span>
</body>
</html>
