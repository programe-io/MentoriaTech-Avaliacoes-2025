<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <div class="profile-header">
            <img id="avatar-img" src="avatar-placeholder.png" alt="Avatar FroJho" class="avatar">

        <h2 class="post-title">Design UI/UX - App de Delivery de Comida</h2>

            <img src="screen-placeholder.png" alt="Tela 2 do App (Destaque)" class="app-screen main-screen">
            <img src="screen-placeholder.png" alt="Tela 3 do App" class="app-screen">
        </figure>

        <section class="description-text">
            <p id="lorem-text">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod beatae quae nihil sed fuga
