<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio da Doceria</title>

    <!-- 1️⃣ CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- ==============================================================
         2️⃣ HEADER – logo, título e navegação
         ============================================================== -->
    <header class="site-header">
        <div class="header-container">
            <!-- Logo (pode ser uma imagem ou apenas texto) -->
            <div class="logo">
                <img src="logo.png" alt="Logo da Doceria" width="80" height="80">
                <!-- Se não houver imagem, troque por: <h1>Doceria Doce Sabor</h1> -->
            </div>

            <!-- Título principal -->
            <h1>Doceria Doce Sabor</h1>

            <!-- Navegação rápida (opcional) -->
            <nav class="main-nav">
                <ul>
                    <li><a href="#bolos">Bolos</a></li>
                    <li><a href="#doces">Doces</a></li>
                    <li><a href="#salgados">Salgados</a></li>
                    <li><a href="#bebidas">Bebidas</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ==============================================================
         3️⃣ BUSCA – campo de filtro rápido
         ============================================================== -->
    <section class="search-section">
        <input id="busca-input" type="text"
               placeholder="🔍 Digite o nome do item..."
               autocomplete="off">
    </section>

    <!-- ==============================================================
         4️⃣ CARDÁPIO – categorias e itens
         ============================================================== -->
    <main class="menu">

        <!-- Exemplo de categoria: Bolos -->
        <section class="category" id="bolos">
            <div class="category-header">Bolos</div>

            <div class="item">
                <span class="item-name">Bolo de Chocolate</span>
                <span class="item-price">R$ 45,00</span>
            </div>

            <div class="item">
                <span class="item-name">Bolo de Cenoura com Cobertura</span>
                <span class="item-price">R$ 38,00</span>
            </div>

            <!-- adicione quantos itens quiser -->
        </section>

        <!-- Exemplo de categoria: Doces -->
        <section class="category" id="doces">
            <div class="category-header">Doces</div>

            <div class="item">
                <span class="item-name">Brigadeiro Gourmet</span>
                <span class="item-price">R$ 4,50</span>
            </div>

            <div class="item">
                <span class="item-name">Beijinho de Coco</span>
                <span class="item-price">R$ 4,00</span>
            </div>
        </section>

        <!-- Outras categorias (salgados, bebidas etc.) podem ser adicionadas aqui -->
    </main>

    <!-- ==============================================================
         5️⃣ CARRINHO – visualização dos itens selecionados
         ============================================================== -->
    <section class="cart-section">
        <h2>🛒 Carrinho</h2>

        <ul id="carrinho-lista"></ul>

        <p id="carrinho-total">Total: R$ 0,00</p>

        <button id="carrinho-limpar">Limpar Carrinho</button>
    </section>

    <!-- ==============================================================
         6️⃣ JAVASCRIPT
         ============================================================== -->
    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
