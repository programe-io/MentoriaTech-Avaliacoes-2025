<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minha Página com Imagem e Subtítulo</title>
  <link rel="stylesheet" href="estilo.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <div class="container">
      <h1>Minha Página</h1>
      <nav>
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="conteudo">

        <h2>Bem-vindo à seção principal</h2>

        <div class="imagem">
          <img src="https://via.placeholder.com/800x400.png?text=Minha+Imagem" alt="Imagem de exemplo" />
        </div>

        <p>
          Site mais mais da
          <code>&lt;diva&gt;</code>
          <span class="destaque">Maryaninha</span>
        </p>

        <a href="https://www.exemplo.com" target="_blank">Visite um site</a>

        <br /><br />

        <button onclick="alert('Você clicou no botão!')">Clique Aqui</button>
      </div>
    </div>
  </main>

</body>
</html>
