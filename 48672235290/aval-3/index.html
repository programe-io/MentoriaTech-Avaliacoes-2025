<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- HTML: Cabeçalho da página -->
<header id="meuHeader">
  <h1>Bem-vindo ao meu site!</h1>
  <p>Este é o cabeçalho da página.</p>
</header>

<!-- HTML: Menu de navegação -->
<nav id="meuNav">
  <ul>
    <li><a href="#">Início</a></li>
    <li><a href="#">Sobre</a></li>
    <li><a href="#">Contato</a></li>
  </ul>
</nav>

<!-- HTML: Conteúdo principal -->
<main id="meuMain">
  <div id="minhaDiv">
    <h2>Conteúdo dentro da div</h2>
    <p>Este é um texto dentro de uma div dentro do main. <span id="destaque">Este texto está destacado!</span></p>
    <!-- Imagem dentro da div -->
    <img src="https://via.placeholder.com/150" alt="Imagem de exemplo" id="minhaImagem">
  </div>
  <p>Mais conteúdo do site pode ir aqui.</p>
</main>

  <script src="script.js"></script>
  
</body>
</html>
