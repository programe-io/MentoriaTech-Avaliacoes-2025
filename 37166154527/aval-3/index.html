<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <h1>Meu Feed Social</h1>

        <!-- NAV -->
        <nav class="navbar">
            <a href="#">Início</a>
            <a href="#">Perfil</a>
            <a href="#">Mensagens</a>
            <a href="#">Configurações</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container">

        <h2 class="titulo-feed">Últimas Atualizações</h2>

        <section class="feed">

            <!-- Post 1 -->
            <div class="post">
                <div class="user-info">
                    <img src="https://via.placeholder.com/60" class="user-img">
                    <h3 class="username">João Silva</h3>
                </div>

                <p class="text">
                    Hoje o dia foi <span class="destaque">incrível</span>! 😎🔥
                </p>

                <button class="like-btn">Curtir ❤️</button>
            </div>

            <!-- Post 2 -->
            <div class="post">
                <div class="user-info">
                    <img src="https://via.placeholder.com/60" class="user-img">
                    <h3 class="username">Maria Costa</h3>
                </div>

                <p class="text">
                    Olha essa <span class="destaque">vista maravilhosa</span> do meu passeio! 🌊✨
                </p>

                <button class="like-btn">Curtir ❤️</button>
            </div>

            <!-- Post 3 -->
            <div class="post">
                <div class="user-info">
                    <img src="https://via.placeholder.com/60" class="user-img">
                    <h3 class="username">Lucas Pereira</h3>
                </div>

                <p class="text">
                    Hoje fiz um <span class="destaque">treino pesado</span>! 💪🔥
                </p>

                <button class="like-btn">Curtir ❤️</button>
            </div>

        </section>

    </main>

</body>
</html>
