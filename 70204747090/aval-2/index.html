<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Receitas Caseiras</title> 
  <link rel="stylesheet" href="style-receitas.css"> 
<link href="style.css" rel="stylesheet"></head> 
<body> 
  <header> 
    <h1>Receitas Caseiras</h1> 
  </header> 
 
  <main> 
    <section class="receita"> 
      <h2>Bolo de Cenoura</h2> 
      <img src="https://www.vilma.com.br/wp-content/uploads/2024/04/Banner-
BoloCenoura-2.png" alt="Bolo de Cenoura"> 
      <p>Um clássico da culinária brasileira, fofinho e saboroso.</p>  
      <h3>Ingredientes</h3>       <ul> 
        <li>3 cenouras</li> 
        <li>3 ovos</li> 
        <li>2 xícaras de farinha</li> 
      </ul> 
    </section> 
 
    <section class="formulario">       <h2>Envie sua receita</h2> 
      <form> 
        <label for="nome">Seu nome:</label> 
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required> 
 
        <label for="receita">Receita:</label> 
        <textarea id="receita" name="receita" rows="5" placeholder="Descreva sua receita..." required></textarea> 
 
        <button type="submit">Enviar</button> 
      </form> 
    </section> 
  </main> 
 
  <footer> 
    <p>2025 Receitas Caseiras</p> 
  </footer> 
</body> 
</html>
