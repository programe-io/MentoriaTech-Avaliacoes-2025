<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->

    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      LOGO
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>

      <div class="flex items-center gap-3 p-4">

      <div class="p-4">
        <p class="text-sm text-justify">
          A prai e um lugar excelente.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500"https://prefeitura.rio/wp-content/uploads/2021/12/WhatsApp-Image-2021-12-16-at-16.42.03.jpeg" alt="">

      </div>
      <img class="w-full h-48 object-cover" src="https://prefeitura.rio/wp-content/uploads/2021/12/WhatsApp-Image-2021-12-16-at-16.42.03.jpeg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          um otimo lugar para aliviar a mente.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://png.pngtree.com/thumb_back/fh260/background/20240522/pngtree-abstract-cloudy-background-beautiful-natural-streaks-of-sky-and-clouds-red-image_15684333.jpg" alt="">

      </div>
      <img class="w-full h-48 object-cover" src="https://png.pngtree.com/thumb_back/fh260/background/20240522/pngtree-abstract-cloudy-background-beautiful-natural-streaks-of-sky-and-clouds-red-image_15684333.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          um por do sol radiante.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
