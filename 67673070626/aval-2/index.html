<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Player de Música</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header>
    <h1>Meu Mini Player de Música</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Início</a></li>
      <li><a href="#">Playlist</a></li>
      <li><a href="#">Sobre</a></li>
    </ul>
  </nav>

  <main>
    <article>
      <section class="music-player">
        <aside class="cover-area">
          <img id="cover" src="assets/cover.jpg" alt="Capa do Álbum">
        </aside>

        <div class="info-area">
          <h2 id="title">Nome da Música</h2>
          <h3 id="artist">Nome do Artista</h3>
        </div>

        <div class="progress-container">
          <div id="progress" class="progress"></div>
        </div>

        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="prev" class="control-btn"><i class="fas fa-backward"></i></button>
          <button id="play" class="control-btn main-btn"><i class="fas fa-play"></i></button>
          <button id="next" class="control-btn"><i class="fas fa-forward"></i></button>
        </div>

        <audio id="audio" src="assets/minha-musica.mp3"></audio>
      </section>
    </article>
  </main>

  <footer>
    <p>&copy; 2025 M

  <script src="script.js"></script>
  
</body>
</html>
