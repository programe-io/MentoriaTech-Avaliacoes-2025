<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essência Dinâmica JS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="main-container"> 
        
        <header>
            <div class="container header-content">
                <h1 class="logo">Essência Dinâmica JS</h1>
                
                <nav class="main-nav">
                    <ul>
                        <li><a href="#produtos">Produtos</a></li>
                        <li><a href="#contato">Contato</a></li>
                    </ul>
                </nav>
                
                <button id="carrinho-btn" class="btn-nav">
                    🛒 Carrinho (<span id="contador-carrinho">0</span>)
                </button>
            </div>
        </header>

        <main>
            <div id="banner-area">
                <section id="banner-principal">
                    <div class="banner-overlay">
                        <h2>Perfumes que Contam Histórias</h2>
                        <p>Descubra fragrâncias criadas com paixão e excelência.</p>
                    </div>
                </section>
            </div>

            <section id="produtos" class="container">
                <h2 class="section-title">Nossos Perfumes</h2>
                
                <div id="produtos-grid" class="produtos-grid">
                    <article class="produto-card exemplo-estatico" style="display: none;">
                        <img src="placeholder.jpg" alt="Exemplo Estático" width="100" height="100">
                    </article>
                </div>
            </section>
        </main>

        <footer>
            <div class="container footer-content">
                <p>&copy; 2025 Essência Dinâmica JS. Todos os direitos reservados.</p>
            </div>
        </footer>

        <div id="carrinho-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h3>Seu Carrinho de Compras</h3>
                <div id="carrinho-itens">
                    <p class="carrinho-vazio">O carrinho está vazio.</p>
                </div>
                <div class="carrinho-total">
                    <strong>Total: R$ <span id="carrinho-total-valor">0,00</span></strong>
                </div>
                <button class="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
