<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essência JS - Perfumaria Dinâmica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div id="wrapper"> 
        
        <header>
            <div class="header-container">
                <h1 class="logo">Essência JS</h1>
                <nav>
                    <div class="nav-links">
                        <a href="#produtos">Produtos</a>
                        <a href="#contato">Contato</a>
                    </div>
                </nav>
                <button id="carrinho-btn">
                    🛒 Carrinho (<span id="contador-carrinho">0</span>)
                </button>
            </div>
        </header>

        <main>
            <div id="produtos-secao" class="secao-principal">
                <h2>Nossa Coleção de Perfumes</h2>
                <div id="produtos-grid" class="produtos-grid">
                    
                    <article class="produto-card exemplo-estatico">
                        <img src="https://via.placeholder.com/300x200?text=Perfume+Exemplo" alt="Perfume de Exemplo Estático">
                        <h3>Produto Estático</h3>
                        <p>Descrição de um produto de teste.</p>
                        <p class="preco">R$ 0,00</p>
                        <button class="btn-adicionar" data-id="0" style="display: none;">Adicionar ao Carrinho</button>
                    </article>
                    </div>
            </div>
        </main>

        <footer>
            <div class="footer-container">
                <p>&copy; 2025 Essência JS. Todos os direitos reservados.</p>
            </div>
        </footer>

        <div id="carrinho-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h3>Seu Carrinho de Compras</h3>
                <div id="carrinho-itens">
                    <p class="carrinho-vazio">O carrinho está vazio.</p>
                </div>
                <div class="carrinho-total">
                    <strong>Total: R$ <span id="carrinho-total-valor">0.00</span></strong>
                </div>
                <button class="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
