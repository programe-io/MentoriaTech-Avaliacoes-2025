    <title>Meu Site Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #004aad;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #03396c;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
            margin-bottom: 70px; /* evita sobreposição do footer */
        }

        article {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            flex: 1 1 600px;
        }

        article h2 {
            color: #004aad;
        }

        aside {
            background-color: #e8f0ff;
            border-left: 5px solid #004aad;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            flex: 1 1 250px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        aside h3 {
            color: #004aad;
            margin-top: 0;
        }

        footer {
            background-color: #004aad;
            color: #eee;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            main {
                flex-direction: column;
                align-items: center;
            }

            aside {
                max-width: 90%;
            }
        }
    </style>
