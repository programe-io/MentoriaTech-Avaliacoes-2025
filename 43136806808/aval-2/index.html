<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas Pokémon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #ffcb05;
            color: #3b4cca;
            padding: 20px 0;
            margin: 0;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin: 10px;
            width: 200px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .card h2 {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }

        .card a {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            background-color: #3b4cca;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .card a:hover {
            background-color: #2a3691;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <h1>Cartas Pokémon</h1>
    <div class="cards-container">
        <!-- Carta 1 -->
        <div class="card">
            <img src="https://assets.pokemon.com/assets/cms2/img/cards/web/SM/SM2/SM2_EN_27.png" alt="Pikachu">
            <h2>Pikachu</h2>
            <a href="https://www.pokemon.com/br/pokedex/pikachu" target="_blank">Mais sobre</a>
        </div>

        <!-- Carta 2 -->
        <div class="card">
            <img src="https://assets.pokemon.com/assets/cms2/img/cards/web/SM/SM2/SM2_EN_34.png" alt="Charizard">
            <h2>Charizard</h2>
            <a href="https://www.pokemon.com/br/pokedex/charizard" target="_blank">Mais sobre</a>
        </div>

        <!-- Carta 3 -->
        <div class="card">
            <img src="https://assets.pokemon.com/assets/cms2/img/cards/web/SM/SM2/SM2_EN_11.png" alt="Bulbasaur">
            <h2>Bulbasaur</h2>
            <a href="https://www.pokemon.com/br/pokedex/bulbasaur" target="_blank">Mais sobre</a>
        </div>
    </div>
</body>
</html>
