<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Meu Feed Social</h1>

        <!-- NAV adicionada -->
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Perfil</a></li>
                <li><a href="#">Notificações</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>
    </header>

    <main class="feed">

        <!-- Post 1 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" class="avatar">
                <div>
                    <h3>Maria Souza</h3>
                    <span>2 horas atrás</span>
                </div>
            </div>

            <p class="post-text">
                Hoje fui caminhar no parque e o dia estava incrível! 🌞🌿
            </p>
            <img src="https://via.placeholder.com/600x300" class="post-image">

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
                <button>🔁 Compartilhar</button>
            </div>
        </div>

        <!-- Post 2 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" class="avatar">
                <div>
                    <h2>João Lima</h2>
                    <span>5 horas atrás</span>
                </div>
            </div>

            <p class="post-text">
                Trabalhando em um novo projeto! 🚀
            </p>

            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
                <button>🔁 Compartilhar</button>
            </div>
        </div>

    </main>

</body>
</html>
