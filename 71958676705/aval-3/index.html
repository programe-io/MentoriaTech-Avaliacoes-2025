<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rede Social Simples</title>
  <link rel="stylesheet" href="styles.css" />
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Minha Rede Social</h1>
    <nav>
      <ul>
        <li><a href="#perfil">Perfil</a></li>
        <li><a href="#feed">Feed</a></li>
        <li><a href="#postar">Postar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="perfil">
      <h2>Perfil do Usuário</h2>
      <img src="https://via.placeholder.com/100" alt="Foto do usuário" />
      <p><strong>Nome:</strong> João Silva</p>
      <p><strong>Bio:</strong> Apaixonado por tecnologia e café ☕</p>
    </section>

    <section id="postar">
      <h2>Nova Postagem</h2>
      <form id="formPostagem">
        <textarea id="textoPost" rows="4" placeholder="O que você está pensando?"></textarea><br />
        <button type="submit">Postar</button>
      </form>
    </section>

    <section id="feed">
      <h2>Feed de Postagens</h2>
      <div id="posts">
        <!-- Postagens aparecerão aqui -->
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Minha Rede Social</p>
  </footer>

  <script src="script.js"></script>

<script src="script.js"></script></body>
</html>
<section id="perfil">
  <h2>Perfil do Usuário</h2>
  <img src="https://via.placeholder.com/100" alt="Foto do usuário" />
  <p><strong>Nome:</strong> <span id="nomeUsuario">João Silva</span></p>
  <p><strong>Bio:</strong> <span id="bioUsuario">Apaixonado por tecnologia e café ☕</span></p>
</section>
