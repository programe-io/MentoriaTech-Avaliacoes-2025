<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Jogo Verdadeiro ou Falso</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <header>
                            <h1>Jogo: Verdadeiro ou Falso</h1>
                                    <nav>
                                                <ul>
                                                                <li><a href="#jogo">Jogar</a></li>
                                                                                <li><a href="#regras">Regras</a></li>
                                                                                                <li><a href="#contato">Contato</a></li>
                                                                                                            </ul>
                                                                                                                    </nav>
                                                                                                                        </header>

                                                                                                                            <main>
                                                                                                                                    <article id="game-container">
                                                                                                                                                <h2>Questão Atual</h2>
                                                                                                                                                            <img src="via.placeholder.com" alt="Imagem relacionada à pergunta" id="question-image">
                                                                                                                                                                        <p id="question-text">Aguardando carregar a primeira questão...</p>
                                                                                                                                                                                    <div class="buttons">
                                                                                                                                                                                                    <button onclick="checkAnswer(true)">Verdadeiro</button>
                                                                                                                                                                                                                    <button onclick="checkAnswer(false)">Falso</button>
                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                            <p id="feedback">Seu feedback aparecerá aqui.</p>
                                                                                                                                                                                                                                                    </article>
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                    <aside>
                                                                                                                                                                                                                                                                                <h3>Placar</h3>
                                                                                                                                                                                                                                                                                            <p>Pontuação: <span id="score">0</span></p>
                                                                                                                                                                                                                                                                                                        <p>Questão: <span id="question-count">0</span> / 5</p>
                                                                                                                                                                                                                                                                                                                    <button onclick="startGame()">Reiniciar Jogo</button>
                                                                                                                                                                                                                                                                                                                            </aside>
                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                            <p>&copy; 2025 Jogo Educativo. Todos os direitos reservados.</p>
                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                    </html>
