<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Exemplo</title>
  <link rel="stylesheet" href="assets/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="#">Meu Site</a>
      <button id="navToggle" class="nav-toggle">☰</button>

      <nav id="mainNav" class="nav">
        <ul>
          <li><a href="#home">Início</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#galeria">Galeria</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>

      <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="container hero-inner">
        <div>
          <h1>Bem-vindo ao Site</h1>
          <p>Exemplo feito com HTML, CSS e JavaScript separados.</p>
          <a class="btn" href="#sobre">Saiba mais</a>
        </div>

        <figure class="hero-image">
          <img src="https://picsum.photos/600/400?random=1" alt="Imagem">
        </figure>
      </div>
    </section>

    <section id="sobre" class="container section">
      <h2>Sobre</h2>
      <p>Este site demonstra estrutura separada e interações simples com JS.</p>
    </section>

    <section id="galeria" class="container section">
      <h2>Galeria</h2>
      <div id="gallery" class="gallery"></div>

      <div class="carousel" id="carousel">
        <button id="prev" class="carousel-btn">‹</button>
        <div id="track" class="carousel-track"></div>
        <button id="next" class="carousel-btn">›</button>
      </div>
    </section>

    <section id="contato" class="container section">
      <h2>Contato</h2>

      <form id="contactForm" class="contact-form">
        <label>Nome</label>
        <input id="name" type="text" required>

        <label>E-mail</label>
        <input id="email" type="email" required>

        <label>Mensagem</label>
        <textarea id="message" rows="4" required></textarea>

        <button class="btn" type="submit">Enviar</button>
        <p id="formStatus" class="form-status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Meu Site</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
<script src="script.js"></script></body>
</html>
