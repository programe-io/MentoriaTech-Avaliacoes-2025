<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robô Interativo com Span</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- ===== CABEÇALHO ===== -->
  <header>
    <h1>🤖 <span class="highlight">Meu Robô Interativo</span></h1>

    <nav>
      <ul>
        <li><a href="#inicio">Início</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main id="inicio">
    <div class="robot">
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
      <div class="body"></div>
      <div class="arms">
        <div class="arm left"></div>
        <div class="arm right"></div>
      </div>
      <div class="legs">
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>
    </div>

    <button id="waveBtn">👋 <span class="highlight">Oi, Robô!</span></button>
  </main>

  <!-- ===== SEÇÃO SOBRE ===== -->
  <section id="sobre">
    <h2>Sobre o Robô</h2>
    <p>Este <span class="highlight">robô</span> foi criado com <span class="code">HTML</span>, <span class="code">CSS</span> e <span class="code">JavaScript</span>.  
       Ele pode reagir quando você interage com ele!</p>

    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png" alt="Imagem de um robô verde" class="robot-img">
  </section>

  <!-- ===== SEÇÃO CONTATO ===== -->
  <section id="contato">
    <h2>Contato</h2>
    <p>Envie suas ideias para <span class="highlight">melhorar o robô</span>! 🚀</p>
  </section>

  <!-- ===== RODAPÉ ===== -->
  <footer>
    <p>Desenvolvido por <strong><span class="highlight">Você</span></strong> • 2025</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
