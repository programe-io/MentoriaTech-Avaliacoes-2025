<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja Masculina • UrbanWear</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* pequenas regras para imagens (caso não tenha o CSS separado pronto) */
    .logo-img { width:46px; height:46px; border-radius:8px; object-fit:cover; }
    .thumb { width:100%; height:200px; border-radius:8px; object-fit:cover; background:#e9eef6; display:block; }
    .cart-thumb { width:56px; height:56px; border-radius:8px; object-fit:cover; }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="#">
        <img src="images/logo.png" alt="UrbanWear logo" class="logo-img">
        <div>
          <div style="font-weight:700; font-size:18px; color:#fff">UrbanWear</div>
          <div style="font-size:12px; color:rgba(255,255,255,0.8);">Moda masculina</div>
        </div>
      </a>

      <nav>
        <ul>
          <li style="display:inline-block; margin-right:14px;"><a href="#colecao">Coleção</a></li>
          <li style="display:inline-block; margin-right:14px;"><a href="#masculino">Masculino</a></li>
          <li style="display:inline-block;"><a href="#promo">Promoções</a></li>
        </ul>
      </nav>

      <div class="actions">
        <div class="search" aria-hidden>
          <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#0b2540" d="M21 20l-5.6-5.6"/></svg>
          <input id="searchInput" placeholder="Buscar peças..." />
        </div>
        <button class="cart-btn" id="openCartBtn">Carrinho (<span id="cartCount">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="layout">

      <!-- Sidebar filtros -->
      <aside class="sidebar" aria-label="Filtros de produtos">
        <h3>Filtros</h3>
        <div class="filter-group">
          <label>Preço</label>
          <input type="range" id="priceRange" min="0" max="300" value="300" />
          <div style="font-size:13px; color:#475569; margin-top:6px;">Até R$ <span id="maxPrice">300</span></div>
        </div>

        <div class="filter-group">
          <label>Tamanhos</label>
          <div class="size-list">
            <button data-size="P">P</button>
            <button data-size="M">M</button>
            <button data-size="G">G</button>
            <button data-size="GG">GG</button>
          </div>
        </div>

        <div class="filter-group">
          <label>Categoria</label>
          <select id="categoryFilter">
            <option value="all">Todas</option>
            <option value="camiseta">Camisetas</option>
            <option value="camisa">Camisas</option>
            <option value="calca">Calças</option>
            <option value="moletom">Moletom</option>
          </select>
        </div>

      </aside>

      <!-- Catálogo de produtos -->
      <section class="content-area">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
          <h2 id="colecao">Coleção Masculina</h2>
          <div style="color:#475569;">Encontre seu estilo — peças selecionadas</div>
        </div>

        <div class="catalog" id="productGrid">
          <!-- Cards serão gerados via JavaScript -->
        </div>
      </section>

      <!-- Carrinho lateral -->
      <aside class="cart" id="cartSidebar" aria-label="Carrinho de compras">
        <h3>Seu Carrinho</h3>
        <div class="cart-list" id="cartList">
          <div style="color:#94a3b8; font-size:14px;">Nenhum item adicionado.</div>
        </div>
        <div class="cart-total">
          <div>Total</div>
          <div>R$ <span id="cartTotal">0.00</span></div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn btn-outline" id="clearCart">Limpar</button>
          <button class="btn btn-primary" id="checkoutBtn">Finalizar compra</button>
        </div>
      </aside>

    </div>
  </main>

  <footer>
    <div class="container">
      <p>UrbanWear • Moda masculina • Atendimento: contato@urbanwear.ex</p>
    </div>
  </footer>

  <script>
    // Dados fictícios dos produtos
    const products = [
      { id:1, name:'Camiseta Básica', price:59.90, category:'camiseta', size:['P','M','G'], img:'images/product_1.jpg' },
      { id:2, name:'Camisa Social Slim', price:129.90, category:'camisa', size:['M','G','GG'], img:'images/product_2.jpg' },
      { id:3, name:'Calça Jeans Regular', price:179.90, category:'calca', size:['M','G','GG'], img:'images/product_3.jpg' },
      { id:4, name:'Moletom com Capuz', price:199.90, category:'moletom', size:['P','M','G','GG'], img:'images/product_4.jpg' },
      { id:5, name:'Camiseta Estampada', price:79.90, category:'camiseta', size:['P','M'], img:'images/product_5.jpg' },
      { id:6, name:'Camisa Linho', price:149.90, category:'camisa', size:['M','G'], img:'images/product_6.jpg' },
      { id:7, name:'Calça Chino', price:159.90, category:'calca', size:['P','M','G'], img:'images/product_7.jpg' },
      { id:8, name:'Jaqueta Sintética', price:249.90, category:'moletom', size:['M','G','GG'], img:'images/product_8.jpg' }
    ];

    // Estado do carrinho
    let cart = [];

    // Elementos
    const productGrid = document.getElementById('productGrid');
    const cartList = document.getElementById('cartList');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartCount = document.getElementById('cartCount');
    const cartSidebar = document.getElementById('cartSidebar');
    const openCartBtn = document.getElementById('openCartBtn');
    const clearCartBtn = document.getElementById('clearCart');
    const checkoutBtn = document.getElementById('checkoutBtn');
    const priceRange = document.getElementById('priceRange');
    const maxPrice = document.getElementById('maxPrice');
    const categoryFilter = document.getElementById('categoryFilter');
    const searchInput = document.getElementById('searchInput');

    // Renderiza produtos filtrados
    function renderProducts() {
      const max = Number(priceRange.value);
      const cat = categoryFilter.value;
      const q = searchInput.value.trim().toLowerCase();

      productGrid.innerHTML = '';
      const filtered = products.filter(p => p.price <= max && (cat === 'all' || p.category === cat) && (p.name.toLowerCase().includes(q) || p.category.includes(q)));

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="thumb" src="${p.img}" alt="${p.name}">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">Categoria: ${p.category.toUpperCase()}</div>
          <div class="price-row">
            <div class="price">R$ ${p.price.toFixed(2)}</div>
            <div>
              <button class="btn btn-outline" onclick="viewDetails(${p.id})">Ver</button>
              <button class="btn btn-primary" onclick="addToCart(${p.id})">Adicionar</button>
            </div>
          </div>
        `;
        productGrid.appendChild(card);
      });

      if (filtered.length === 0) {
        productGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#64748b;">Nenhum produto encontrado com esses filtros.</div>';
      }
    }

    // adicionar ao carrinho
    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1, img: prod.img });
      }
      updateCartUI();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty < 1) removeFromCart(id);
      updateCartUI();
    }

    function updateCartUI() {
      cartList.innerHTML = '';
      if (cart.length === 0) {
        cartList.innerHTML = '<div style="color:#94a3b8; font-size:14px;">Nenhum item adicionado.</div>';
        cartTotalEl.innerText = '0.00';
        cartCount.innerText = '0';
        return;
      }

      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <img class="cart-thumb" src="${item.img}" alt="${item.name}">
          <div class="meta">
            <div style="font-weight:700;">${item.name}</div>
            <div style="font-size:13px; color:#64748b;">R$ ${item.price.toFixed(2)} x ${item.qty}</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <button class="btn btn-outline" onclick="changeQty(${item.id},1)">+</button>
            <button class="btn btn-outline" onclick="changeQty(${item.id},-1)">-</button>
            <button class="btn" style="background:transparent; color:#ef4444; border:0;" onclick="removeFromCart(${item.id})">Remover</button>
          </div>
        `;
        cartList.appendChild(el);
      });

      cartTotalEl.innerText = total.toFixed(2);
      cartCount.innerText = cart.reduce((s,i)=> s + i.qty, 0);
    }

    // abrir/fechar carrinho (pequena interação)
    openCartBtn.addEventListener('click', () => {
      cartSidebar.scrollIntoView({ behavior:'smooth', block:'start' });
    });

    clearCartBtn.addEventListener('click', () => { cart = []; updateCartUI(); });
    checkoutBtn.addEventListener('click', () => { if (cart.length === 0) return alert('Seu carrinho está vazio.'); alert('Compra simulada. Obrigado!'); cart = []; updateCartUI(); });

    // filtros interativos
    priceRange.addEventListener('input', () => { maxPrice.innerText = priceRange.value; renderProducts(); });
    categoryFilter.addEventListener('change', renderProducts);
    searchInput.addEventListener('input', () => setTimeout(renderProducts, 200));

    function viewDetails(id) {
      const p = products.find(x=>x.id===id);
      alert(`${p.name}\nPreço: R$ ${p.price.toFixed(2)}\nTamanhos: ${p.size.join(', ')}`);
    }

    // Inicializa
    renderProducts();
    updateCartUI();

    // expõe funções ao escopo global para uso nos handlers inline
    window.addToCart = addToCart;
    window.viewDetails = viewDetails;
    window.changeQty = changeQty;
    window.removeFromCart = removeFromCart;
  </script>
</body>
</html>
