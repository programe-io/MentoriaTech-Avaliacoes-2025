<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed — Lionel Messi</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex justify-between items-center bg-blue-800">
    <h1 class="text-2xl font-bold"><span class="text-yellow-400">LOGO</span></h1>
    <nav class="font-semibold hidden md:flex gap-4">
      <a href="#" class="hover:text-gray-300"><span>Perfil</span></a>
      <a href="#" class="hover:text-gray-300"><span>Feed</span></a>
      <a href="#" class="hover:text-gray-300"><span>Configurações</span></a>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="py-6 px-4 flex flex-col gap-6 md:flex-row md:flex-wrap justify-center">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 p-4 rounded-lg shadow-md w-full md:w-1/3">
      <div class="flex items-center gap-3 mb-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Lionel_Messi_20180626.jpg" alt="Lionel Messi perfil" class="rounded-full w-12 h-12">
        <div>
          <h2 class="font-bold text-lg"><span class="text-yellow-400">Lionel Messi</span></h2>
          <p class="text-sm text-gray-400"><span>2h atrás</span></p>
        </div>
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Lionel_Messi_celebrating_WC2022.jpg" alt="Messi Copa do Mundo" class="rounded-md mb-3">
      <p class="text-gray-300 text-sm">Momento <span class="text-yellow-400">histórico</span> na Copa do Mundo 🏆🇦🇷</p>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 p-4 rounded-lg shadow-md w-full md:w-1/3">
      <div class="flex items-center gap-3 mb-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Lionel_Messi_20180626.jpg" alt="Lionel Messi perfil" class="rounded-full w-12 h-12">
        <div>
          <h2 class="font-bold text-lg"><span class="text-yellow-400">Lionel Messi</span></h2>
          <p class="text-sm text-gray-400"><span>5h atrás</span></p>
        </div>
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Lionel_Messi_FC_Barcelona_2018.jpg" alt="Messi Barcelona" class="rounded-md mb-3">
      <p class="text-gray-300 text-sm">Brilho eterno no <span class="text-yellow-400">Barcelona</span> 💙❤️</p>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 p-4 rounded-lg shadow-md w-full md:w-1/3">
      <div class="flex items-center gap-3 mb-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Lionel_Messi_20180626.jpg" alt="Lionel Messi perfil" class="rounded-full w-12 h-12">
        <div>
          <h2 class="font-bold text-lg"><span class="text-yellow-400">Lionel Messi</span></h2>
          <p class="text-sm text-gray-400"><span>1d atrás</span></p>
        </div>
      </div>
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/56/Lionel_Messi_2022_FIFA_World_Cup.jpg" alt="Messi Argentina 2022" class="rounded-md mb-3">
      <p class="text-gray-300 text-sm">O <span class="text-yellow-400">capitão</span> da Argentina em 2022 🇦🇷</p>
    </div>

  </main>

  <!-- JS -->
  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
