<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mini Game com Abas</title>

<style>
    body {
        background: #0a0a0a;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
    }

    /* HEADER */
    header {
        background: #111;
        padding: 20px;
        text-align: center;
        border-bottom: 3px solid #0ff;
        box-shadow: 0 0 15px #0ff;
    }

    header h1 {
        margin: 10px 0;
        text-shadow: 0 0 10px #0ff;
    }

    /* NAV */
    nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    nav ul li {
        display: inline-block;
        margin: 0 15px;
    }

    nav ul li a {
        color: #0ff;
        font-weight: bold;
        text-decoration: none;
    }

    nav ul li a:hover {
        text-shadow: 0 0 8px #0ff;
    }

    /* Container do game */
    .game-box {
        width: 80%;
        margin: auto;
        margin-top: 30px;
        padding: 20px;
        border: 3px solid #0ff;
        border-radius: 10px;
        box-shadow: 0 0 20px #0ff;
        background: rgba(0, 0, 0, 0.5);
    }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .tab-button {
        padding: 10px 20px;
        background: #111;
        border: 2px solid #0ff;
        border-radius: 6px;
        cursor: pointer;
        color: #0ff;
        font-weight: bold;
        transition: 0.2s;
    }

    .tab-button:hover {
        box-shadow: 0 0 10px #0ff;
        transform: scale(1.1);
    }

    .tab-button.active {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 10px #0ff;
    }

    .tab-content {
        display: none;
        animation: fadeIn 0.5s;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }

    img {
        width: 350px;
        border: 2px solid #0ff;
        border-radius: 10px;
        box-shadow: 0 0 20px #0ff;
        margin-top: 10px;
    }

    span {
        color: #0ff;
        font-weight: bold;
    }

    /* FOOTER */
    footer {
        background: #111;
        color: #0ff;
        padding: 10px;
        margin-top: 30px;
        border-top: 3px solid #0ff;
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

<!-- HEADER -->
<header>
    <h1>🎮 MINI GAME – ESCOLHA A FASE</h1>

    <!-- NAV OBRIGATÓRIA -->
    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Fases</a></li>
            <li><a href="#">Créditos</a></li>
        </ul>
    </nav>
</header>

<!-- MAIN -->
<main>

    <!-- <p> com <span> obrigatório -->
    <p>Bem-vindo ao <span>mini game</span>! Escolha uma fase abaixo para visualizar a imagem correspondente.</p>

    <div class="game-box">

        <div class="tabs">
            <div class="tab-button active" onclick="openTab('fase1')">F1</div>
            <div class="tab-button" onclick="openTab('fase2')">F2</div>
            <div class="tab-button" onclick="openTab('fase3')">F3</div>
        </div>

        <audio id="clickSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_d250655631.mp3"></audio>

        <div id="fase1" class="tab-content active">
            <h2>Fase 1 - O Início</h2>
            <img src="https://br.freepik.com/fotos-vetores-gratis/iniciar" alt="Fase 1">
        </div>

        <div id="fase2" class="tab-content">
            <h2>Fase 2 - O Desafio</h2>
            <img src="https://pt.vecteezy.com/arte-vetorial/13752223-estilo-de-icone-de-desafio" alt="Fase 2">
        </div>

        <div id="fase3" class="tab-content">
            <h2>Fase 3 - O Chefão</h2>
            <img src="https://www.reddit.com/r/brasil/comments/vi7glf/qual_%C3%A9_o_chef%C3%A3o_mais_bizarro_que_voc%C3%AA_j%C3%A1_vi_em_um/" alt="Fase 3">
        </div>

    </div>

</main>

<!-- FOOTER -->
<footer>
    © 2025 - Projeto da Avaliação
</footer>

<script>
function openTab(tabId) {

    document.getElementById("clickSound").play();

    document.querySelectorAll('.tab-content').forEach(div => {
        div.classList.remove('active');
    });

    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });

    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}
</script>

</body>
</html>
