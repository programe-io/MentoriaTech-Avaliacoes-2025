<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Hair - Simulador de Corte</title>

    <!-- Importando CSS -->
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
    <h1>Studio Hair 💇‍♂️💇‍♀️</h1>
    <button class="tema-btn" onclick="toggleTema()">Alternar Tema</button>
</header>

<section class="galeria">
    <div class="card">
        <img src="https://i.imgur.com/nd5UkEw.jpg" alt="Corte Masculino">
        <h3>Corte Masculino</h3>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/NfQ5VJ5.jpg" alt="Corte Feminino">
        <h3>Corte Feminino</h3>
    </div>

    <div class="card">
        <img src="https://i.imgur.com/ExdXA1E.jpg" alt="Corte Moderno">
        <h3>Corte Moderno</h3>
    </div>
</section>

<section class="simulador">
    <h2>Simulador de Corte</h2>
    <img id="fotoModelo" src="https://i.imgur.com/vxH6J6b.png">

    <br><br>
    <label>Escolha o corte:</label><br>
    <select id="corteSelect" onchange="trocarCorte()">
        <option value="padrao">Nenhum corte</option>
        <option value="curto">Corte Curto</option>
        <option value="medio">Corte Médio</option>
        <option value="longo">Corte Longo</option>
    </select>
</section>

<form onsubmit="enviarFormulario(event)">
    <h3>Agendar horário</h3>
    <input type="text" id="nome" placeholder="Seu nome" required>
    <input type="datetime-local" id="data" required>
    <textarea id="obs" placeholder="Observações"></textarea>
    <button>Enviar</button>
</form>

<!-- Importando JavaScript -->
<script src="script.js"></script>

<script src="script.js"></script></body>
</html>
