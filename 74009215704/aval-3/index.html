<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum Interativo</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <!-- Logo do site -->
    <img src="logo.png" alt="Logo do Fórum" class="logo">
    <h1>Fórum de Discussão</h1>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Tópicos</a></li>
        <li><a href="#">Perfil</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="novo-topico">
      <h2>Criar Novo Tópico</h2>
      <input type="text" id="titulo" placeholder="Título do tópico">
      <textarea id="mensagem" placeholder="Escreva sua mensagem..."></textarea>
      <button id="btnPublicar">Publicar</button>
    </section>

    <section id="forum">
      <h2>Tópicos Recentes</h2>
      <div id="lista-topicos">
        <!-- Exemplo de tópico com avatar e spans -->
        <div class="topico">
          <img src="avatar-exemplo.jpg" alt="Avatar do usuário" class="avatar">
          <div class="info-usuario">
            <span class="usuario">👤 UsuárioExemplo</span>
            <span class="data">🕒 Postado em: 28/10/2025</span>
          </div>
          <h3>Título de Exemplo</h3>
          <p>Este é um exemplo de tópico inicial do fórum. Bem-vindo à comunidade!</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fórum Interativo - Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
