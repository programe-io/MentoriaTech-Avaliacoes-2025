<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link href="./output.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex items-center">
    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      LOGO
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>
      <a href="#" class="hover:text-blue-400">Amigos</a>
      <a href="#" class="hover:text-blue-400">Perfil</a>
    </nav>
  </header>

  <!-- POSTS -->
  <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://img.freepik.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        <h2 class="text-lg font-semibold">Perfil</h2>
      </div>
      <!-- CARD IMAGE -->
      <img class="w-full h-48 object-cover" src="https://applescoop.org/image/wallpapers/mac/anime-cartoon-style-mountains-digital-art-crescent-waterfall-2025-best-ultra-hd-high-resolution-4k-desktop-backgrounds-wallpapers-for-mac-linux-and-windows-pc-11-03-2025-1741731277-hd-wallpaper.jpeg" alt="">
      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
          Aqui se encontram mais informações sobre o seu perfil.
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://img.freepik.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        <h2 class="text-lg font-semibold">Amigos</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://img.freepik.com/free-vector/gradient-liquid-background_23-2149112208.jpg?semt=ais_hybrid&w=740&q=80" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Quer encontrar seus amigos? Clique aqui!
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://img.freepik.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        <h2 class="text-lg font-semibold">Dashboard</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://img.freepik.com/fotos-premium/camadas-de-fundo-de-mistura-de-arco-iris-abstrato-gradiente-design-de-fundo-colorido-formas-ilustracao-3d_715271-558.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Para saber as últimas novidades e posts clique aqui!
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

  </main>

</body>
</html>
