  <title>Cards Layout</title>

  <!-- Fonte Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Fundo geral */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #001f3f; /* Azul navy */
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Barra de navegação */
    nav {
      width: 100%;
      background-color: #0a2a66;
      display: flex;
      justify-content: center;
      gap: 50px;
      padding: 20px 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    nav a:hover {
      color: #00bfff;
      transform: scale(1.05);
    }

    /* Cabeçalho (LOGO) */
    header {
      width: 100%;
      text-align: center;
      padding: 30px 0 10px 0;
      font-weight: bold;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    /* Container dos cards */
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      padding: 20px;
      max-width: 1200px;
    }

    /* Estilo dos cards */
    .card {
      background-color: #1d2535;
      width: min(90vw, 300px);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* Cabeçalho do card */
    .card-header {
      display: flex;
      align-items: center;
      padding: 15px;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-image: url('https://via.placeholder.com/40');
      background-size: cover;
      background-position: center;
    }

    .username {
      font-weight: 600;
      color: white;
    }

    /* Imagem principal */
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .card img:hover {
      opacity: 0.9;
    }

    /* Conteúdo e rodapé */
    .card-content {
      padding: 15px;
      color: #e0e0e0;
      font-size: 0.9rem;
    }

    .card-footer {
      padding: 0 15px 15px 15px;
      font-size: 0.8rem;
      color: #b5b5b5;
      text-align: right;
    }
  </style>
