<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Site de Culinária Completo</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <div class="container">

                            <nav>
                                        <ul>
                                                        <li><a href="#">Início</a></li>
                                                                        <li><a href="#">Receitas</a></li>
                                                                                        <li><a href="#">Contato</a></li>
                                                                                                    </ul>
                                                                                                            </nav>

                                                                                                                    <header>
                                                                                                                                <h1>Receitas do Chef</h1>
                                                                                                                                            <img src="https://via.placeholder.com/350x180.png?text=Culinaria" alt="Imagem de culinária">
                                                                                                                                                        <p>Bem-vindo ao site culinário mais simples do mundo.</p>
                                                                                                                                                                    <span class="descricao">Aqui você encontra receitas fáceis e rápidas.</span>
                                                                                                                                                                            </header>

                                                                                                                                                                                    <main>

                                                                                                                                                                                                <section class="add-recipe">
                                                                                                                                                                                                                <h2>Adicionar Receita</h2>
                                                                                                                                                                                                                                <p>Preencha os campos para adicionar uma nova receita.</p>

                                                                                                                                                                                                                                                <input id="recipeName" type="text" placeholder="Nome da receita">

                                                                                                                                                                                                                                                                <textarea id="recipeSteps" placeholder="Modo de preparo"></textarea>

                                                                                                                                                                                                                                                                                <button onclick="addRecipe()">Adicionar</button>
                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                        <section class="recipes">
                                                                                                                                                                                                                                                                                                                        <h2>Lista de Receitas</h2>
                                                                                                                                                                                                                                                                                                                                        <div id="recipeList"></div>
                                                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                    </html>
