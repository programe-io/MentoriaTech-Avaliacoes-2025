<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Jogos</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Header com logo e nav -->
    <header>
        <div class="logo">
            <img src="https://via.placeholder.com/100x50.png?text=Logo" alt="Logo Jogos">
            <h1>Perfil Jogos</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Jogos</a></li>
                <li><a href="#">Lançamentos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <section class="cards-container">
            <!-- Card 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Jogo+1" alt="Jogo 1">
                <div class="card-content">
                    <h2>Jogo A</h2>
                    <p>Descrição breve do Jogo A. <span>Postado em: 01/12/2025</span></p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Jogo+2" alt="Jogo 2">
                <div class="card-content">
                    <h2>Jogo B</h2>
                    <p>Descrição breve do Jogo B. <span>Postado em: 28/11/2025</span></p>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Jogo+3" alt="Jogo 3">
                <div class="card-content">
                    <h2>Jogo C</h2>
                    <p>Descrição breve do Jogo C. <span>Postado em: 25/11/2025</span></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
