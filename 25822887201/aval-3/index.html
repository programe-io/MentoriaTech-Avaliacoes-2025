<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo Completo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    /* Header */
    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    /* Navegação */
    nav {
      background-color: #333;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    nav ul li {
      margin: 0;
    }

    nav ul li a {
      display: block;
      padding: 0.75rem 1rem;
      color: white;
      text-decoration: none;
    }

    nav ul li a:hover {
      background-color: #4CAF50;
    }

    /* Main */
    main {
      padding: 20px;
    }

    /* Div estilizada */
    .caixa {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Imagem dentro da div */
    .caixa img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 15px;
    }

    /* Span destacado */
    .destaque {
      color: #4CAF50;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>
  <!-- Header -->
  <header>
    <h1>Meu Site</h1>
    <p>Exemplo com <span class="destaque">Header, Nav, Main, Div, Img e Span</span></p>
  </header>

  <!-- Navegação -->
  <nav>
    <ul>
      <li><a href="#inicio">Início</a></li>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#galeria">Galeria</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
  </nav>

  <!-- Conteúdo principal -->
  <main>
    <!-- Div com conteúdo -->
    <div class="caixa" id="inicio">
      <h2>Bem-vindo!</h2>
      <p>Esta é uma área dentro de uma <code>&lt;div&gt;</code> dentro do <code>&lt;main&gt;</code>.</p>

      <!-- Imagem -->
      <img src="https://via.placeholder.com/400x250.png?text=Minha+Imagem" alt="Imagem de exemplo">

      <!-- Span dentro da div -->
      <p>Este texto contém um <span class="destaque">span em destaque</span> para chamar atenção.</p>
    </div>
  </main>
<script src="script.js"></script></body>
</html>
