<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
  <style>
    /* Seu CSS permanece o mesmo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: orange;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    nav {
      background-color: #222;
      display: flex;
      justify-content: center;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      transition: background 0.3s;
    }

    nav a:hover {
      background-color: #444;
    }

    main {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      margin: 20px;
    }

    aside.sidebar {
      flex: 1;
      min-width: 250px;
      max-width: 300px;
      background-color: #eee;
      padding: 20px;
      margin-bottom: 20px;
    }

    aside.sidebar h3, aside.sidebar h4 {
      margin-bottom: 10px;
    }

    aside.sidebar p {
      margin-bottom: 15px;
    }

    .imagem {
      background-color: white;
      width: 100%;
      height: 150px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #666;
    }

    aside img {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      margin-bottom: 10px;
      border: 1px solid #ccc;
    }

    .content {
      flex: 3;
      background-color: white;
      padding: 20px;
      margin-left: 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    article header {
      margin-bottom: 15px;
    }

    .post-title {
      font-size: 26px;
      font-weight: bold;
    }

    .post-date {
      color: #888;
      font-size: 14px;
    }

    .post-image img {
      max-width: 100%;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .post-content p {
      font-size: 16px;
      line-height: 1.6;
    }

    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px 20px;
      font-size: 14px;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }

      .content {
        margin-left: 0;
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Meu Site</h1>
    <p>Meu site muito top!</p>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Página 2</a>
    <a href="#">Página 3</a>
    <a href="#">Página 4</a>
  </nav>

  <main>

    <aside class="sidebar">
      <header>
        <h3>Sobre mim</h3>
      </header>
      <p>Milena</p>

      <img src="https://i.pinimg.com/564x/58/e9/fd/58e9fdee42b2584192bd7b7f6b72e8a8.jpg" alt="Foto de Milena">

      <h4>Me chamo Milena, tenho 15 anos.</h4>
      <h4>Minha foto</h4>

      <div class="imagem">Imagem 1</div>
      <div class="imagem">Imagem 2</div>
    </aside>

    <div class="content">
      <article>
        <header>
          <h3>SOBRE MIM</h3>
          <div class="post-date">Milena Costa, 28 Jan, 2010</div>
        </header>

        <div class="post-image">
          <img src="https://i.pinimg.com/564x/58/e9/fd/58e9fdee42b2584192bd7b7f6b72e8a8.jpg" alt="Imagem da postagem">
        </div>

        <div class="post-content">
          <p>Deus é bom e o diabo não presta.</p>
        </div>
      </article>
    </div>

  </main>

  <footer>
    <p>© 2025 Meu Site. Todos os direitos reservados.</p>
  </footer>

<script src="script.js"></script></body>
</html>
