       <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Feed - Rede Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white p-4">
        <h1 class="text-2xl font-bold text-center">Minha Rede Social</h1>
        <p class="text-sm text-center">
            Feed de publicações <span class="bg-white text-blue-600 px-2 py-1 rounded text-xs">Online</span>
        </p>

        <!-- Navegação -->
        <nav class="mt-4">
            <ul class="flex justify-center gap-6 text-sm font-semibold">
                <li><a href="#" class="hover:underline">Início</a></li>
                <li><a href="#" class="hover:underline">Perfil</a></li>
                <li><a href="#" class="hover:underline">Mensagens</a></li>
                <li><a href="#" class="hover:underline">Configurações</a></li>
            </ul>
        </nav>
    </header>

    <!-- Feed -->
    <main class="max-w-xl mx-auto mt-6 space-y-6">

        <!-- Post -->
        <article class="bg-white rounded-lg shadow p-4">

            <header class="flex items-center gap-3 mb-3">
                <img
                    src="https://via.placeholder.com/50"
                    alt="Foto de perfil do usuário"
                    class="w-12 h-12 rounded-full"
                >
                <div>
                    <h2 class="font-bold">
                        Marcos Antônio
                        <span class="text-xs text-green-600 font-semibold">● online</span>
                    </h2>
                    <h3 class="text-sm text-gray-500">há 30 minutos</h3>
                </div>
            </header>

            <p class="mb-3">
                Criando meu primeiro feed de rede social com
                <span class="font-semibold text-blue-600">
             
  
  
</body>
</html>
