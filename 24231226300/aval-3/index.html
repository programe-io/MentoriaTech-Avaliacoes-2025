<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Galeria de Helicópteros</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>
          <nav>
            <h2>
              <span>
          <header>
              <div class="logo">H</div>
                  <div class="brand">
                        <h1>Galeria de Helicópteros</h1>
                              <p class="lead">Coleção responsiva com preview, legenda e lightbox.</p>
                                  </div>
                                    </header>

                                      <div class="controls">
                                          <input id="search" class="search" placeholder="Pesquisar...">
                                              <select id="filter" class="select">
                                                    <option value="all">Todos os tipos</option>
                                                          <option value="civil">Civil</option>
                                                                <option value="military">Militar</option>
                                                                      <option value="rescue">Resgate</option>
                                                                          </select>
                                                                              <button id="shuffle" class="btn">Embaralhar</button>
                                                                                </div>

                                                                                  <main>
                                                                                      <section class="gallery" id="gallery"></section>
                                                                                        </main>

                                                                                          <div class="lightbox" id="lightbox">
                                                                                              <div class="lightbox-content">
                                                                                                    <div class="lb-controls">
                                                                                                            <button id="prev">◀</button>
                                                                                                                    <button id="next">▶</button>
                                                                                                                          </div>
                                                                                                                                <img id="lb-image" alt="">
                                                                                                                                      <div class="lb-meta">
                                                                                                                                              <div>
                                                                                                                                                        <div id="lb-title"></div>
                                                                                                                                                                  <div id="lb-sub"></div>
                                                                                                                                                                          </div>
                                                                                                                                                                                  <a id="download" class="btn" href="#" download>Baixar</a>
                                                                                                                                                                                        </div>
                                                                                                                                                                                            </div>
                                                                                                                                                                                              </div>

                                                                                                                                                                                                <footer>Feito com ❤️</footer>

                                                                                                                                                                                                  <script src="script.js"></script>
                                                                                                                                                                                                  <script src="script.js"></script></body>
                                                                                                                                                                                                  </html>
