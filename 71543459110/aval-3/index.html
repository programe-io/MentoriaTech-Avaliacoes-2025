<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feed Social Simples</title>
<link rel="stylesheet" href="style.css" />
<link href="style.css" rel="stylesheet"></head>
<body>
<header>
<nav class="navbar">
<h1 class="logo">Meu Feed</h1>
<ul class="menu">
<li><a href="#">Início</a></li>
<li><a href="#">Perfil</a></li>
<li><a href="#">Configurações</a></li>
</ul>
</nav>
</header>


<main>
<h2 class="titulo-pagina">Últimos Posts <span class="tag-info">(atualizado)</span></h2>


<section class="feed">


<article class="post">
<img class="foto" src="https://i.pravatar.cc/80?img=10" alt="Usuário" />
<div class="conteudo">
<h3 class="nome">Ana Souza <span class="usuario">@ana_s</span></h3>
<p class="texto">Dia lindo hoje! ☀️</p>
<button class="like">Curtir ❤</button>
</div>
</article>


<article class="post">
<img class="foto" src="https://i.pravatar.cc/80?img=25" alt="Usuário" />
<div class="conteudo">
<h3 class="nome">Carlos Lima <span class="usuario">@carlos_l</span></h3>
<p class="texto">Alguém jogando hoje?</p>
<button class="like">Curtir ❤</button>
</div>
</article>


</section>
</main>
</body>
</html>
