<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billie Eilish - Feed de Vendas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="wrapper"> 
        <header>
            <img src="https://i.pinimg.com/736x/4d/68/c2/4d68c2253f239dbb94fa73e7099c35c5.jpg" alt="Logo Billie Eilish Neon" class="site-logo">
            
            <h1>Billie Eilish Vendas & Fã Feed 🎧</h1>
            <p>Este é o seu feed exclusivo sobre <span class="highlight">Billie Eilish</span>! Novidades, vendas de álbuns, merchandising e postagens de fãs!</p>
            <nav id="main-navigation">
                <a href="#vendas">Vendas</a>
                <a href="#fãs">Fãs</a>
                <a href="#todos">Todos</a>
            </nav>
        </header>

        <h2>Feed de Postagens Recentes</h2>

        <main id="feed-container">
            </main>
    </div>

    <template id="post-template">
        <article class="post">
            <div class="post-header">
                <img class="post-avatar" src="avatar-padrao.jpg" alt="Avatar do usuário">
                <span class="post-username">Nome de Usuário</span> 
            </div>
            
            <div class="post-content-body"> 
                <h2 class="post-title">Título da Postagem</h2> 
                <p class="post-text">Descrição da postagem ou detalhes da venda.</p>
                <img class="post-image" src="" alt="Imagem relacionada à postagem">
            </div>

            <div class="post-footer">
                <span class="post-price">R$ 0,00</span>
                <button class="buy-button">Comprar / Ver Mais</button>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
