<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="header-container">
            <h1 class="logo">GCM_MIDIAS</h1>
            <nav>
                <ul>
                    <li><a href="#feed">Início</a></li>
                    <li><a href="#perfil">Perfil</a></li>
                    <li><a href="#configuracoes">Configurações</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <!-- Feed Social -->
        <section id="feed">
            <h2>Postagens Recentes</h2> <!-- Título para a seção de postagens -->

            <!-- Postagem 1 -->
            <div class="post">
                <div class="post-header">
                    <img src="https://preview.redd.it/i-love-this-v0-7b0hqu15qrpe1.jpg?width=640&crop=smart&auto=webp&s=608358b83908887e3c2d61ddb8aa3d0022074db3" alt="Avatar" class="avatar">
                    <div>
                        <p class="user-name">Gabriel</p>
                        <p class="post-time"><span class="time-label">2 horas atrás</span></p>
                    </div>
                </div>
                <p class="post-content">Goku black é incrivel no fortnite 🕹️🔥</p>
                <img src="https://trackercdn.com/legacycdn/fortnite/77B019500_bg.png" alt="Imagem do Post" class="post-image">
                <div class="post-actions">
                    <button class="like-btn">Curtir</button>
                    <button class="comment-btn">Comentar</button>
                    <button class="share-btn">Compartilhar</button>
                </div>
            </div>

            <!-- Postagem 2 -->
            <div class="post">
                <div class="post-header">
                    <img src="https://i.pinimg.com/736x/64/4e/99/644e991eecbf354421dc9900f7c4212b.jpg" alt="Avatar" class="avatar">
                    <div>
                        <p class="user-name">Gustavo</p>
                        <p class="post-time"><span class="time-label">5 horas atrás</span></p>
                    </div>
                </div>
                <p class="post-content">Estou ansioso para black clover, 30 de outubro de 2025 🤩</p>
                <img src="https://animeflix.com.br/wp-content/uploads/2025/07/Black-Clover-novo-visual-japones.jpg" alt="Imagem do Post" class="post-image">
                <div class="post-actions">
                    <button class="like-btn">Curtir</button>
                    <button class="comment-btn">Comentar</button>
                    <button class="share-btn">Compartilhar</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
