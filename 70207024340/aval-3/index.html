<!DOCTYPE html>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <div class="page-wrapper">

        <header class="header">
            <h1>Bikini Style <span class="header-icon">☀️</span></h1> 
            <nav class="nav-icons" aria-label="Navegação Principal">
                <a href="/search" aria-label="Buscar"><i class="fas fa-search"></i></a>
                <a href="/profile" aria-label="Meu Perfil"><i class="fas fa-user-circle"></i></a>
            </nav>
        </header>

        <h2 class="section-title">Destaques da Semana</h2>

        <section class="stories">
            <a href="/new" class="story-item"><i class="fas fa-plus"></i> <p>Novo</p></a>
            <a href="/novidades" class="story-item"><img src="biquini1_thumb.jpg" alt="Story 1"><p>Novidades</p></a>
            <a href="/sale" class="story-item"><img src="biquini2_thumb.jpg" alt="Story 2"><p>Sale</p></a>
        </section>
        
        <h2 class="sr-only">Feed de Vendas</h2>

        <main class="feed-container" id="feed-container">
            </main>

    <template id="post-template">
        <article class="post">
            <div class="post-header">
                <img class="post-avatar" src="avatar_marca.jpg" alt="Marca Bikini Style">

                <span class="post-date"> - 2h</span>

            <img class="post-image" src="" alt="Produto - Biquíni">

                <i class="fas fa-heart action-icon"></i>
                <i class="fas fa-comment action-icon"></i>

            </div>
            <p class="post-caption">
                <span class="post-caption-text"></span>
                <a href="#" class="see-more">...mais</a>
            </p>
            <div class="post-comments">
                <a href="/comments" class="comments-link"><p>Ver todos os <span class="comment-count">15</span> comentários</p></a>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
