<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal Pro Loja</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Futsal Pro Loja</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>
        <section class="produtos">
            <h2>Produtos de Futsal</h2>
            <div class="produtos-container">
                <div class="produto">
                    <img src="https://via.placeholder.com/200x200?text=Camiseta+Pro" alt="Camiseta Pro">
                    <h3>Camiseta Pro</h3>
                    <p>R$ 89,90</p>
                    <button onclick="adicionarAoCarrinho('Camiseta Pro', 89.90)">Adicionar ao Carrinho</button>
                </div>
                <div class="produto">
                    <img src="https://via.placeholder.com/200x200?text=Short+DryFit" alt="Short DryFit">
                    <h3>Short DryFit</h3>
                    <p>R$ 59,90</p>
                    <button onclick="adicionarAoCarrinho('Short DryFit', 59.90)">Adicionar ao Carrinho</button>
                </div>
                <div class="produto">
                    <img src="https://via.placeholder.com/200x200?text=Meião+Ultra" alt="Meião Ultra">
                    <h3>Meião Ultra</h3>
                    <p>R$ 29,90</p>
                    <button onclick="adicionarAoCarrinho('Meião Ultra', 29.90)">Adicionar ao Carrinho</button>
                </div>
            </div>
        </section>

        <section class="carrinho">
            <h2>🛒 Carrinho de Compras</h2>
            <ul id="lista-carrinho"></ul>
            <p id="total">Total: R$ 0,00</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Futsal Pro Loja. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
