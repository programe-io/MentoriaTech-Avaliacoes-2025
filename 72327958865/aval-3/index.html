<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FroJho Burgers</title>
  <link rel="stylesheet" href="style.css"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <div class="logo">🍔 FroJho Burgers</div>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Cardápio</a></li>
        <li><a href="#">Pedidos</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
    <div class="cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></div>
  </header>

  <main>
    <section class="intro">
      <h1>Monte seu pedido</h1>
      <p>Escolha seu lanche, adicione ao carrinho e receba rapidinho!</p>
    </section>

    <!-- Telas simulando o app -->
    <section id="app-screens" class="screens">
      <div class="screen">
        <img src="https://cdn.dribbble.com/userupload/10202493/file/original-1f177a23ed3e5a72de7eebf88bc87f32.png?resize=400x800" alt="Tela Cardápio">
      </div>
      <div class="screen">
        <img src="https://cdn.dribbble.com/userupload/10202492/file/original-4a953fb2898f2124b3f16d9b17b20f79.png?resize=400x800" alt="Tela Pedido de Burger">
      </div>
      <div class="screen">
        <img src="https://cdn.dribbble.com/userupload/10202491/file/original-20b3e6df92ac969def21ee5d7fcf623e.png?resize=400x800" alt="Tela Mapa de Entrega">
      </div>
    </section>

    <section id="products" class="product-grid">
      <!-- Produtos inseridos via JavaScript -->
    </section>
  </main>

  <aside id="cart-panel" class="hidden">
    <h2>Carrinho</h2>
    <ul id="cart-items"></ul>
    <p>Total: R$ <span id="cart-total">0.00</span></p>
    <button onclick="finalizePurchase()">Finalizar Compra</button>
  </aside>

  <footer>
    <p>&copy; 2025 FroJho Burgers. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
