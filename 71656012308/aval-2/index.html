<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Loja Flex</title>
  <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <nav></nav>
    <h1>🍔 Lanchonete Flex</h1>
  </header>

  <main class="container">
    <aside></aside>

    <article class="produto">
      <img src="
https://viagem.cnnbrasil.com.br/wp-content/uploads/sites/5/2022/05/origem-do-hambuguer-cnn4.jpg?w=1200&h=900&crop=1
" alt="Hambúrguer">
      <h2>Hambúrguer</h2>
      <h3></h3>
      <p>Delicioso e suculento!</p>
      <button>Adicionar</button>
    </article>

    <div class="produto">
      <img src="
https://cdn.dooca.store/418/products/coca.jpg?v=1589835707&webp=0
" alt="Refrigerante">
      <h2>Refrigerante</h2>
      <p>Bebida geladinha!</p>
      <button>Adicionar</button>
    </div>

    <div class="produto">
      <img src="
https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdp9k3erwyJfriBoxoRfMbzMlNmI1ln9FClA&s
" alt="Milkshake">
      <h2>Milkshake</h2>
      <p>Cremoso e refrescante!</p>
      <button>Adicionar</button>
    </div>

    <div class="produto">
      <img src="
https://uploads.metropoles.com/wp-content/uploads/2020/07/30164453/coxinha-2.jpg
" alt="coxinha">
      <h2>coxinha</h2>
      <p>com muito frango e catupiri!</p>
      <button><a>Adicionar</a></button>
    </div>
  </main>

  <footer>
    <p>Feito com Flexbox</p>
  </footer>

</html>
