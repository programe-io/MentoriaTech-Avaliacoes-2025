<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Relógio Virtual usando HTML, CSS e JavaScript">
    <title>Relógio Virtual</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Relógio Virtual</h1>
        <nav>
            <ul>
                <li><a href="#clock">Ir para Relógio</a></li>
                <li><a href="#info">Informações</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="clock-section" class="clock-container">
            <article>
                <time id="clock" datetime="00:00:00">00:00:00</time>
            </article>

            <aside>
                <form>
                    <label for="timezone">Escolha o fuso horário:</label>
                    <select id="timezone">
                        <option value="0">UTC</option>
                        <option value="-3">UTC-3 (Brasil)</option>
                        <option value="1">UTC+1 (Europa)</option>
                        <option value="9">UTC+9 (Japão)</option>
                    </select>
                    <button type="button" onclick="updateClock()">Atualizar</button>
                </form>
            </aside>
        </section>

        <section id="info">
            <article>
                <h2>Sobre este relógio</h2>
                <h3>Detalhes do funcionamento</h3>
                <p>Este é um relógio virtual construído com HTML, CSS e JavaScript. Ele atualiza a hora a cada segundo e permite alterar o fuso horário.</p>
            </article>
            <figure>
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Analog_clock_face.png" alt="Relógio Analógico Exemplo">
                <figcaption>Exemplo de relógio analógico</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Relógio Virtual. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
