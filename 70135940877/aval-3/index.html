<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Social.Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-b from-red-500 to-orange-500 min-h-screen text-white">
  <!-- HEADER -->
  <header class="shadow-md p-5 flex justify-between items-center bg-gray-800">
    <div class="uppercase font-bold text-xl">
      Logo
    </div> 
    <nav class="flex gap-6 font-bold">
      <a href="#" class="hover:text-gray-300">Início</a>
      <a href="#" class="hover:text-gray-300">nike,</a>
      <a href="#" class="hover:text-gray-300">Contato</a>
    </nav>
  </header>

  <!-- MAIN FEED -->
  <main class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold underline text-center mb-6">Social Feed</h1>

    <!-- POST CARD -->
    <div class="bg-blue-800 shadow-md rounded-lg p-4 mb-6">
      <!-- Cabeçalho do Post -->
      <div class="flex items-center gap-3 mb-3">
        <img class="h-12 w-12 rounded-full" src="https://th.bing.com/th/id/R.53fc4a014f8902c852580832e7e9a641?rik=dZ%2fzZgRJyHe7LQ&riu=http%3a%2f%2fwallpapercave.com%2fwp%2fw41X9md.jpg&ehk=7k6GB4jonvGvfO3rPlOlkjXipcxBvHFGBzkAUjHKirQ%3d&risl=&pid=ImgRaw&r=0" alt="Avatar">
        <h2 class="font-bold">nike</h2>
      </div>

      <!-- Imagem do Post -->
      <div class="mb-3">
        <img class="w-full rounded-lg" src="https://tse3.mm.bing.net/th/id/OIP.lfDEJvKRYhkpvQM3x5ZsowHaFb?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem do post">
      </div>

      <!-- Texto e tempo -->
      <div>
        <p class="mb-2">
          tenis transfere conforto para os pés,e com preços acessiveis e com novos modelo em destaques
        </p>
        <span class="text-sm text-gray-400">há 10 minutos</span>
      </div>
    </div>
  </main>
</body> 
</html>
