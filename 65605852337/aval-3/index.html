<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Social – Eventos da Escola</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800">

    <!-- HEADER -->
    <header class="bg-blue-700 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Eventos da Escola</h1>

        <!-- NAV TOPO -->
        <nav>
            <div class="flex space-x-4">

                <!-- Pesquisar -->
                <a href="#pesquisar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="white" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z" />
                    </svg>
                </a>

                <!-- Notificação -->
                <a href="#notificacoes">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="white" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h5l-1.4-1.4A2 2 0 0118 14V10a6 6 0 10-12 0v4c0 .53-.21 1.04-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </a>

            </div>
        </nav>
    </header>

    <!-- MAIN / FEED -->
    <main class="max-w-xl mx-auto p-4 space-y-6">

        <!-- NOVO TÓPICO COM H2 -->
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Últimos Eventos</h2>

        <!-- POST 1 -->
        <article class="bg-white rounded-xl shadow-md p-4">

            <!-- Cabeçalho -->
            <div class="flex items-center space-x-3 mb-3">
                
                <a href="#perfil" class="w-12 h-12 bg-gray-300 rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 14c4.418 0 8 1.79 8 4v2H4v-2c0-2.21 3.582-4 8-4z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 4a4 4 0 110 8 4 4 0 010-8z"/>
                    </svg>
                </a>

                <div>
                    <h3 class="font-bold">Feira Cultural</h3>
                    <span class="text-gray-500 text-sm">Postado há 2 dias</span>
                </div>
            </div>

            <!-- Texto -->
            <p class="mb-3">
                A Feira Cultural foi um sucesso! Confira algumas fotos do evento 📚✨
            </p>

            <!-- Imagem -->
            <img src="https://via.placeholder.com/500x300" class="rounded-lg w-full mb-3 shadow-sm">

            <!-- Ações -->
            <div class="flex justify-between text-gray-600">

                <!-- Curtir -->
                <a href="#curtir" class="flex items-center space-x-1 hover:text-blue-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 15l7-7 7 7" />
                    </svg>
                    <span>Curtir</span>
                </a>

                <!-- Comentar -->
                <a href="#comentar" class="flex items-center space-x-1 hover:text-blue-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h8M8 14h6M5 6h14v14l-4-4H5V6z" />
                    </svg>
                    <span>Comentar</span>
                </a>

                <!-- Compartilhar -->
                <a href="#compartilhar" class="flex items-center space-x-1 hover:text-blue-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 12v8h8m8-16h-8v8m8-8L4 20" />
                    </svg>
                    <span>Compartilhar</span>
                </a>

            </div>
        </article>

        <!-- POST 2 -->
        <article class="bg-white rounded-xl shadow-md p-4">
            <h3 class="font-bold text-lg">Dia da Família ❤️</h3>
            <p class="text-gray-700">Um dia especial unindo pais, alunos e professores.</p>
            <img src="https://via.placeholder.com/500x300" class="rounded-lg mt-3 shadow-sm">
        </article>

    </main>

    <!-- NAV INFERIOR / MENU -->
    <nav class="fixed bottom-0 left-0 w-full bg-white shadow-lg border-t flex justify-around py-3">

        <!-- Home -->
        <a href="#home" class="flex flex-col items-center text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h14a1 1 0 001-1V10" />
            </svg>
            <span class="text-xs">Home</span>
        </a>

        <!-- Pesquisar -->
        <a href="#pesquisar" class="flex flex-col items-center text-gray-600 hover:text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z"/>
            </svg>
            <span class="text-xs">Pesquisar</span>
        </a>

        <!-- Notificações -->
        <a href="#notificacoes" class="flex flex-col items-center text-gray-600 hover:text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.4-1.4A2 2 0 0118 14V10a6 6 0 10-12 0v4c0 .53-.21 1.04-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="text-xs">Alertas</span>
        </a>

        <!-- Perfil -->
        <a href="#perfil" class="flex flex-col items-center text-gray-600 hover:text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 14c4.418 0 8 1.79 8 4v2H4v-2c0-2.21 3.582-4 8-4z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 4a4 4 0 110 8 4 4 0 010-8z"/>
            </svg>
            <span class="text-xs">Perfil</span>
        </a>

    </nav>

</body>
</html>
