<!doctype html>
<html lang="pt-br">
<head>

  <title>Social Feed</title>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->

    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      Meu daily de fotografias
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>
      <a href="#" class="hover:text-blue-400">Amigos</a>

  <!-- POSTS -->

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://plus.unsplash.com/premium_photo-1697730150275-dba1cfe8af9c?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cGFwZWwlMjBkZSUyMHBhcmVkZSUyMG5vdmElMjB5b3JrfGVufDB8fDB8fHww&fm=jpg&q=60&w=3000$0
        " alt="">

      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
          paisagem urbana ao pôr do sol
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->

      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9OHAI7er0RViyfESl8zq5w6PnB355TbJo9A&s$0" alt="">
        <h2 class="text-lg font-semibold">FroJho</h2>
      </div>
