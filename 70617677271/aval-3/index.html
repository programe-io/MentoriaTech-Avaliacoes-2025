<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeParts Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="cabecalho">
        <h1>BikeParts ⚙️</h1>
        <nav>
            <a href="#">Feed</a>
            <a href="#">Vender</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <main class="feed-container">
        <div class="produto-card exemplo-estatico">
            <div class="produto-header">
                Vendedor_Exemplo
            </div>
            <img src="https://via.placeholder.com/600x400?text=Exemplo+Estatico" alt="Imagem de Exemplo de Peça" class="produto-imagem">
            <div class="produto-body">
                <h2>Cadeia de Bicicleta 12v</h2>
                <p class="produto-preco">R$ 120,00</p>
                <p class="produto-descricao">Corrente nova, nunca usada, ideal para 12 velocidades.</p>
            </div>
            <div class="interacoes">
                <button class="curtir-btn">
                    ❤️ <span>0</span> Curtidas
                </button>
                <button class="comprar-btn">
                    🛒 Comprar Agora
                </button>
            </div>
        </div>
        </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
