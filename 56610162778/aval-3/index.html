<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AestheticSocial</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- HEADER -->
    <header class="header">
        <a href="#" class="logo">🌸 AestheticSocial</a>
    </header>

    <!-- NAV -->
    <nav class="top-nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Explorar</a></li>
            <li><a href="#">Perfil</a></li>
        </ul>

        <div class="icons">
            <a href="#">❤️</a>
            <a href="#">🔍</a>
        </div>
    </nav>

    <!-- FEED -->
    <main class="feed">

        <h2 class="feed-title">Feed Aesthetic ✨</h2>

        <!-- POST 1 — MENINA -->
        <div class="post">
            <div class="user"><a href="#">@sofia</a></div>

            <!-- FOTO DE UMA MENINA (bem aesthetic, real) -->
            <img 
                src="https://images.pexels.com/photos/4158293/pexels-photo-4158293.jpeg?auto=compress&cs=tinysrgb&w=600"
                alt="menina sorrindo"
            >

            <p class="text">
                viajei nessas ondinhas🤍🦋
                <span class="destaque"></span>
            </p>
        </div>

        <!-- POST 2 -->
        <div class="post">
            <div class="user"><a href="#">@lilith</a></div>
            <img 
                src="https://images.pexels.com/photos/2531553/pexels-photo-2531553.jpeg?auto=compress&cs=tinysrgb&w=600"
                alt="duas amigas abraçadas"
            >
            <p class="text">sorrir e chorar e ter alguém pra compartilhar sempre…🫂💓</p>
        </div>

        <!-- POST 3 -->
        <div class="post">
            <div class="user"><a href="#">@manu</a></div>
            <img 
                src="https://images.pexels.com/photos/3026809/pexels-photo-3026809.jpeg?auto=compress&cs=tinysrgb&w=600"
                alt="menina tomando café"
            >
            <p class="text">☕️🧇💗</p>
        </div>

    </main>

</body>
</html>
