<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Jogo de Adivinhação</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                text-align: center;
                                                            background-color: #f0f0f0;
                                                                    }
                                                                            .container {
                                                                                        width: 300px;
                                                                                                    margin: 50px auto;
                                                                                                                padding: 20px;
                                                                                                                            border: 1px solid #ccc;
                                                                                                                                        border-radius: 10px;
                                                                                                                                                    box-shadow: 0 0 10px rgba(0,0,0,0.1);
                                                                                                                                                            }
                                                                                                                                                                    input[type="number"] {
                                                                                                                                                                                width: 50px;
                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                        font-size: 18px;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                    padding: 10px 20px;
                                                                                                                                                                                                                                                font-size: 18px;
                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                            #resultado {
                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                    font-size: 18px;
                                                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                            <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                                                                                                                                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                                                                                                                                                        <h2>Jogo de Adivinhação</h2>
                                                                                                                                                                                                                                                                                                                                                <p>Adivinhe um número entre 1 e 100:</p>
                                                                                                                                                                                                                                                                                                                                                        <input type="number" id="numero" min="1" max="100">
                                                                                                                                                                                                                                                                                                                                                                <button onclick="verificarNumero()">Tentar</button>
                                                                                                                                                                                                                                                                                                                                                                        <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                                                                <p id="tentativas">Tentativas: 0</p>
                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                let numeroAleatorio = Math.floor(Math.random() * 100) + 1;
                                                                                                                                                                                                                                                                                                                                                                                                        let tentativas = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                function verificarNumero() {
                                                                                                                                                                                                                                                                                                                                                                                                                            let numero = parseInt(document.getElementById("numero").value);
                                                                                                                                                                                                                                                                                                                                                                                                                                        tentativas++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("tentativas").innerText = "Tentativas: " + tentativas;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (numero < 1 || numero > 100) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("resultado").innerText = "Digite um número entre 1 e 100!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (numero < numeroAleatorio) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("resultado").innerText = "Muito baixo! Tente novamente.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else if (numero > numeroAleatorio) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("resultado").innerText = "Muito alto! Tente novamente.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("resultado").innerText = "Parabéns! Você acertou em " + tentativas + " tentativas!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("numero").disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.querySelector("button").disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
