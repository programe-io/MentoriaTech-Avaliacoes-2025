<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>QuizBrasil - Jogo de Perguntas</title>
                <link rel="stylesheet" href="style.css"> <!-- Linka o arquivo CSS -->
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <header>
                            <h1>QuizBrasil</h1>
                                    <nav>
                                                <!-- Navegação pode ser expandida, mas para o quiz simples, um link para reiniciar é suficiente -->
                                                            <a href="index.html">Início</a>
                                                                    </nav>
                                                                        </header>

                                                                            <main>
                                                                                    <aside>
                                                                                                <!-- Área lateral para informações adicionais ou placar -->
                                                                                                            <h3>Progresso</h3>
                                                                                                                        <p>Perguntas respondidas: <span id="progresso">0/0</span></p>
                                                                                                                                    <img src="via.placeholder.com" alt="Bandeira do Brasil" id="quiz-img">
                                                                                                                                            </aside>

                                                                                                                                                    <article class="quiz-container">
                                                                                                                                                                <!-- Conteúdo principal do quiz -->
                                                                                                                                                                            <h3 id="pergunta">Carregando pergunta...</h3>
                                                                                                                                                                                        <div id="opcoes" class="opcoes-container">
                                                                                                                                                                                                        <!-- Opções de resposta serão inseridas aqui via JavaScript -->
                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                <button id="proximo-btn" class="esconder">Próxima Pergunta</button>
                                                                                                                                                                                                                                        </article>
                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                        <p>&copy; 2025 QuizBrasil. Todos os direitos reservados.</p>
                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                <script src="script.js"></script> <!-- Linka o arquivo JavaScript -->
                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                </html>
