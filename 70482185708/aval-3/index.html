<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Jogo da Memória</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>

                    <header>
                            <h1>Jogo da Memória</h1>
                                    <p>Encontre os pares e vença o jogo!</p>
                                        </header>

                                            <nav>
                                                    <ul>
                                                                <li><a href="#jogo">Jogar</a></li>
                                                                            <li><a href="#instrucoes">Instruções</a></li>
                                                                                    </ul>
                                                                                        </nav>

                                                                                            <main>
                                                                                                    <div class="game-container" id="game-board">
                                                                                                                <!-- As cartas do jogo serão inseridas aqui via JavaScript -->
                                                                                                                        </div>
                                                                                                                                <div id="game-message"></div>
                                                                                                                                    </main>

                                                                                                                                        <aside>
                                                                                                                                                <h2>Status do Jogo</h2>
                                                                                                                                                        <p>Movimentos: <span id="moves-count">0</span></p>
                                                                                                                                                                <button onclick="startGame()">Reiniciar Jogo</button>
                                                                                                                                                                        <img src="via.placeholder.com" alt="Imagem de placeholder do jogo">
                                                                                                                                                                            </aside>

                                                                                                                                                                                <footer>
                                                                                                                                                                                        <p>&copy; 2025 Jogo da Memória. Todos os direitos reservados.</p>
                                                                                                                                                                                            </footer>

                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                </html>
