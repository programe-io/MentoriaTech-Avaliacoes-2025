<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ForcaSerrinha - Jogo da Forca</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <header>
                            <h1>ForcaSerrinha</h1>
                                    <nav>
                                                <ul>
                                                                <li><a href="#jogo">Jogo</a></li>
                                                                                <li><a href="#regras">Regras</a></li>
                                                                                                <li><a href="#sobre">Sobre</a></li>
                                                                                                            </ul>
                                                                                                                    </nav>
                                                                                                                        </header>

                                                                                                                            <main>
                                                                                                                                    <aside class="forca-container">
                                                                                                                                                <!-- Imagem da forca será atualizada via JavaScript -->
                                                                                                                                                            <img id="forca-img" src="images/forca_0.png" alt="Imagem da Forca">
                                                                                                                                                                    </aside>

                                                                                                                                                                            <section id="jogo" class="game-area">
                                                                                                                                                                                        <h3>Área de Jogo</h3>
                                                                                                                                                                                                    <div class="word-display" id="word-display">
                                                                                                                                                                                                                    <!-- A palavra secreta com espaços será exibida aqui -->
                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                            <div class="clue-display" id="clue-display">
                                                                                                                                                                                                                                                            <!-- A dica da palavra será exibida aqui -->
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                    <div class="keyboard" id="keyboard">
                                                                                                                                                                                                                                                                                                    <!-- Botões do teclado serão gerados via JavaScript -->
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                            <div class="message-area" id="message-area">
                                                                                                                                                                                                                                                                                                                                            <!-- Mensagens de vitória ou derrota -->
                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                    <button id="restart-button" style="display: none;">Jogar Novamente</button>
                                                                                                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                    <footer>
                                                                                                                                                                                                                                                                                                                                                                                            <article id="regras">
                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Regras do Jogo</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                    <p>&copy; 2024 ForcaSerrinha. Desenvolvido com HTML, CSS e JavaScript.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                <p id="sobre">Regras: Adivinhe a palavra secreta antes que o boneco seja enforcado!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </article>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
