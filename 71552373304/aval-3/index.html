<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Jogo de Adivinhar a Palavra</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
                <body>
                    <div class="container">
                            <header>
                                        <h1>Adivinhe a Palavra</h1>
                                                    <!-- A tag h2 foi adicionada aqui, e a span envolve a palavra "divertido" -->
                                                                <h2>Um jogo <span id="span-divertido">divertido</span> de vocabulário!</h2> 
                                                                            <!-- A tag img foi adicionada aqui -->
                                                                                        <img src="caminho/para/sua/imagem.png" alt="Descrição da imagem do jogo" style="max-width: 100%; height: auto; display: block; margin: 0 auto 20px;">
                                                                                                </header>

                                                                                                                <nav>
                                                                                                                            <ul>
                                                                                                                                            <li><a href="#game-board">Jogo</a></li>
                                                                                                                                                            <li><a href="#how-to-play">Como Jogar</a></li>
                                                                                                                                                                            <li><a href="#about">Sobre</a></li>
                                                                                                                                                                                        </ul>
                                                                                                                                                                                                </nav>

                                                                                                                                                                                                        <main>
                                                                                                                                                                                                                    <!-- A tag p foi adicionada aqui para descrever a ação do usuário, e a span envolve a palavra "Adivinhar" -->
                                                                                                                                                                                                                                <p>Digite seu palpite abaixo e pressione "<span class="span-acao">Adivinhar</span>".</p>
                                                                                                                                                                                                                                            <div id="game-board"></div>
                                                                                                                                                                                                                                                        <div id="message-area"></div>
                                                                                                                                                                                                                                                                    <input type="text" id="guess-input" maxlength="9" autofocus>
                                                                                                                                                                                                                                                                                <button id="submit-button">Adivinhar</button>
                                                                                                                                                                                                                                                                                            <button id="restart-button" style="display: none;">Jogar Novamente</button>
                                                                                                                                                                                                                                                                                                    </main>
                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                                                            </html>
