<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed - FroJho</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f2f5f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1e3a8a;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      background-color: #1e3a8a;
      display: flex;
      justify-content: center;
      padding: 10px;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    section.profile {
      background-color: #1e3a8a;
      color: white;
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 15px;
    }

    section.profile img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid white;
    }

    section.profile h2 {
      font-size: 1.4rem;
    }

    article {
      padding: 20px;
      text-align: center;
    }

    .image-gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .image-gallery img {
      width: 200px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .description {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
      text-align: justify;
    }

    footer {
      background-color: #1e3a8a;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
    }

    span.highlight {
      color: #ffbb00;
      font-weight: bold;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>LOGO</header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Projetos</a>
    <a href="#">Contato</a>
  </nav>

  <main>
    <section class="profile">
      <img src="https://i.pravatar.cc/100" alt="Avatar do usuário">
      <h2>FroJho</h2>
    </section>

    <article>
      <div class="image-gallery">
        <img src="https://via.placeholder.com/200x400?text=App+1" alt="App 1">
        <img src="https://via.placeholder.com/200x400?text=App+2" alt="App 2">
        <img src="https://via.placeholder.com/200x400?text=App+3" alt="App 3">
      </div>

      <p class="description">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. 
        Quod beatae quas nihil sed fugiat repellat delectus ut tempora 
        debitis deserunt. <span class="highlight">FroJho</span> desenvolve aplicativos 
        com design moderno e intuitivo.
      </p>
    </article>
  </main>

  <footer>
    © 2025 <span class="highlight">FroJho</span> - Todos os direitos reservados.
  </footer>

  <script>
    // Exemplo de JS simples — alerta ao clicar no nome do usuário
    document.querySelector('.profile h2').addEventListener('click', () => {
      alert('Perfil de FroJho aberto!');
    });
  </script>
<script src="script.js"></script></body>
</html>
