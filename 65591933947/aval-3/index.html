<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura Completa com Span</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; line-height: 1.6; }
        header { background: #1a1a1a; color: white; padding: 15px; text-align: center; }
        nav { background: #f4f4f4; padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        nav a { margin: 0 10px; text-decoration: none; color: #333; }
        
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        
        .post-img { width: 100%; border-radius: 8px; }

        /* Estilo específico para o nosso span */
        .destaque { 
            color: #e74c3c; 
            font-weight: bold; 
            background: #fdf2f2;
            padding: 2px 5px;
            border-radius: 3px;
        }

        footer { text-align: center; margin-top: 50px; padding: 20px; background: #eee; }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Blog de Desenvolvimento</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Tutoriais</a>
        <a href="#">Contato</a>
    </nav>

    <div class="container">
        <main>
            <img src="https://via.placeholder.com/800x300" alt="Banner do artigo" class="post-img">
            
            <h2>Aprendendo Tags Inline</h2>
            <p>
                O HTML é composto por diversos elementos. Um dos mais úteis é o 
                <span class="destaque">elemento span</span>, 
                que serve para destacar informações dentro de um parágrafo.
            </p>
        </main>
    </div>

    <footer>
        <p>&copy; 2025 - <span style="color: #555;">Versão 1.0</span></p>
    </footer>

</body>
</html>
