<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rede Social Simples</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <img src="https://via.placeholder.com/80" alt="Logo da Mini Rede Social" class="logo" />
      <h1>Mini Rede Social</h1>
      <nav>
        <ul class="menu">
          <li><a href="#login-section" id="nav-login">Login</a></li>
          <li><a href="#feed-section" id="nav-feed">Feed</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="login-section">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Digite seu nome" />
        <button id="login-btn">Entrar</button>
      </section>

      <section id="feed-section" style="display:none;">
        <h2>Olá, <span id="user-display"></span>!</h2>
        
        <textarea id="post-content" placeholder="Escreva algo..."></textarea>
        <button id="post-btn">Postar</button>

        <h3>Feed</h3>
        <div id="posts-container"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
<section id="feed-section" style="display:none;">
  <h2>Olá, <span id="user-display"></span>!</h2>
  
  <p>Escreva algo para compartilhar com seus amigos!</p>

  <textarea id="post-content" placeholder="Escreva algo..."></textarea>
  <button id="post-btn">Postar</button>

  <h3>Feed</h3>
  <div id="posts-container"></div>
</section>
