<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias Aleatórias</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>

        <!-- IMAGEM OBRIGATÓRIA -->
        <img src="logo.png" alt="Logo do site" id="logo-site">

        <h1>
            Portal de Notícias 
            <span class="destaque">Aleatórias</span> <!-- SPAN OBRIGATÓRIO -->
        </h1>

        <!-- NAV OBRIGATÓRIA -->
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Notícias</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- DIV OBRIGATÓRIA -->
        <div id="container-noticias">
            <h2>Última notícia</h2>

            <!-- Imagem genérica da notícia -->
            <img src="noticia.jpg" alt="Imagem da notícia" id="img-noticia">

            <p id="noticia-texto">
                Clique no botão para gerar uma notícia!
            </p>

            <button id="btn-gerar">Gerar notícia</button>
        </div>

    </main>

    <footer>
        <p>
            Desenvolvido para avaliação – 
            <span class="ano">2025</span> <!-- SPAN EXTRA SE QUISER -->
        </p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
