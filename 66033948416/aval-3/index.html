<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- HEADER -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">MeuFeed</h1>
        <input type="text" placeholder="Buscar..."
               class="border rounded-lg px-3 py-1 w-1/2">
        <button class="bg-blue-600 text-white px-4 py-1 rounded">Perfil</button>
    </header>

    <!-- NAV -->
    <nav class="bg-white mt-2 shadow flex gap-6 p-3 justify-center">
        <a href="#" class="text-blue-600 font-semibold">Home</a>
        <a href="#" class="text-gray-600 hover:text-blue-600">Explorar</a>
        <a href="#" class="text-gray-600 hover:text-blue-600">Mensagens</a>
        <a href="#" class="text-gray-600 hover:text-blue-600">Notificações</a>
    </nav>

    <!-- MAIN FEED -->
    <main class="p-4 max-w-xl mx-auto">

        <!-- Criar postagem -->
        <section class="bg-white p-4 shadow rounded mb-4">
            <textarea class="w-full border rounded p-2" placeholder="No que você está pensando?"></textarea>
            <button class="bg-blue-600 text-white px-4 py-1 rounded mt-2">Publicar</button>
        </section>

        <!-- Post 1 -->
        <article class="bg-white p-4 shadow rounded mb-4">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-blue-400 rounded-full"></div>
                <h2 class="font-semibold">João Silva</h2>
                <!-- TAG SPAN -->
                <span class="text-gray-500 text-sm ml-auto">há 2h</span>
            </div>

            <p class="text-gray-700 mb-3">Dia incrível trabalhando no meu projeto! 🚀</p>

            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d"
                 class="rounded-lg mb-3">

            <div class="flex justify-between text-gray-600">
                <button>
                    ❤️ Curtir 
                    <!-- TAG SPAN -->
                    <span class="text-sm text-gray-500">(12)</span>
                </button>

                <button>
                    💬 Comentar 
                    <!-- TAG SPAN -->
                    <span class="text-sm text-gray-500">(3)</span>
                </button>

                <button>🔁 Compartilhar</button>
            </div>
        </article>

        <!-- Post 2 -->
        <article class="bg-white p-4 shadow rounded mb-4">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-purple-400 rounded-full"></div>
                <h2 class="font-semibold">Maria Oliveira</h2>
                <!-- TAG SPAN -->
                <span class="text-gray-500 text-sm ml-auto">há 30min</span>
            </div>

            <p class="text-gray-700 mb-3">Alguém indica um bom livro para iniciantes em programação?</p>

            <div class="flex justify-between text-gray-600">
                <button>
                    ❤️ Curtir 
                    <span class="text-sm text-gray-500">(8)</span>
                </button>
                <button>
                    💬 Comentar 
                    <span class="text-sm text-gray-500">(1)</span>
                </button>
                <button>🔁 Compartilhar</button>
            </div>
        </article>

    </main>

</body>
</html>
