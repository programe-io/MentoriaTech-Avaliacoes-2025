<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet">
</head>
<body>
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Sneaker Feed Vendas | Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <h1>👟 SneakerFeed</h1>
        <nav>
            <a href="#">Explorar</a>
            <a href="#">Minha Conta</a>
            <button id="abrir-modal">Novo Post</button>
        </nav>
    </header>

    <main class="feed-container" id="feed-container">

        <h2 class="feed-title">Posts Populares</h2>
        
        <article class="post">
            <div class="post-header">
                <span class="username">@sneakerhead_br</span>
            </div>
            <img src="https://static.prospin.com.br/media/catalog/product/cache/81c6452a3bb187aaac136acdef0f9f62/1/0/1041a485-400-tenis-asics-gel-resolution-x-clay-masc-marinho-e-creme.jpg" alt="Tênis Exemplo" class="post-image">
            <div class="post-actions">
                <button class="like-btn"><i class="far fa-heart"></i> <span>250</span></button>
                <span class="price">R$ 599,90</span>
            </div>
            <p class="post-description">VENDO! Nike Air Jordan 1 'Chicago' - Tamanho 42. Novo na caixa. Mais infos inbox!</p>
            <a href="#" class="buy-link">Mandar Mensagem</a>
        </article>

    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Criar Novo Post de Venda</h3>
            <form id="new-post-form">
                <input type="text" id="post-username" placeholder="Seu @nome_de_usuario" required>
                <input type="text" id="post-image-url" placeholder="URL da imagem do tênis"
  <script src="script.js"></script>
  
</body>
</html>
