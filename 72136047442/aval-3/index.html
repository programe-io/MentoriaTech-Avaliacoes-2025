<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delícias Express - Menu</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <img src="https://via.placeholder.com/100x50?text=LOGO" alt="Logo Delícias Express" class="store-logo">
        
        <h1>Delícias Express 🍔🍕</h1>
        <p>Seu pedido entregue na velocidade da luz!</p>
        
        <nav class="main-nav">
            <a href="#menu-container">Cardápio</a>
            <a href="#cart-items">Carrinho</a>
        </nav>
    </header>

    <div class="container">
        <main class="menu" id="menu-container">
            <h2>Nosso Cardápio</h2>
            </main>

        <aside class="cart-sidebar">
            <h2>🛒 Seu Carrinho</h2>
            <div id="cart-items">
                <p class="empty-cart-message">O carrinho está vazio.</p>
            </div>
            <div class="cart-total">
                <p>Total: <span id="cart-total-value">R$ 0.00</span></p>
            </div>
            <button id="checkout-btn">Finalizar Pedido</button>
        </aside>
    </div>

    <footer>
        <p>&copy; 2025 Delícias Express. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
