<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Feed</title>

    <!-- Tailwind compilado -->
    <link href="./output.css" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

    <!-- HEADER -->
    <header class="shadow-md p-5 flex items-center justify-between">
        <div class="flex-1 uppercase font-bold text-center md:text-left">
            Logo
        </div>

        <nav class="font-bold gap-3 hidden md:flex">
            <a href="">Início</a>
            <a href="">Amigos</a>
            <a href="">Perfil</a>
        </nav>
    </header>

    <!-- MAIN (tudo alinhado em coluna reta) -->
    <main class="w-full flex flex-col items-center py-6 px-4">

        <!-- POST CARD -->
        <div class="bg-gray-800 py-4 rounded-lg shadow-md w-full max-w-xl">

            <!-- CARD HEADER -->
            <div class="flex items-center pb-4 px-4 gap-3">
                <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="images/user.png" alt="">
                <h2 class="text-2xl">FroJho</h2>
            </div>

            <!-- CARD IMAGE -->
            <img class="w-full" src="images/post_81.png" alt="">

            <!-- CARD CONTENT -->
            <div class="pt-4 px-4">
                <p class="text-sm text-justify">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, debitis.
                </p>

                <span class="text-xs text-gray-300 text-right block mt-4">
                    há 10 minutos
                </span>
            </div>

        </div>

    </main>

</body>
</html>
