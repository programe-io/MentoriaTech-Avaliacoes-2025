!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Social.Feed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-red-800 to-blue-600 min-h-screen text-white">
  <!-- HEADER -->
  <header class="shadow-md p-5 flex justify-between items-center bg-gray-800">
    <div class="uppercase font-bold text-xl">
      Logo
    </div> 
    <nav class="flex gap-6 font-bold">
      <a href="#" class="hover:text-pink-300">Introdução</a>
      <a href="#" class="hover:text-pink-300">naike,</a>
      <a href="#" class="hover:text-green-300"></a>
    </nav>
  </header>

  <!-- MAIN FEED -->
  <main class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold underline text-center mb-6">Social Feed</h1>

    <!-- POST CARD -->
    <div class="bg-black-800 shadow-md rounded-lg p-4 mb-6">
      <!-- Cabeçalho do Post -->
      <div class="flex items-center gap-3 mb-3">
      <img class="h-12 w-12 rounded-full" src="https://img.freepik.com/premium-vector/vector-logo-illustration-blue-shark-simple-mascot-style_116762-8952.jpg">
    
        <h2 class="font-bold">blue shark</h2>
      </div>

      <!-- Imagem do Post -->
      <div class="mb-3">
        <img class="w-full rounded-lg" src="https://imgcentauro-a.akamaihd.net/1366x1366/88196302A1.jpg" alt="Imagem do post">
      </div>

      <!-- Texto e tempo -->
      <div>
        <p class="mb-2">
          A do momento
        </p>
        <span class="text-sm text-gray-400">há 10 minutos</span>
      </div>
    </div>
  </main>
</body> 
</html>
