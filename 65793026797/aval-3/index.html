<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Social</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-b from-amber-800 to-yellow-900 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex items-center">
    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      FEED
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-yellow-400">Página Inicial</a>
      <a href="#" class="hover:text-yellow-400">Contatos</a>
      <a href="#" class="hover:text-yellow-400">Meu Perfil</a>
    </nav>
  </header>

  <!-- POSTS -->
  <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-yellow-500" src="download (2).jpg" alt="">
        <h2 class="text-lg font-semibold">Nícolas</h2>
      </div>
      <!-- CARD IMAGE -->
      <img class="w-full h-48 object-cover" src="download (1).jpg" alt="">
      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
          Eu queria um café
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 5 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-yellow-500" src="download (2).jpg" alt="">
        <h2 class="text-lg font-semibold">Nícolas</h2>
      </div>
      <img class="w-full h-48 object-cover" src="download.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Ou, um dia de chuva seria incrível hoje cara, que calor
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 12 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-yellow-500" src="download (2).jpg" alt="">
        <h2 class="text-lg font-semibold">Nícolas</h2>
      </div>
      <img class="w-full h-48 object-cover" src="Azj_dACCYAAdsLx.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Eu na antena parabólica
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 30 minutos</span>
      </div>
    </div>

  </main>

</body>
</html>
