<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editora de Imagens Avançada</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #f0f4f8, #e0f0ff);
        margin: 0;
        padding: 0;
        color: #333;
    }
    nav {
        background: #0077cc;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
    }
    nav .logo {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
    }
    nav ul li a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }
    nav ul li a:hover {
        color: #ffcc00;
    }
    .imge-container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 30px;
        border-radius: 15px;
        background: #ffffff;
        border: 2px solid #0077cc;
        box-shadow: 0 10px 30px rgba(0, 119, 204, 0.3);
        transition: all 0.3s ease;
    }
    .imge-container:hover {
        box-shadow: 0 15px 40px rgba(0, 119, 204, 0.5);
    }
    header.container-title h2 {
        font-size: 36px;
        font-weight: bold;
        color: #005fa3;
        text-align: center;
        margin-bottom: 40px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        letter-spacing: 1px;
    }
    .imge-images {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: space-between;
        opacity: 0;
        animation: fadeIn 1s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .imge-images div {
        position: relative;
        background: #ffffff;
        padding: 15px;
        border-radius: 12px;
        flex: 1 1 250px;
        min-width: 220px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
        transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
        overflow: hidden;
    }
    .imge-images div:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        background-color: #f0f8ff;
    }
    .imge-images div::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 10px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 2px solid #0077cc;
        background-size: cover;
        background-position: center;
        transition: transform 0.3s, box-shadow 0.3s;
    }
    .imge-images div:hover::before {
        transform: scale(1.1);
        box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .imge-images div:nth-child(1)::before { background-image: url('https://server.wallpaperalchemy.com/storage/wallpapers/91/4k-black-hole-minimalistic-wallpaper.png'); }
    .imge-images div:nth-child(2)::before { background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20240911/pngtree-surreal-moonlit-panorama-pc-wallpaper-image_16148136.jpg'); }
    .imge-images div:nth-child(3)::before { background-image: url('https://images.unsplash.com/photo-1431440869543-efaf3388c585?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8cGFwZWwlMjBkZSUyMHBhcmVkZSUyMGRlc2t0b3B8ZW58MHx8MHx8fDA='); }
    .imge-images img { width: 100%; height: auto; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover; transition: transform 0.3s, filter 0.3s; }
    .imge-images img:hover { transform: scale(1.05); filter: brightness(1.1); }
    .imge-images p { margin-top: 12px; font-size: 15px; font-weight: 500; color: #333; }
    .imge-images button { margin-top: 10px; padding: 8px 15px; background: #0077cc; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s, transform 0.3s; }
    .imge-images button:hover { background: #005fa3; transform: scale(1.05); }
    .imge-images div::after {
        content: attr(data-tooltip);
        position: absolute;
        top: -30px;
        left: 70px;
        background: #0077cc;
        color: #fff;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        white-space: nowrap;
    }
    .imge-images div:hover::after { opacity: 1; }
    .tag {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #ff5722;
        color: #fff;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 5px;
        text-transform: uppercase;
        font-weight: bold;
    }
    @media (max-width: 900px) { .imge-images div { flex: 1 1 45%; } }
    @media (max-width: 600px) {
        .imge-images div { flex: 1 1 100%; }
        header.container-title h2 { font-size: 28px; }
        nav ul { flex-direction: column; gap: 10px; }
        .imge-images div::before { width: 40px; height: 40px; }
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<nav>
    <div class="logo">Editora X</div>
    <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Galeria</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Contato</a></li>
    </ul>
</nav>

<main>
    <section class="imge-container">
        <!-- ✅ Header com h2 obrigatório -->
        <header class="container-title">
            <h2>LOGO</h2>
        </header>

        <div class="imge-images">
            <div data-tooltip="Miniatura do Buraco Negro">
                <span class="tag">Novo</span>
                <img src="https://server.wallpaperalchemy.com/storage/wallpapers/91/4k-black-hole-minimalistic-wallpaper.png" alt="Imagem X" />
                <p>Imagem X - Buraco Negro Minimalista</p>
                <button>Visualizar</button>
            </div>
            <div data-tooltip="Miniatura do Panorama Surreal">
                <span class="tag">Popular</span>
                <img src="https://png.pngtree.com/thumb_back/fh260/background/20240911/pngtree-surreal-moonlit-panorama-pc-wallpaper-image_16148136.jpg" alt="Imagem Y" />
                <p>Imagem Y - Panorama Surreal ao Luar</p>
                <button>Visualizar</button>
            </div>
            <div data-tooltip="Miniatura Papel de Parede Desktop">
                <span class="tag">Top</span>
                <img src="https://images.unsplash.com/photo-1431440869543-efaf3388c585?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8cGFwZWwlMjBkZSUyMHBhcmVkZSUyMGRlc2t0b3B8ZW58MHx8MHx8fDA=" alt="Imagem Z" />
                <p>Imagem Z - Papel de Parede Desktop</p>
                <button>Visualizar</button>
            </div>
        </div>
    </section>
</main>

</body>
</html>
