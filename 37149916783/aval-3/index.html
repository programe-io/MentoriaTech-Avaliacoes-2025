<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FroJho</title>
    <link href="style.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

  <body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">
    <!-- HEADER -->
    <header class="shadow-md p-5 flex justify-between items-center bg-blue-900">
      <h1 class="font-bold text-xl"><span>LOGO</span></h1>
      <nav class="font-bold gap-5 hidden md:flex">
        <a href="#" class="hover:text-blue-300"><span>Início</span></a>
        <a href="#" class="hover:text-blue-300"><span>Amigos</span></a>
        <a href="#" class="hover:text-blue-300"><span>Perfil</span></a>
      </nav>
    </header>

    <!-- PERFIL -->
    <section class="flex items-center gap-4 p-6">
      <img
        src="https://i.imgur.com/nJ3h5Xp.jpg"
        alt="Avatar"
        class="w-20 h-20 rounded-full border-4 border-blue-700"
      />
      <h2 class="text-2xl font-bold"><span>FroJho</span></h2>
    </section>

    <!-- POSTS -->
    <main class="px-6 grid md:grid-cols-3 gap-6">
      <!-- CARD 1 -->
      <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden">
        <img src="https://i.imgur.com/pBEPQyK.jpg" alt="Hambúrguer delicioso" class="w-full h-48 object-cover" />
        <div class="p-4">
          <p class="text-sm mb-2">
            <span>🍔 Novo lanche especial da semana! Peça o seu agora!</span>
          </p>
          <p class="text-pink-500 text-sm">
            <span>❤️ 152 curtidas</span>
          </p>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden">
        <img src="https://i.imgur.com/Ngcy2tK.jpg" alt="App de delivery" class="w-full h-48 object-cover" />
        <div class="p-4">
          <p class="text-sm mb-2">
            <span>📱 Nosso app de delivery ficou de cara nova, confira!</span>
          </p>
          <p class="text-pink-500 text-sm">
            <span>❤️ 99 curtidas</span>
          </p>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden">
        <img src="https://i.imgur.com/Z5N7xHp.jpg" alt="Reunião de trabalho" class="w-full h-48 object-cover" />
        <div class="p-4">
          <p class="text-sm mb-2">
            <span>📖 Agora entregamos em toda a cidade! Veja as rotas no app.</span>
          </p>
          <p class="text-pink-500 text-sm">
            <span>❤️ 203 curtidas</span>
          </p>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  <script src="script.js"></script></body>
</html>
