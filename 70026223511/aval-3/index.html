<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Número</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    
    <header>
        <img src="caminho/do/seu/logo.png" alt="Logo de um ponto de interrogação indicando adivinhação" style="height: 40px; vertical-align: middle;">
        <h1>Jogo de Adivinhação</h1>
        
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Regras</a></li>
                <li><a href="#">Placar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Adivinhe o Número Secreto!</h2>
            <p>Tente adivinhar o número entre 1 e 100.</p>
            
            <div class="controles">
                <input type="number" id="palpiteEntrada" placeholder="Seu palpite" min="1" max="100">
                <button id="enviarPalpite">Tentar</button>
            </div>
            
            <p class="mensagem" id="mensagem"></p>
            
            <p class="tentativas">Tentativas: <span id="tentativas">0</span></p>

            <button id="reiniciarJogo" style="display:none;">Reiniciar Jogo</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Projeto JavaScript Simples</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
