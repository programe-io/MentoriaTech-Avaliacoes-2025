<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fofucha Books - Coleção Sobrenatural</title>
  <link rel="stylesheet" href="style.css" />
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <!-- Logotipo da livraria -->
    <div class="logo">
      <img src="https://via.placeholder.com/40x40?text=📚" alt="Logo Fofucha Books">
      <h1>Fofucha Books</h1>
    </div>

    <!-- Menu de navegação -->
    <nav>
      <ul class="menu">
        <li><a href="#">Início</a></li>
        <li><a href="#">Coleções</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>

    <!-- Carrinho -->
    <div id="cart">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <section class="banner">
    <h2>Coleção Sobrenatural</h2>
    <p>Descubra os mistérios além do véu! 📚✨</p>
  </section>

  <main id="product-list">
    <!-- Livros serão carregados aqui via JavaScript -->
  </main>

  <section id="cart-section">
    <h2>Seu Carrinho</h2>
    <ul id="cart-items"></ul>
    <p>Total: R$ <span id="total-price">0.00</span></p>
  </section>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
