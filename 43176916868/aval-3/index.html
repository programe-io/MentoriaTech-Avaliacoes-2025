<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FroJho Lanches</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>FroJho Lanches</h1>
        <nav>
            <ul>
                <li><a href="#menu">Cardápio</a></li>
                <li><a href="#pedido">Fazer Pedido</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="menu">
            <h2>Nosso Cardápio</h2>
            <div class="produtos">
            <div class="produto">
                <img src="https://media.istockphoto.com/id/1439433606/pt/foto/hot-dog-isolated-on-white-background-clipping-path-full-depth-of-field.jpg?s=1024x1024&w=is&k=20&c=w7czbrCcPkUW6i0T_VRK68MYjt30wUlQRKTm7Y2arKA=" alt="Cachorro Quente">
                <h3>Cachorro Quente</h3>
                <p>R$ 12,00</p>
                <button onclick="adicionarPedido('Cachorro Quente', 12)">Adicionar</button>
            </div>
            <div class="produto">
                <img src="https://images.pexels.com/photos/1251198/pexels-photo-1251198.jpeg" alt="Hambúrguer">
                <h3>Hambúrguer</h3>
                <p>R$ 18,00</p>
                <button onclick="adicionarPedido('Hambúrguer', 18)">Adicionar</button>
            </div>
            <div class="produto">
                <img src="https://images.pexels.com/photos/1583884/pexels-photo-1583884.jpeg" alt="Batata Frita">
                <h3>Batata Frita</h3>
                <p>R$ 10,00</p>
                <button onclick="adicionarPedido('Batata Frita', 10)">Adicionar</button>
            </div>
            <div class="produto">
                <img src="https://images.pexels.com/photos/50593/coca-cola-cold-drink-soft-drink-coke-50593.jpeg" alt="Refrigerante">
                <h3>Refrigerante</h3>
                <p>R$ 6,00</p>
                <button onclick="adicionarPedido('Refrigerante', 6)">Adicionar</button>
            </div>
        </div>
        </section>

        <section id="pedido">
            <h2>Seu Pedido</h2>
            <ul id="lista-pedidos"></ul>
            <p>Total: R$ <span id="total">0</span>,00</p>
        </section>
    </main>

    <footer id="contato">
        <p>Entre em contato: contato@frojho.com</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
