<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="tool-card">
    <div class="tool-title">
       <h1 📋 Gerenciador de Tarefas
    </div>
    <input type="text" class="task-input" id="taskInput" placeholder="Digite uma nova tarefa..." onkeypress="handleTaskEnter(event)">
    <button class="btn btn-primary" onclick="addTask()" style="width: 100%; margin-bottom: 20px;">Adicionar Tarefa</button>
    <div class="task-list" id="taskList">
       <p <!-- Tarefas serão adicionadas aqui -->
    </div>
</div>

<!-- Calculadora de Eficiência -->
<div class="tool-card">
    <div class="tool-title">
        📊 Calculadora de Eficiência
    </div>
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">Produção Planejada:</label>
        <input type="number" id="plannedProduction" class="task-input" placeholder="Ex: 1000 unidades">
    </div>
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">Produção Real:</label>
        <input type="number" id="actualProduction" class="task-input" placeholder="Ex: 850 unidades">
    </div>
    <button class="btn btn-primary" onclick="calculateEfficiency()" style="width: 100%; margin-bottom: 15px;">Calcular Eficiência</button>
    <div id="efficiencyResult" style="padding: 15px; background: #f8f9fa; border-radius: 8px; text-align: center; font-weight: 500;">
        Resultado aparecerá aqui
    </div>
    <nav>
</div>

<aside>
    <article>
<header>
    <a>
        <h3>
            <main>
                <footer>
<img>

  
  
</body>
</html>
