<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Feed - Heverton</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
        <body>

        <header>
          <h2>Heverton</h2>
          </header>

          <nav>
            <a href="#" class="nav-item">Home</a>
              <a href="#" class="nav-item">Perfil</a>
                <a href="#" class="nav-item">Configurações</a>
                </nav>

                <main>

                  <section class="stories">
                      <h3>Stories</h3>
                          <div class="stories-container">

                                <div class="story">
                                        <img src="story1.jpg" alt="Story 1">
                                                <span>Story 1</span>
                                                      </div>

                                                            <div class="story">
                                                                    <img src="story2.jpg" alt="Story 2">
                                                                            <span>Story 2</span>
                                                                                  </div>

                                                                                        <div class="story">
                                                                                                <img src="story3.jpg" alt="Story 3">
                                                                                                        <span>Story 3</span>
                                                                                                              </div>

                                                                                                                  </div>
                                                                                                                    </section>

                                                                                                                      <section class="post-section">
                                                                                                                          <h3>Novo Post</h3>

                                                                                                                              <input type="file" id="fileInput" accept="image/*">

                                                                                                                                  <textarea id="postText" placeholder="Escreva algo..."></textarea>

                                                                                                                                      <button id="postButton">Postar</button>
                                                                                                                                        </section>

                                                                                                                                          <div id="feed"></div>

                                                                                                                                          </main>

                                                                                                                                          <footer>
                                                                                                                                            <p class="creditos">Criado por Heverton, dia 10/12/25</p>
                                                                                                                                            </footer>

                                                                                                                                            <script src="script.js"></script>
                                                                                                                                            <script src="script.js"></script></body>
                                                                                                                                            </html>
