<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>

    <!-- Tailwind CSS compilado -->
    <link href="./output.css" rel="stylesheet">

    <!-- CSS extra opcional -->
    <link href="./style.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

    <!-- HEADER -->
    <header class="shadow-md p-5 flex items-center">
        <div class="flex-1 uppercase font-bold text-center md:text-left text-lg">
            Social Feed
        </div>

        <!-- Menu desktop -->
        <nav class="font-bold gap-5 hidden md:flex">
            <a href="#" class="hover:text-blue-300">Início</a>
            <a href="#" class="hover:text-blue-300">Amigos</a>
            <a href="#" class="hover:text-blue-300">Perfil</a>
        </nav>

        <!-- Botão mobile -->
        <button id="mobileBtn" class="md:hidden text-2xl">☰</button>
    </header>

    <!-- MENU MOBILE -->
    <nav id="mobileMenu" class="hidden flex-col bg-blue-950 p-4 gap-4 shadow-md md:hidden">
        <a href="#" class="hover:text-blue-300">Início</a>
        <a href="#" class="hover:text-blue-300">Amigos</a>
        <a href="#" class="hover:text-blue-300">Perfil</a>
    </nav>

    <!-- POSTS -->
    <main id="posts" class="p-4 space-y-6">

        <!-- POST CARD -->
        <div class="bg-gray-800 py-4 rounded-lg shadow-md">

            <!-- CARD HEADER -->
            <div class="flex items-center gap-3 px-4">
                <img src="images/profile_01.jpg" alt="Foto de perfil"
                     class="w-12 h-12 rounded-full">
                <h2 class="font-bold text-lg">FroJho</h2>
            </div>

            <!-- CARD IMAGE -->
            <img src="images/post_01.png" alt="Imagem do post" class="w-full mt-3">

            <!-- CARD CONTENT -->
            <div class="pt-4 px-4 pb-2">
                <p class="text-sm text-justify mb-2">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    Quod beatae quas nihil sed fugit voluptatibus repellat
                    delectus ut tempora debitis est dolorum deserunt
                    blanditiis temporibus dicta iste praesentium atque aliquid!
                </p>
                <span class="opacity-75 text-xs">há 10 minutos</span>
            </div>

        </div>

    </main>

    <script src="./script.js"></script>
<script src="script.js"></script></body>
</html>
