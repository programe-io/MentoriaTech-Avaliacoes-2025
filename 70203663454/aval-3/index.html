<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarFeed - Vendas de Carros</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEcBDTNRwIIfzBtNqFyem13Rkf_0SQJMnPkQ&s" alt="Logo CarFeed" class="logo-image"> 
            <h1>CarFeed</h1>
        </div>
        
        <nav class="main-nav">
            <a href="#">Início</a>
            <a href="#">Buscar</a>
            <a href="#">Favoritos</a>
            <button id="abrir-modal">Adicionar Anúncio</button>
        </nav>
    </header>
    
    <h2 class="section-title">Últimos Anúncios de Carros</h2>
    
    <p class="intro-text">Encontre aqui as melhores ofertas de carros usados e seminovos em todo o Brasil. Clique em "Adicionar Anúncio" para publicar o seu!</p>

    <main class="feed-container">
        </main>

    <div id="modal-anuncio" class="modal">
        <div class="modal-content">
            <span class="fechar-modal">&times;</span>
            <h2>Novo Anúncio de Carro</h2>
            <form id="form-anuncio">
                <input type="text" id="titulo" placeholder="Título (Ex: Ford Ka 2018)" required>
                <input type="text" id="preco" placeholder="Preço (Ex: R$ 35.000)" required>
                <input type="text" id="imagem-url" placeholder="URL da Imagem do Carro" required>
                <textarea id="descricao" placeholder="Descrição e detalhes (Ano, KM, Contato)" required></textarea>
                <button type="submit">Publicar Anúncio</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
