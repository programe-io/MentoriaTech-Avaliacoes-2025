<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Twitter</title>
<style>
  /* Reset básico */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #e6ecf0;
    color: #0f1419;
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar esquerda */
  .sidebar {
    width: 250px;
    background: white;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    padding: 20px;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .sidebar .logo {
    font-size: 28px;
    color: #1DA1F2;
    font-weight: bold;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .sidebar nav a {
    text-decoration: none;
    color: #0f1419;
    font-weight: 600;
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-radius: 25px;
    margin-bottom: 10px;
    transition: background-color 0.2s;
  }

  .sidebar nav a:hover, .sidebar nav a.active {
    background-color: #e8f5fd;
    color: #1DA1F2;
  }

  /* Ícones simples (usando emojis para simplificar) */
  .sidebar nav a span.icon {
    font-size: 20px;
    margin-right: 12px;
  }

  /* Botão Tweet */
  .tweet-btn {
    margin-top: auto;
    background-color: #1DA1F2;
    border: none;
    color: white;
    font-weight: bold;
    padding: 14px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
  }

  .tweet-btn:hover {
    background-color: #0d8ddb;
  }

  /* Conteúdo central */
  .main-content {
    flex: 1;
    max-width: 600px;
    background: white;
    border-left: 1px solid #ddd;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .main-header {
    border-bottom: 1px solid #ddd;
    padding: 15px 20px;
    font-weight: bold;
    font-size: 20px;
  }

  /* Área para criar tweet */
  .tweet-box {
    border-bottom: 1px solid #ddd;
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
  }

  .tweet-box textarea {
    resize: none;
    border: none;
    outline: none;
    font-size: 16px;
    min-height: 80px;
  }

  .tweet-box-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .tweet-box-footer button {
    background-color: #1DA1F2;
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .tweet-box-footer button:disabled {
    background-color: #8ecdf7;
    cursor: not-allowed;
  }

  /* Feed de tweets */
  .feed {
    overflow-y: auto;
    flex: 1;
  }

  .tweet {
    border-bottom: 1px solid #eee;
    padding: 15px 20px;
    display: flex;
    gap: 12px;
  }

  .tweet .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: #ccc;
    flex-shrink: 0;
  }

  .tweet-content {
    flex: 1;
  }

  .tweet-header {
    font-weight: 700;
    color: #0f1419;
  }

  .tweet-handle {
    color: #536471;
    font-weight: 400;
    margin-left: 8px;
  }

  .tweet-text {
    margin-top: 5px;
    font-size: 15px;
    line-height: 1.3;
  }

  /* Painel direito */
  .right-panel {
    width: 300px;
    background: white;
    padding: 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    border-left: 1px solid #ddd;
  }

  .right-panel h3 {
    margin-bottom: 15px;
  }

  .trend {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }

  .trend:hover {
    background-color: #f5f8fa;
  }

  /* Responsividade */
  @media (max-width: 1024px) {
    .right-panel {
      display: none;
    }
    .sidebar {
      display: none;
    }
    .main-content {
      max-width: 100%;
      border-left: none;
      border-right: none;
      height: auto;
      position: relative;
    }
  }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <aside class="sidebar">
    <div class="logo">🐦 MiniTwitter</div>
    <nav>
      <a href="#" class="active"><span class="icon">🏠</span> Início</a>
      <a href="#"><span class="icon">🔍</span> Explorar</a>
      <a href="#"><span class="icon">🔔</span> Notificações</a>
      <a href="#"><span class="icon">✉️</span> Mensagens</a>
      <a href="#"><span class="icon">📋</span> Listas</a>
      <a href="#"><span class="icon">👤</span> Perfil</a>
    </nav>
    <button class="tweet-btn" id="openTweetBox">Tweetar</button>
  </aside>

  <main class="main-content">
    <header class="main-header">Início</header>

    <section class="tweet-box" id="tweetBox" style="display:none;">
      <textarea id="tweetInput" placeholder="O que está acontecendo?" maxlength="280"></textarea>
      <div class="tweet-box-footer">
        <button id="tweetButton" disabled>Tweetar</button>
      </div>
    </section>

    <section class="feed" id="feed">
      <!-- Tweets vão aparecer aqui -->
      <p style="padding:20px; color:#536471;">Nenhum tweet ainda. Seja o primeiro a twittar!</p>
    </section>
  </main>

  <aside class="right-panel">
    <h3>Tendências para você</h3>
    <div class="trend">#Programação</div>
    <div class="trend">#JavaScript</div>
    <div class="trend">#CSS</div>
    <div class="trend">#OpenAI</div>
    <div class="trend">#Futebol</div>
  </aside>

<script>
  const openTweetBoxBtn = document.getElementById('openTweetBox');
  const tweetBox = document.getElementById('tweetBox');
  const tweetInput = document.getElementById('tweetInput');
  const tweetButton = document.getElementById('tweetButton');
  const feed = document.getElementById('feed');

  // Abrir/fechar caixa de tweet
  openTweetBoxBtn.addEventListener('click', () => {
    if(tweetBox.style.display === 'none') {
      tweetBox.style.display = 'flex';
      tweetInput.focus();
    } else {
      tweetBox.style.display = 'none';
      tweetInput.value = '';
      tweetButton.disabled = true;
    }
  });

  // Ativa botão Tweetar se input tiver texto
  tweetInput.addEventListener('input', () => {
    tweetButton.disabled = tweetInput.value.trim().length === 0;
  });

  // Função para criar um tweet no feed
  function createTweet(text) {
    if(feed.querySelector('p')) {
      feed.innerHTML = ''; // limpa mensagem de nenhum tweet
    }

    const tweet = document.createElement('article');
    tweet.classList.add('tweet');

    const avatar = document.createElement('div');
    avatar.classList.add('avatar');
    avatar.textContent = '🐦'; // avatar emoji simples

    const content = document.createElement('div');
    content.classList.add('tweet-content');

    const header = document.createElement('div');
    header.classList.add('tweet-header');
    header.textContent = 'Usuário Exemplo';

    const handle = document.createElement('span');
    handle.classList.add('tweet-handle');
    handle.textContent = '@usuario';

    header.appendChild(handle);

    const tweetText = document.createElement('p');
    tweetText.classList.add('tweet-text');
    tweetText.textContent = text;

    content.appendChild(header);
    content.appendChild(tweetText);

    tweet.appendChild(avatar);
    tweet.appendChild(content);

    feed.insertBefore(tweet, feed.firstChild);
  }

  tweetButton.addEventListener('click', () => {
    const text = tweetInput.value.trim();
    if(text.length === 0) return;
    createTweet(text);
    tweetInput.value = '';
    tweetButton.disabled = true;
    tweetBox.style.display = 'none';
  });
</script>

</body>
</html>

<img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Twitter-logo.svg" alt="Logo Twitter" class="logo-img" />
