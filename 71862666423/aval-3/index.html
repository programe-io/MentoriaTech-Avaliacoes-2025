<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Social</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <h1>MinhaRede</h1>
  </header>

  <!-- Área principal do feed -->
  <main class="feed">

    <!-- Caixa para criar postagem -->
    <section class="new-post">
      <img src="https://via.placeholder.com/50" alt="avatar" class="avatar">
      <input type="text" placeholder="O que você está pensando?" class="post-input">
      <button>Publicar</button>
    </section>

    <!-- Postagem 1 -->
    <article class="post">
      <div class="post-header">
        <img src="https://via.placeholder.com/50" alt="avatar" class="avatar">
        <div>
          <h2>@maria_silva</h2>
          <span>2 horas atrás</span>
        </div>
      </div>

      <p class="post-text">Hoje o dia está lindo! ☀️</p>
      <img src="https://picsum.photos/600/300?random=1" alt="foto da postagem" class="post-image">

      <div class="post-actions">
        <button class="like">❤️ Curtir</button>
        <button class="comment">💬 Comentar</button>
      </div>
    </article>

    <!-- Postagem 2 -->
    <article class="post">
      <div class="post-header">
        <img src="https://via.placeholder.com/50" alt="avatar" class="avatar">
        <div>
          <h2>@joao_oliveira</h2>
          <span>Ontem</span>
        </div>
      </div>

      <p class="post-text">Nova arte digital que acabei de terminar 🎨✨</p>
      <img src="https://picsum.photos/600/300?random=2" alt="foto da postagem" class="post-image">

      <div class="post-actions">
        <button class="like">❤️ Curtir</button>
        <button class="comment">💬 Comentar</button>
      </div>
    </article>

  </main>

</body>
</html>
