<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Rede Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gray-900 min-h-screen text-white flex flex-col">

  <!-- CABEÇALHO FIXO -->
  <header class="bg-gray-800 p-4 flex items-center justify-between shadow-lg fixed w-full top-0 z-10">
    <div class="flex items-center gap-2">
      <h1 class="text-xl font-bold">MySocial :)</h1>

      <button class="relative">
        <svg class="w-6 h-6 text-gray-300 hover:text-blue-400 transition" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span class="absolute top-0 right-0 inline-block w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
    </div>

    <nav class="flex gap-4 text-sm">
      <a href="#" class="hover:text-blue-400 transition">Home</a>
      <a href="#" class="hover:text-blue-400 transition">Perfil</a>
      <a href="#" class="hover:text-blue-400 transition">Amigos</a>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL COM SIDEBAR -->
  <div class="flex flex-1 pt-20 px-4">

    <!-- SIDEBAR -->
    <aside class="hidden md:block w-1/4 pr-4">
      <div class="bg-gray-800 p-4 rounded-lg shadow-md">

        <!-- TAG H3 -->
        <h3 class="text-gray-300 text-sm mb-1">Sugestões personalizadas</h3>

        <h2 class="font-semibold mb-3">Sugestões de Amigos</h2>

        <ul class="space-y-3">
          <li class="flex items-center gap-3">
            <img class="w-10 h-10 rounded-full" src="https://i.pinimg.com/1200x/e0/20/81/e02081c631b127a52e2ee263e15e1b70.jpg" alt="">
            <div>
              <p>Arthur</p>
              <button class="text-xs text-blue-400 hover:underline">Adicionar</button>
            </div>
          </li>

          <li class="flex items-center gap-3">
            <img class="w-10 h-10 rounded-full" src="https://i.pinimg.com/736x/80/b7/68/80b76870df6ee6a3221bd5c3a53aebff.jpg" alt="">
            <div>
              <p>Weverton</p>
              <button class="text-xs text-blue-400 hover:underline">Adicionar</button>
            </div>
          </li>
        </ul>
      </div>
    </aside>

    <!-- FEED -->
    <main class="flex-1 flex flex-col items-center gap-6" id="feed" aria-live="polite">

      <!-- POST 1 (AGORA EM <article>) -->
      <article class="bg-gray-800 max-w-sm w-full rounded-lg shadow-md card" role="article" aria-labelledby="post1-title">
        <div class="flex items-center gap-3 p-4">
          <img class="h-12 w-12 rounded-full"
               src="https://s2-g1.glbimg.com/OeY4aRAHsxrKkRCPLmzd8WrnC7A=/0x0:720x720/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2022/k/k/xnVWWmQ1KtdbMtknG5Pw/whatsapp-image-2022-09-14-at-09.22.55.jpeg"
               alt="">
          <p id="post1-title" class="font-semibold">Arthur do grau</p>
        </div>

        <img class="w-full h-48 object-cover"
             src="https://cdn.agenciamural.org.br/2021/12/no-grau-1024x1024.png"
             alt="">

        <div class="p-4">
          <p class="text-sm">Hoje fui dar um rolê com a galera e quase cai da bike kkkkk</p>
          <span class="text-xs text-gray-400 block text-right mt-2">há 2 min</span>

          <!-- botões -->
          <div class="mt-3 flex items-center gap-4">
            <button class="like-btn">Curtir ❤️</button>
            <button class="text-sm text-gray-400 hover:text-white transition">Comentar</button>
          </div>

          <!-- área de comentário (fake) -->
          <div class="mt-3 bg-gray-700 p-2 rounded">
            <textarea class="w-full bg-gray-800 rounded p-1 text-xs resize-none outline-none"
                      rows="2"
                      placeholder="Escreva um comentário..."></textarea>
            <button class="mt-1 bg-blue-500 px-3 py-1 rounded text-xs hover:bg-blue-600 transition">
              Enviar
            </button>
          </div>
        </div>
      </article>

      <!-- POST 2 (AGORA EM <article>) -->
      <article class="bg-gray-800 max-w-sm w-full rounded-lg shadow-md card" role="article" aria-labelledby="post2-title">
        <div class="flex items-center gap-3 p-4">
          <img class="h-12 w-12 rounded-full"
               src="https://blog.unyleya.edu.br/wp-content/uploads/2017/12/saiba-como-a-educacao-ajuda-voce-a-ser-uma-pessoa-melhor.jpeg"
               alt="">
          <p id="post2-title" class="font-semibold">Luisa</p>
        </div>

        <img class="w-full h-48 object-cover"
             src="https://renata.com.br/images/receitas/680/renata-imagem-receitas-bolo-de-chocolate-simples-e-facil-de-liquidificador-1-xl.webp"
             alt="">

        <div class="p-4">
          <p class="text-sm">Fiz esse bolo mt bom</p>
          <span class="text-xs text-gray-400 block text-right mt-2">há 12 min</span>

          <div class="mt-3 flex items-center gap-4">
            <button class="like-btn">Curtir ❤️</button>
            <button class="text-sm text-gray-400 hover:text-white transition">Comentar</button>
          </div>

          <div class="mt-3 bg-gray-700 p-2 rounded">
            <textarea class="w-full bg-gray-800 rounded p-1 text-xs resize-none outline-none"
                      rows="2"
                      placeholder="Escreva um comentário..."></textarea>
            <button class="mt-1 bg-blue-500 px-3 py-1 rounded text-xs hover:bg-blue-600 transition">
              Enviar
            </button>
          </div>
        </div>
      </article>

    </main>

  </div>

  <footer class="text-center text-gray-400 text-sm mt-10 p-4">
    © 2025 FakeGram
  </footer>

</body>
</html>
