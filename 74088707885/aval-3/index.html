<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Pokémon</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Header com logo e nav -->
    <header>
        <div class="logo">
            <img src="https://via.placeholder.com/100x50.png?text=Logo" alt="Logo Pokémon">
            <h1>Perfil Pokémon</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Pokémons</a></li>
                <li><a href="#">Cards</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <section class="cards-container">
            <!-- Card 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Pikachu" alt="Pikachu">
                <div class="card-content">
                    <h2>Pikachu</h2>
                    <p>Descrição breve do Pikachu. <span>Postado em: 01/12/2025</span></p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Charmander" alt="Charmander">
                <div class="card-content">
                    <h2>Charmander</h2>
                    <p>Descrição breve do Charmander. <span>Postado em: 28/11/2025</span></p>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200.png?text=Bulbasaur" alt="Bulbasaur">
                <div class="card-content">
                    <h2>Bulbasaur</h2>
                    <p>Descrição breve do Bulbasaur. <span>Postado em: 25/11/2025</span></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
