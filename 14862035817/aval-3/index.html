<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Feed</title>

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- HEADER -->
    <header class="navbar">
        <div class="logo">Bruno</div>

        <nav>
            <a href="#">Início</a>
            <a href="#">Amigos</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <!-- POSTS -->
    <main class="container">

        <!-- CARD 1 -->
        <div class="card">
            <div class="user-info">
                <img class="avatar" src="imagens/avatar.webp" alt="avatar">
                <h2>Bruno</h2>
            </div>

            <img class="post-img" src="imagens/post1.jpg" alt="post 1">

            <div class="content">
                <p>Dia ensolarado aproveitando o momento ✨</p>
                <span class="time">há 10 minutos</span>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
            <div class="user-info">
                <img class="avatar" src="imagens/avatar.webp" alt="avatar">
                <h2>Bruno</h2>
            </div>

            <img class="post-img" src="imagens/post2.jpg" alt="post 2">

            <div class="content">
                <p>Observando o espaço sideral e seus mistérios 🌌</p>
                <span class="time">há 25 minutos</span>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
            <div class="user-info">
                <img class="avatar" src="imagens/avatar.webp" alt="avatar">
                <h2>Bruno</h2>
            </div>

            <img class="post-img" src="imagens/post3.jpg" alt="post 3">

            <div class="content">
                <p>Explorando novos horizontes no mundo da programação 💻</p>
                <span class="time">há 1 hora</span>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>

</html>
