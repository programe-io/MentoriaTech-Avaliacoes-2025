<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>

  <!-- Tailwind e Bootstrap -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS externo -->
  <link href="style.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex flex-col md:flex-row items-center justify-between">
    <h1 class="text-3xl font-extrabold uppercase text-center md:text-left">Social Feed</h1>

    <nav class="font-bold flex gap-4 mt-3 md:mt-0">
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="py-8 px-4 flex flex-col gap-6 md:flex-row md:justify-center md:items-start flex-wrap">

    <!-- CARD 1 -->
    <article class="post-card">
      <div class="card-header">
        <img class="avatar" src="https://i.pinimg.com/1200x/1e/69/b9/1e69b958656cba013adc3af8c3e0865b.jpg" alt="Foto de perfil de Clawdeen Wolf">
        <h2 class="user-name">Clawdeen Wolf</h2>
      </div>

      <img class="card-img" src="https://i.pinimg.com/736x/6f/a1/cd/6fa1cd6ff9db5daf00d3c16919007bb0.jpg" alt="Clawdeen na escola">

      <div class="card-content">
        <p>A Clawdeen disse que estou peluda hoje! Adoro minha irmã mais velha 💜</p>
        <span class="time">há 5 minutos</span>
      </div>
    </article>

    <!-- CARD 2 -->
    <article class="post-card">
      <div class="card-header">
        <img class="avatar" src="https://i.pinimg.com/736x/05/79/d9/0579d92e37f7d26f56d5854919df4042.jpg" alt="Foto de perfil de Cleo de Nile">
        <h2 class="user-name">Cleo de Nile</h2>
      </div>

      <img class="card-img" src="https://i.pinimg.com/736x/78/3b/f6/783bf61ac51119d31381b7c9a613cd37.jpg" alt="Cleo em dia de fotos">

      <div class="card-content">
        <p>Dia de fotos 📸</p>
        <span class="time">há 10 minutos</span>
      </div>
    </article>

    <!-- CARD 3 -->
    <article class="post-card">
      <div class="card-header">
        <img class="avatar" src="https://i.pinimg.com/1200x/6a/bf/c9/6abfc99cc9560355b08fa7ba83db0011.jpg" alt="Foto de perfil de Snoopy">
        <h2 class="user-name">Snoopy</h2>
      </div>

      <img class="card-img" src="https://i.pinimg.com/736x/ab/b7/25/abb72542f0d0fccd78e926362fd4fb69.jpg" alt="Snoopy curtindo as férias">

      <div class="card-content">
        <p>Curtindo as férias 😎</p>
        <span class="time">há 20 minutos</span>
      </div>
    </article>

  </main>

</body>
</html>
