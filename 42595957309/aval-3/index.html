<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog com Header</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">
        <header>
            <h1>Meu Blog</h1>
            <nav>
                <a href="#">Início</a>
                <a href="#">Postagens</a>
                <a href="#">Contato</a>
            </nav>
        </header>

        <main>
            <h2>Bem-vindo!</h2>
            <p>Este é o conteúdo principal do blog. Aqui vão as postagens, imagens e muito mais!</p>

            <!-- Imagem com descrição -->
            <div class="imagem-post">
                <img src="https://picsum.photos/800/300" alt="Imagem ilustrativa do blog">
                <p><span class="legenda">Legenda:</span> Uma imagem aleatória para ilustrar o post.</p>
            </div>
        </main>

        <footer>
            <p>© <span id="ano">2025</span> Meu Blog. Todos os direitos reservados.</p>
        </footer>
    </div>

<script src="script.js"></script></body>
</html>
