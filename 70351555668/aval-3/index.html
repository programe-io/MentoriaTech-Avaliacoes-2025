<!DOCTYPE html> <nav> <a>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed - Futebol</title>
    <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>
    <header class="topbar">
        <h1>Social Feed</h1>
        <span class="subtitle">Futebol</span>
    </header>

    <main>
        <div class="container">

            <!-- CABEÇALHO DO POST (avatar pequeno + nome, igual à princesa Tiana) -->
            <header class="profile">
                <div class="profile-user">
                    <img src="jogando" alt="Foto de perfil" class="avatar">
                    <div class="profile-text">
                        <h2 class="profile-user-name"> LUKAS_CARVALHO</h2>
                        <span class="profile-user-sub">RYAN07 • agora</span>
                    </div>
                </div>
            </header>

            <!-- FEED EM ESTILO CARTÃO ALTO -->
            <section class="feed">
                <article class="post">
                    <img class="jogando" FOTO" alt="jogando">
                    <p class="post-caption">
                        Tudo posso naquele que mi fortalece 🙌🏽🙇🏽‍♂️
                    </p>
                    <div class="post-footer">
                        <span>⚽ 245 curtidas</span>
                        <span>💬 12 comentários</span>
                    </div>
                </article>

                <article class="post">
                    <img class="post-image" src= alt="Foto 2 de futebol">
                    <p class="post-caption">
                          Sonhando alto, mas com os pés no chão 🙌🏽🤹🏽‍♂️
                    </p>
                    <div class="post-footer">
                        <span>⚽ 189 curtidas</span>
                        <span>💬 8 comentários</span>
                    </div>
                </article>
            </section>
        </div>
    </main>
</body>
</html>
