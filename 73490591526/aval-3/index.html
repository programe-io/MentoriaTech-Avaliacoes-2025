<!DOCTYPE html>
<html lang="pt-BR">

<link href="style.css" rel="stylesheet"></head>
<body>

                    <span>@maria_silva</span>
                </div>
            </div>

            <div class="botoes">
                <button>Curtir ❤️</button>

            </div>
        </div>

        <!-- Post 2 -->

            </div>
