<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini Rede Social</title>
<style>
  /* Reset básico */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #3b5998;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 10;
  }
  header .logo {
    font-weight: bold;
    font-size: 24px;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
  }
  nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    transition: background-color 0.3s;
  }
  nav ul li a:hover, nav ul li a.active {
    background-color: rgba(255,255,255,0.3);
  }
  main {
    margin: 90px auto 40px;
    max-width: 600px;
    width: 95%;
  }
  /* Login */
  #login {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
  }
  #login input {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  #login button {
    background: #3b5998;
    color: white;
    border: none;
    padding: 12px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
  }
  #login button:hover {
    background: #2d4373;
  }
  /* Feed */
  #feed {
    display: none;
  }
  .post {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 25px;
    overflow: hidden;
  }
  .post-header {
    display: flex;
    align-items: center;
    padding: 12px 15px;
  }
  .post-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 15px;
    object-fit: cover;
    border: 2px solid #3b5998;
  }
  .post-header strong {
    color: #3b5998;
    font-weight: 700;
  }
  .post-image {
    width: 100%;
    height: 300px;
    object-fit: cover;
  }
  .post-content {
    padding: 15px 20px;
    font-size: 16px;
    position: relative;
  }
  .like-btn {
    position: absolute;
    right: 20px;
    bottom: 15px;
    cursor: pointer;
    color: #888;
    user-select: none;
    transition: color 0.3s ease;
  }
  .like-btn.liked {
    color: #e0245e;
    font-weight: bold;
  }
  .like-btn:hover {
    color: #e0245e;
  }
  /* Perfil */
  #profile {
    display: none;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
  }
  #profile img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin-bottom: 20px;
    object-fit: cover;
    border: 3px solid #3b5998;
  }
  #profile h2 {
    color: #3b5998;
    margin-bottom: 10px;
  }
  #profile h3 {
    font-weight: 700;
    margin-bottom: 20px;
  }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header>
  <div class="logo">Mini Rede Social</div>
  <nav>
    <ul>
      <li><a href="#" id="nav-feed">Feed</a></li>
      <li><a href="#" id="nav-profile">Perfil</a></li>
      <li><a href="#" id="nav-logout">Sair</a></li>
    </ul>
  </nav>
</header>

<main>
  <!-- Login -->
  <section id="login">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Digite seu nome" />
    <button onclick="login()">Entrar</button>
  </section>

  <!-- Feed -->
  <section id="feed">
    <h2>Feed</h2>
    <div id="posts"></div>
  </section>

  <!-- Perfil -->
  <section id="profile">
    <h2>Perfil</h2>
    <img id="profile-pic" src="https://i.pravatar.cc/150" alt="Foto do usuário" />
    <h3 id="profile-name"></h3>
    <p>Bem-vindo ao seu perfil!</p>
  </section>
</main>

<script>
  // Posts de exemplo
  const postsData = [
    {
      user: "Ana",
      userPic: "https://i.pravatar.cc/48?img=1",
      image: "https://picsum.photos/id/1011/600/400",
      text: "Curtindo o dia na praia!"
    },
    {
      user: "Carlos",
      userPic: "https://i.pravatar.cc/48?img=2",
      image: "https://picsum.photos/id/1025/600/400",
      text: "Passeio de bicicleta incrível."
    },
    {
      user: "Mariana",
      userPic: "https://i.pravatar.cc/48?img=3",
      image: "https://picsum.photos/id/1043/600/400",
      text: "Lendo um livro maravilhoso."
    }
  ];

  let currentUser = '';

  function login() {
    const usernameInput = document.getElementById('username');
    if (usernameInput.value.trim() === '') {
      alert('Digite seu nome para entrar!');
      return;
    }
    currentUser = usernameInput.value.trim();
    document.getElementById('login').style.display = 'none';
    document.getElementById('feed').style.display = 'block';
    document.getElementById('profile').style.display = 'none';
    document.getElementById('profile-name').textContent = currentUser;
    loadPosts();
    setActiveNav('nav-feed');
  }

  function loadPosts() {
    const postsContainer = document.getElementById('posts');
    postsContainer.innerHTML = '';
    postsData.forEach((post, index) => {
      const postEl = document.createElement('div');
      postEl.classList.add('post');
      postEl.innerHTML = `
        <div class="post-header">
          <img src="${post.userPic}" alt="${post.user}" />
          <strong>${post.user}</strong>
        </div>
        <img class="post-image" src="${post.image}" alt="Post image" />
        <div class="post-content">
          <p>${post.text}</p>
          <span class="like-btn" data-index="${index}">♡ Curtir</span>
        </div>
      `;
      postsContainer.appendChild(postEl);
    });

    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        this.classList.toggle('liked');
        if (this.classList.contains('liked')) {
          this.textContent = '❤️ Curtido';
        } else {
          this.textContent = '♡ Curtir';
        }
      });
    });
  }

  function setActiveNav(id) {
    document.querySelectorAll('nav ul li a').forEach(link => {
      link.classList.remove('active');
    });
    if (id) {
      document.getElementById(id).classList.add('active');
    }
  }

  document.getElementById('nav-feed').addEventListener('click', e => {
    e.preventDefault();
    if (!currentUser) {
      alert('Você precisa fazer login primeiro!');
      return;
    }
    document.getElementById('feed').style.display = 'block';
    document.getElementById('profile').style.display = 'none';
    document.getElementById('login').style.display = 'none';
    setActiveNav('nav-feed');
  });

  document.getElementById('nav-profile').addEventListener('click', e => {
    e.preventDefault();
    if (!currentUser) {
      alert('Você precisa fazer login primeiro!');
      return;
    }
    document.getElementById('feed').style.display = 'none';
    document.getElementById('profile').style.display = 'block';
    document.getElementById('login').style.display = 'none';
    setActiveNav('nav-profile');
  });

  document.getElementById('nav-logout').addEventListener('click', e => {
    e.preventDefault();
    currentUser = '';
    document.getElementById('feed').style.display = 'none';
    document.getElementById('profile').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('username').value = '';
    setActiveNav(null);
  });
</script>

</body>
</html>

  </div>

  <div class="post-content">
    <p>${post.text}</p>

  </div>
`;
