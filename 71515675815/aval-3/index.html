<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loja de Carros</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <div class="container">

    <header>
      <div class="header-inner">
        <h1>Loja de Carros <span class="logo-span">🚗</span></h1>
        <nav>
          <div class="nav-inner">
            <a href="#">Início</a>
            <a href="#">Modelos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
          </div>
        </nav>
      </div>
    </header>

    <main>

      <section class="banner">
        <div class="banner-inner">
          <h2>
            Os melhores carros você encontra aqui  
            <span class="banner-span">Promoções imperdíveis!</span>
          </h2>
        </div>
      </section>

      <section class="car-list">

        <div class="car-list-inner">

          <article class="car-card">
            <div class="card-inner">
              <img src="https://cdn.motor1.com/images/mgl/1x9kNP/s3/ferrari-488-pista.jpg">
              <h3>Carro Esportivo</h3>

              <p class="price">
                <span>R$ 250.000</span>
              </p>

              <button onclick="comprar()">
                Comprar <span class="btn-span">→</span>
              </button>
            </div>
          </article>

          <article class="car-card">
            <div class="card-inner">
              <img src="https://s2-autoesporte.glbimg.com/J5iN24jXqML5SqnJZ7dxfrL5C5c=/0x0:1920x1080/984x0/smart/filters:strip_icc()/2022/05/04/volvo-xc60-recharge-1.jpg">
              <h3>SUV Premium</h3>

              <p class="price">
                <span>R$ 180.000</span>
              </p>

              <button onclick="comprar()">
                Comprar <span class="btn-span">→</span>
              </button>
            </div>
          </article>

          <article class="car-card">
            <div class="card-inner">
              <img src="https://quatrorodas.abril.com.br/wp-content/uploads/2021/08/Fiat-Argo-1.3-AT6-2.jpg">
              <h3>Carro Compacto</h3>

              <p class="price">
                <span>R$ 65.000</span>
              </p>

              <button onclick="comprar()">
                Comprar <span class="btn-span">→</span>
              </button>
            </div>
          </article>

        </div>

      </section>

    </main>

    <footer>
      <div class="footer-inner">
        <p>
          © 2025 Loja de Carros  
          <span class="footer-span">Todos os direitos reservados.</span>
        </p>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
<script src="script.js"></script></body>
</html>
