<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rede Social - Feed</title>
  <link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header class="header">
    <div class="container">
      <h1 class="logo">Minha Rede</h1>
      <nav class="nav">
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Explorar</a></li>
          <li><a href="#">Perfil</a></li>
          <li><a href="#">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container content">
    <main class="main-feed">
      <section class="feed">

        <!-- Post 1 -->
        <article class="post">
          <header class="post-header">
            <img class="avatar" src="https://randomuser.me/api/portraits/women/45.jpg" alt="Maria">
            <div>
              <h2 class="username">Maria Silva</h2>
              <span class="timestamp">2h atrás</span>
            </div>
          </header>
          <p class="post-text">Olha que paisagem linda! 🌄</p>
          <img class="post-img" src="https://source.unsplash.com/600x300/?nature" alt="Paisagem bonita">
          <div class="post-actions">
            <button>❤️ Curtir</button>
            <button>💬 Comentar</button>
            <button>🔁 Compartilhar</button>
          </div>
        </article>

        <!-- Post 2 -->
        <article class="post">
          <header class="post-header">
            <img class="avatar" src="https://randomuser.me/api/portraits/men/30.jpg" alt="João">
            <div>
              <h2 class="username">João Pereira</h2>
              <span class="timestamp">4h atrás</span>
            </div>
          </header>
          <p class="post-text">Café e boa companhia ☕</p>
          <img class="post-img" src="https://source.unsplash.com/600x300/?coffee" alt="Xícara de café">
          <div class="post-actions">
            <button>❤️ Curtir</button>
            <button>💬 Comentar</button>
            <button>🔁 Compartilhar</button>
          </div>
        </article>

      </section>
    </main>

    <aside class="sidebar">
      <h3>Sugestões para você</h3>
      <ul>
        <li><a href="#">@carol_m</a></li>
        <li><a href="#">@felipe.dev</a></li>
        <li><a href="#">@luan.fotos</a></li>
      </ul>
    </aside>
  </div>

  <footer class="footer">
    <p>© 2025 Minha Rede Social</p>
  </footer>

</body>
</html>
