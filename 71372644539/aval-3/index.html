<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Rede Social</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <header>
    <h1>Meu Feed <span>📱</span></h1>
    <nav>
      <ul class="nav-list">
        <li><a href="#">Início</a></li>
        <li><a href="#">Perfil</a></li>
        <li><a href="#">Notificações</a></li>
      </ul>
    </nav>
  </header>

  <main class="feed">

    <!-- Post 1 -->
    <article class="post">
      <div class="user-info">
        <img class="user-photo" src="https://randomuser.me/api/portraits/women/68.jpg" alt="Maria Silva">
        <div>
          <h2 class="user-name">Maria Silva</h2>
          <span class="post-time">2h atrás</span>
        </div>
      </div>
      <p class="post-text">Adorei essa paisagem! 🌄</p>
      <img class="post-image" src="https://source.unsplash.com/600x400/?nature,landscape" alt="Imagem do post">
      <div class="post-actions">
        <button>❤️ Curtir</button>
        <button>💬 Comentar</button>
        <button>🔗 Compartilhar</button>
      </div>
    </article>

    <!-- Post 2 -->
    <article class="post">
      <div class="user-info">
        <img class="user-photo" src="https://randomuser.me/api/portraits/men/45.jpg" alt="João Pereira">
        <div>
          <h2 class="user-name">João Pereira</h2>
          <span class="post-time">4h atrás</span>
        </div>
      </div>
      <p class="post-text">Tomando um café com os amigos ☕</p>
      <img class="post-image" src="https://source.unsplash.com/600x400/?coffee" alt="Imagem do post">
      <div class="post-actions">
        <button>❤️ Curtir</button>
        <button>💬 Comentar</button>
        <button>🔗 Compartilhar</button>
      </div>
    </article>

  </main>

  <footer>
    <p>© 2025 Minha Rede Social</p>
  </footer>

</body>
</html>
