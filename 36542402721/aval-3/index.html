<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Roboto', sans-serif; }
      .header-logo { font-family: 'Playfair Display', serif; }
      .post-title { font-family: 'Playfair Display', serif; font-weight: 600; }
    </style>
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

  <body class="bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 min-h-screen">

    <header class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-lg">
      <div class="flex-1 uppercase font-bold text-center md:text-left header-logo text-2xl">
        AutoGallery
      </div>
      <nav class="space-x-4 text-lg font-semibold md:block hidden">
        <a href="#" class="hover:text-yellow-400 transition">Inicio</a>
        <a href="#" class="hover:text-yellow-400 transition">Amigos</a>
        <a href="#" class="hover:text-yellow-400 transition">Perfil</a>
      </nav>
    </header>

    <main id="card" class="py-6 px-6 max-w-lg mx-auto space-y-10">

      <!-- POST 1 -->
      <div class="rounded-lg overflow-hidden shadow-xl hover:scale-105 transition transform bg-white">
        <div class="flex items-center space-x-4 py-4 px-6 bg-gray-100">
          <img class="h-12 w-12 rounded-full" src="https://th.bing.com/th/id/OIP.0_FFlEm4VnCY3huCissERQHaHa?w=163&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">
          <span class="post-title text-gray-800">Ana</span>
        </div>

        <img src="https://th.bing.com/th/id/OIP.l7tviK4NNQNCm9TNKmNL3gHaEj?w=270&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" class="w-full">

        <div class="p-4 text-gray-700">
          <p class="text-sm leading-relaxed">
            “O clássico esportivo vermelho reflete paixão e velocidade. Cada curva é pura elegância na estrada.”
          </p>
          <span class="text-gray-400 text-xs block pt-2">há 10 minutos</span>
        </div>
      </div>

      <!-- POST 2 -->
      <div class="rounded-lg overflow-hidden shadow-xl hover:scale-105 transition transform bg-white">
        <div class="flex items-center space-x-4 py-4 px-6 bg-gray-100">
          <img class="h-12 w-12 rounded-full" src="https://th.bing.com/th/id/OIP.0_FFlEm4VnCY3huCissERQHaHa?w=163&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">
          <span class="post-title text-gray-800">Ana</span>
        </div>

        <img src="https://tse1.mm.bing.net/th/id/OIP.DpAK-OlhXup87Gxab0GTQwHaE_?rs=1&pid=ImgDetMain&o=7&rm=3" class="w-full">

        <div class="p-4 text-gray-700">
          <p class="text-sm leading-relaxed">
            “O sedã elegante azul transmite conforto e tecnologia. Perfeito para quem aprecia luxo com performance.”
          </p>
          <span class="text-gray-400 text-xs block pt-2">há 5 minutos</span>
        </div>
      </div>
      <h2> </h2>
    </main>
  </body>
</html>
