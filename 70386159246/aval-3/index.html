<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <title><span>Laysa Brigadeiros</span></title>
    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            background: #fff8f0;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background: #d35400;
            padding: 15px 30px;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        main {
            padding: 20px 30px;
        }

        .chamada-texto h1 {
            margin-bottom: 0.2em;
        }

        .categoria-videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .categoria-videos a img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 8px rgb(0 0 0 / 0.15);
        }

        .categoria-videos a img:hover {
            transform: scale(1.05);
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body>

    <header>
        <span>Laysa Brigadeiros</span>
        <nav>
            <ul>
                <li><a href="#"><span>Início</span></a></li>
                <li><a href="#brigadeiros"><span>Brigadeiros</span></a></li>
                <li><a href="#series"><span>Séries</span></a></li>
                <li><a href="#contato"><span>Contato</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="chamada">
            <div class="chamada-texto">
                <h1><span>BRIGADEIROS DELICIOSOS</span></h1>
                <p><span>#Receitas de Brigadeiro</span></p>
            </div>

            <div>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/BuH0k9FJO_E"
                    title="Receita de Brigadeiro Tradicional" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>

        <section class="categoria" id="brigadeiros">
            <h2><span>Receitas e Imagens de Brigadeiros</span></h2>
            <div class="categoria-videos">
                <!-- Imagens fixas -->
                <a href="https://www.receiteria.com.br/wp-content/uploads/brigadeiro-cremoso.jpg" target="_blank"
                    title="Brigadeiro Cremoso">
                    <img src="https://www.receiteria.com.br/wp-content/uploads/brigadeiro-cremoso.jpg" alt="Brigadeiro Cremoso" />
                </a>
                <a href="https://www.tudogostoso.com.br/images/recipes/54/5477/foto-principal.jpg" target="_blank"
                    title="Brigadeiro Tradicional">
                    <img src="https://www.tudogostoso.com.br/images/recipes/54/5477/foto-principal.jpg" alt="Brigadeiro Tradicional" />
                </a>
                <a href="https://www.panelinha.com.br/wp-content/uploads/2020/03/brigadeiro-de-pote-4.jpg" target="_blank"
                    title="Brigadeiro de Pote">
                    <img src="https://www.panelinha.com.br/wp-content/uploads/2020/03/brigadeiro-de-pote-4.jpg" alt="Brigadeiro de Pote" />
                </a>

                <!-- Vídeos com thumbnails do YouTube -->
                <a href="https://youtu.be/H5oxGvRqdts" target="_blank" title="Receita Brigadeiro 1">
                    <img src="https://img.youtube.com/vi/H5oxGvRqdts/hqdefault.jpg" alt="Vídeo Receita Brigadeiro 1" />
                </a>
                <a href="https://youtu.be/0EN8o292Lg4" target="_blank" title="Receita Brigadeiro 2">
                    <img src="https://img.youtube.com/vi/0EN8o292Lg4/hqdefault.jpg" alt="Vídeo Receita Brigadeiro 2" />
                </a>
                <a href="https://youtu.be/wxeYBd4xo9M" target="_blank" title="Receita Brigadeiro 3">
                    <img src="https://img.youtube.com/vi/wxeYBd4xo9M/hqdefault.jpg" alt="Vídeo Receita Brigadeiro 3" />
                </a>
                <a href="https://youtu.be/Is1ON-2gzuQ" target="_blank" title="Receita Brigadeiro 5">
                    <img src="https://img.youtube.com/vi/Is1ON-2gzuQ/hqdefault.jpg" alt="Vídeo Receita Brigadeiro 5" />
                </a>
            </div>
        </section>
    </main>

</body>

</html>
