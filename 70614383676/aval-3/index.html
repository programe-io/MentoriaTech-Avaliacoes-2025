<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Tech - Feed de Vendas</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="cabecalho">
        <h1>PC Tech 🚀</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Ofertas</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main class="feed">
        <h2>Feed de Produtos e Ofertas de Computadores</h2> 

        <div id="posts-container">
            <article class="post">
                <div class="post-header">
                    <img src="avatar-vendedor.jpg" alt="Vendedor" class="avatar">
                    <span class="nome-vendedor">@TechVendasOficial</span>
                </div>
                <img src="notebook-gamer.jpg" alt="Notebook Gamer" class="post-image">
                <div class="post-actions">
                    <button class="btn-like">❤️ 0</button>
                    <button class="btn-comprar">🛒 Comprar (R$ 4.500)</button>
                </div>
                <p class="post-descricao">
                    **SUPER OFERTA!** Notebook Gamer com RTX 4060, 16GB RAM e SSD NVMe de 1TB. Desempenho imbatível para qualquer jogo.
                    <span class="hashtag">#NotebookGamer</span> <span class="hashtag">#RTX4060</span>
                </p>
            </article>
        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
