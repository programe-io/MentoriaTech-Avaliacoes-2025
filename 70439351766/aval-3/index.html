<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComidaJá — Delivery & Takeaway</title>
  <link rel="stylesheet" href="styles.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="https://via.placeholder.com/52x52.png?text=CJ" alt="Logo ComidaJá" class="logo-img" />
        <div class="brand-text">
          <h1><span class="brand-name">ComidaJá</span></h1>
          <span class="tagline">Entrega rápida — qualidade top</span>
        </div>
      </div>


      <nav>
        <ul>
          <li><a href="#"><span>Início</span></a></li>
          <li><a href="#"><span>Cardápio</span></a></li>
          <li><a href="#"><span>Contato</span></a></li>
        </ul>
      </nav>
    </header>


    <section class="hero">
      <img src="https://via.placeholder.com/800x250.png?text=Comidas+Deliciosas" alt="Comidas" class="hero-img">
      <h2><span>Peça comida boa e receba rápido!</span></h2>
      <p><span>Escolha seus pratos favoritos e aproveite ofertas exclusivas.</span></p>
    </section>


    <main class="produtos" aria-label="Lista de produtos">
      <div class="produto" role="article">
        <img src="https://via.placeholder.com/200x150.png?text=Pizza" alt="Pizza">
        <h3><span class="prod-name">Pizza Margherita</span></h3>
        <p><span class="price">R$ <span class="price-value">28,00</span></span></p>
        <button><span>Comprar</span></button>
      </div>


      <div class="produto" role="article">
        <img src="https://via.placeholder.com/200x150.png?text=Burger" alt="Hambúrguer">
        <h3><span class="prod-name">Cheese Burger</span></h3>
        <p><span class="price">R$ <span class="price-value">22,50</span></span></p>
        <button><span>Comprar</span></button>
      </div>


      <div class="produto" role="article">
        <img src="https://via.placeholder.com/200x150.png?text=Sushi" alt="Sushi">
        <h3><span class="prod-name">Combo Sushi</span></h3>
        <p><span class="price">R$ <span class="price-value">35,00</span></span></p>
        <button><span>Comprar</span></button>
      </div>
    </main>


    <footer>
      <p><span>© 2025 ComidaJá — Feito com ❤️ no Brasil</span></p>
    </footer>
  </div>
</body>
</html>
