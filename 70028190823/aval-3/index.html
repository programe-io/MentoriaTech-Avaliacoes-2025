<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Feed de Redes Sociais</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">MeuFeed</div>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Perfil</a></li>
                <li><a href="#">Notificações</a></li>
            </ul>
        </nav>
        
        <h2 class="feed-heading">Últimas Atualizações</h2>
    </header>

    <main class="feed-container">
        <div id="posts-list">
            <div class="post">
                <div class="post-header">
                    <img src="https://via.placeholder.com/40" alt="Foto de Perfil do Usuário" class="profile-img">
                    <div class="user-info">
                        <span class="username">@UsuarioExemplo1</span>
                        <span class="timestamp">1h atrás</span>
                    </div>
                </div>
                <div class="post-content">
                    <p>Olá! Este é o meu primeiro post no feed. 🚀 Agora com uma imagem de perfil!</p>
                </div>
                <div class="post-footer">
                    <button class="like-btn">Curtir (0)</button>
                </div>
            </div>
        </div>
        
        <button id="add-post-btn">Adicionar Novo Post</button>
    </main>

    <footer class="footer">
        Desenvolvedor: **Jessica Mendes**
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
