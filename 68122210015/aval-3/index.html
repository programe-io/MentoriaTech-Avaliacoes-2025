<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social feed</title>
    <link href="output.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

  <body>

    <header>
      <div><span class="logo">logo</span></div>
      <nav>
        <a href=""><span>Início</span></a>
        <a href=""><span>Amigos</span></a>
        <a href=""><span>Perfil</span></a>
      </nav>
    </header>

    <main>
      <!-- POST CARD -->
      <div class="post-card">

        <!-- CARD HEADER -->
        <div class="card-header">
          <img src="images/profile_01.jpg" alt="Foto de perfil">
          <h2><span class="nome-usuario">FroJhe</span></h2>
        </div>

        <!-- CARD IMAGE -->
        <img src="images/profile_01.jpg" alt="Imagem do post">

        <!-- CARD CONTENT -->
        <div class="card-content">
          <p>
            Este é um exemplo de conteúdo do post. 
            <span class="destaque">Confira as novidades!</span> 
            Aqui você pode escrever algo interessante, compartilhar uma ideia ou comentar sobre a imagem acima.
          </p>
        </div>

      </div>
    </main>
