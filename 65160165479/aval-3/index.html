<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWorld - Seu Mundo de Filmes</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>CineWorld 🎬</h1>

        <!-- Navegação principal -->
        <nav>
            <ul class="menu">
                <li><a href="#">Início</a></li>
                <li><a href="#">Lançamentos</a></li>
                <li><a href="#">Populares</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>

        <input type="text" id="search" placeholder="Buscar filme...">
    </header>

    <main id="movie-container">
        <!-- Filmes serão carregados via JavaScript -->
    </main>

    <!-- Modal de detalhes -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <img id="modal-poster" src="" alt="Poster do Filme">
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-year"></p>
                <p id="modal-description"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 CineWorld | Feito com ❤️ por [Seu Nome]</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
