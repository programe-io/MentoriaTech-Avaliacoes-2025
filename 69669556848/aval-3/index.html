<html lang="pt-BR">

<head>

    <title>Meu Site Completo</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Bem-vindo ao Meu Site</h1>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção Home -->
    <section id="home" class="section">
        <h2>Página Inicial</h2>
        <p>Este é um site de exemplo totalmente feito com HTML, CSS e JavaScript separados.</p>
        <button onclick="mostrarMensagem()">Clique Aqui</button>
    </section>

    <!-- Seção Sobre -->
    <section id="sobre" class="section">
        <h2>Sobre</h2>
        <p>Este site demonstra como organizar arquivos e criar uma estrutura completa.</p>
    </section>

    <!-- Seção Contato -->
    <section id="contato" class="section">
        <h2>Contato</h2>
        <form onsubmit="enviarFormulario(event)">
            <input type="text" id="nome" placeholder="Seu nome" required>
            <input type="email" id="email" placeholder="Seu e-mail" required>
            <textarea id="mensagem" placeholder="Sua mensagem" required></textarea>
            <button type="submit">Enviar</button>
        </form>

        <p id="status"></p>
    </section>

    <footer>
        <p>© 2025 - Meu Site Completo</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
