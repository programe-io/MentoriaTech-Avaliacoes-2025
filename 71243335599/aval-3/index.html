<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Site One-line</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;min-height:100vh;background:linear-gradient(135deg,#a1c4fd,#c2e9fb)}header,footer{background:#3498db;color:#fff;padding:1rem;text-align:center}nav{margin-top:.5rem}nav a{color:#fff;margin:0 .5rem;text-decoration:none}main{flex:1;display:flex;gap:1rem;padding:1rem}article,aside{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}button{padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#3498db;color:#fff}img.logo{height:40px;vertical-align:middle;margin-right:.5rem}img.article-img{width:100%;border-radius:6px;margin-bottom:.5rem}span.highlight{color:#e74c3c;font-weight:bold}</style><script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head><body><header><img class="logo" src="https://via.placeholder.com/80x40?text=Logo" alt="Logo"><h1 style="display:inline">Meu Site</h1><nav><a href="#">Início</a><a href="#">Sobre</a><a href="#">Contato</a></nav></header><main><div style="display:flex;gap:1rem;width:100%"><article><img class="article-img" src="https://via.placeholder.com/400x200?text=Imagem+do+Artigo" alt="Imagem do Artigo"><h2>Bem-vindo</h2><p>Este é um <span class="highlight">texto destacado</span> dentro do artigo com <strong>ênfase forte</strong> e <em>itálico</em>.</p><button id="btn">Clique aqui</button></article><aside><h3>Sidebar</h3><p>Informações adicionais.</p></aside></div></main><footer><p>© 2025 Meu Site</p></footer><script>document.getElementById('btn').onclick=function(){alert('Você clicou!');const p=document.createElement('p');p.innerHTML='Parágrafo adicionado dinamicamente em <span style="color:#e74c3c">'+new Date().toLocaleString()+'</span>';document.querySelector('article').appendChild(p);};</script><script src="script.js"></script></body></html>
