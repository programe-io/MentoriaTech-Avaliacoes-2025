<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Página Gamer com Header, Nav e Span</title>
                <link rel="stylesheet" href="style.css">
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

                                                        <div class="header-text">

                                                                                                            </div>

                                                                                                                    <div class="header-right">

                                                                                                                                                            <!-- NAV -->
                                                                                                                                                                <nav class="nav-gamer">
                                                                                                                                                                        <ul>
                                                                                                                                                                                    <li><a href="#"><span class="nav-span">Home</span></a></li>
                                                                                                                                                                                                <li><a href="#"><span class="nav-span">Produtos</span></a></li>
                                                                                                                                                                                                            <li><a href="#"><span class="nav-span">Reviews</span></a></li>
                                                                                                                                                                                                                        <li><a href="#"><span class="nav-span">Contato</span></a></li>
                                                                                                                                                                                                                                </ul>
                                                                                                                                                                                                                                    </nav>

                                                                                                                                                                                                                                        <!-- MAIN -->
                                                                                                                                                                                                                                            <main>
                                                                                                                                                                                                                                                    <h2>Bem-vindo(a) à página gamer!</h2>
                                                                                                                                                                                                                                                            <p>Aqui você encontra tudo sobre PCs, hardware e lançamentos.</p>
