<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigadeiros da Chef - Feed Gourmet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header class="header">
        <h1>Brigadeiros da Chef 👩‍🍳</h1>
        <nav>
            <a href="#">Catálogo</a>
            <a href="#">Minha Cesta</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main class="container">
        <img 
            src="https://via.placeholder.com/900x150/5d4037/ffb74d?text=Bem+Vindo+ao+Mundo+do+Brigadeiro+Gourmet" 
            alt="Banner de Destaque Brigadeiros" 
            class="banner-image"
        >

        <p class="introduction-text">
            Explore nossa seleção de brigadeiros gourmet artesanais, feitos com os melhores ingredientes. Deixe seu dia mais <span class="highlight">doce e delicioso</span>!
        </p>

        <div class="content-wrapper"> 
            
            <section class="new-post-section">
                <h2>Cadastrar Novo Sabor de Brigadeiro</h2>
                <form id="new-post-form">
                    <input type="text" id="post-title" placeholder="Nome do Sabor (Ex: Limão Siciliano)" required>
                    <textarea id="post-description" placeholder="Ingredientes e Diferenciais..." required></textarea>
                    <input type="text" id="post-price" placeholder="Preço (Ex: R$ 5,50/unid.)" required>
                    <input type="url" id="post-image-url" placeholder="URL da Foto do Brigadeiro">
                    <button type="submit">Publicar Sabor Gourmet 🤤</button>
                </form>
            </section>
            
            <section id="feed-container" class="feed-container">
                </section>

        </div> 
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
