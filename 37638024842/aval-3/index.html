<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz Gamer — Mobile ↔ Desktop</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

  <body class="bg-slate-50 text-slate-900 antialiased">

    <header class="fixed inset-x-0 top-0 z-30 bg-white/75 backdrop-blur-sm border-b border-slate-200">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-lg font-semibold">Quiz Gamer — Mobile ↔ Desktop</h1>
        <nav class="text-sm space-x-3">
          <a href="#gta" class="hover:underline">GTA</a>
          <a href="#mc" class="hover:underline">Minecraft</a>
          <a href="#cod" class="hover:underline">COD</a>
        </nav>
      </div>
    </header>

    <main class="pt-16 max-w-7xl mx-auto p-4 snap-container overflow-auto lg:grid lg:grid-cols-3 lg:gap-6 lg:items-start">

      <!-- PAGE 1 -->
      <article id="gta" class="page rounded-2xl shadow-lg bg-gradient-to-br from-emerald-100 to-emerald-50 p-6 border border-slate-200">
        <h2 class="text-2xl font-bold mb-2">Quiz — 1</h2>
        <p class="text-sm text-slate-600 mb-4">Toque na resposta correta.</p>
        <img src="https://img.freepik.com/fotos-gratis/ilustracao-do-havai-em-estilo-comico-retro_23-2151771074.jpg?semt=ais_incoming&w=740&q=80" class="w-full h-48 rounded-md object-cover shadow mb-4" alt="GTA"/>
        <p class="font-semibold mb-2">Qual é este jogo?</p>
        <div class="grid gap-3">
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">GTA V</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Watch Dogs</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Saints Row</button>
        </div>
      </article>

      <!-- PAGE 2 -->
      <article id="mc" class="page rounded-2xl shadow-lg bg-gradient-to-br from-amber-50 to-amber-100 p-6 border border-slate-200">
        <h2 class="text-2xl font-bold mb-2">Quiz — 2</h2>
        <p class="text-sm text-slate-600 mb-4">Identifique pelo visual.</p>
        <img src="https://wallpapers.com/images/hd/minecraft-pictures-1maoitj1is1v6uqf.jpg" class="w-full h-48 rounded-md object-cover shadow mb-4" alt="Minecraft"/>
        <p class="font-semibold mb-2">Qual é este jogo?</p>
        <div class="grid gap-3">
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Roblox</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Minecraft</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Terraria</button>
        </div>
      </article>

      <!-- PAGE 3 -->
      <article id="cod" class="page rounded-2xl shadow-lg bg-gradient-to-br from-sky-50 to-sky-100 p-6 border border-slate-200">
        <h2 class="text-2xl font-bold mb-2">Quiz — 3</h2>
        <p class="text-sm text-slate-600 mb-4">Escolha a opção correta.</p>
        <img src="https://f.i.uol.com.br/fotografia/2022/10/24/16666338126356d0549b67c_1666633812_3x2_rt.jpg" class="w-full h-48 rounded-md object-cover shadow mb-4" alt="Call of Duty"/>
        <p class="font-semibold mb-2">Qual é este jogo?</p>
        <div class="grid gap-3">
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Battlefield</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Halo</button>
          <button class="answer-btn bg-white border border-slate-200 py-2 rounded-xl text-left">Call of Duty</button>
        </div>
      </article>

    </main>

    <footer class="fixed inset-x-0 bottom-0 z-40 bg-white/90 backdrop-blur-sm border-t border-slate-200 lg:hidden">
      <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
        <div class="text-sm text-slate-600">Quiz Gamer • Mobile view</div>
        <div class="flex gap-2">
          <button id="prev" class="px-3 py-1 rounded bg-slate-100">◀</button>
          <button id="next" class="px-3 py-1 rounded bg-slate-800 text-white">▶</button>
        </div>
      </div>
    </footer>

    <script>
      (function(){
        const pages = Array.from(document.querySelectorAll('.page'));
        let idx = 0;

        function scrollToIndex(i){
          if(i < 0) i = 0;
          if(i >= pages.length) i = pages.length -1;
          idx = i;
          pages[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        const btnNext = document.getElementById('next');
        const btnPrev = document.getElementById('prev');
        if(btnNext) btnNext.addEventListener('click', ()=> scrollToIndex(idx+1));
        if(btnPrev) btnPrev.addEventListener('click', ()=> scrollToIndex(idx-1));

        document.querySelectorAll('.answer-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const siblings = btn.parentElement.querySelectorAll('button');
            siblings.forEach(s=> s.classList.remove('bg-emerald-100','border-emerald-400','text-emerald-900'));
            btn.classList.add('bg-emerald-100','border-emerald-400','text-emerald-900');
          })
        });

        window.addEventListener('resize', ()=>{
          if(window.innerWidth < 1024){ scrollToIndex(idx); }
        });

      })();
    </script>

  </body>
</html>
<h2 class="text-2xl font-bold mb-2">Quiz — <span class="text-emerald-700">1</span></h2>
