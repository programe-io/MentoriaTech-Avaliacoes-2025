<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do LH</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        /* Header */
        header {
            background: #222;
            color: #fff;
            padding: 25px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
        }

        /* NAV */
        nav {
            background: #333;
            padding: 12px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            padding: 8px 15px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background: #444;
        }

        /* Conteúdo */
        main {
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 25px;
            max-width: 850px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.12);
            text-align: center;
        }

        /* Imagem */
        .card img {
            width: 100%;
            max-width: 420px;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* Destaque com <span> */
        .destaque {
            color: #0077ff;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 35px;
        }

    </style>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        Site do LH
    </header>

    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Galeria</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>

    <main>
        <div class="card">
            <h2>Bem-vindo ao <span class="destaque">Site do LH</span>!</h2>
            <p>
                Aqui você encontra um exemplo completo usando as tags 
                <span class="destaque">&lt;nav&gt;</span>, 
                <span class="destaque">&lt;img&gt;</span> e 
                <span class="destaque">&lt;span&gt;</span>.
            </p>

            <!-- Substitua pela sua imagem -->
            <img src="imagens/foto.jpg" alt="Imagem do Site do LH">
        </div>
    </main>

    <footer>
        © 2025 — Site do LH
    </footer>

</body>
</html>
