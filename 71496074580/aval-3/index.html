<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Feed</title>

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

  <body class="bg-gradient-to-b from-blue-900 to-blue-950 h-screen text-white">

    <!-- HEADER -->
    <header class="shadow-md p-5 flex justify-between items-center">
      <!-- LOGO -->
      <h1 class="text-2xl font-bold tracking-wide">
        <span>LOGO</span> <!-- tag obrigatória span -->
      </h1>

      <!-- NAV OBRIGATÓRIA -->
      <nav class="flex gap-6 text-lg">
        <a href="#" class="hover:text-blue-400 transition"><span>Início</span></a>
        <a href="#" class="hover:text-blue-400 transition"><span>Perfil</span></a>
        <a href="#" class="hover:text-blue-400 transition"><span>Configurações</span></a>
      </nav>
    </header>

    <!-- POST LISTS -->
    <main class="py-4 px-2 space-y-6">

      <!-- POST CARD -->
      <div class="post-card max-w-lg mx-auto">
        <!-- CARD HEADER -->
        <div class="card-header">
          <img class="profile-img" src="images/profile_01.jpg" alt="Foto de perfil" />
          <h2 class="username">
            <span>FroJho</span> <!-- tag span para o nome -->
          </h2>
        </div>

        <!-- CARD IMAGE -->
        <div class="px-4">
          <img class="rounded-lg" src="images/post_image.jpg" alt="Imagem do post" />
        </div>

        <!-- CARD TEXT -->
        <div class="px-4 pt-4 text-gray-300">
          <p>
            <span>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod beatae quas nihil sed fugiat,
              repellat delectus ut tempora debitis deserunt.
            </span>
          </p>
        </div>
      </div>

      <!-- OUTRO POST CARD -->
      <div class="post-card max-w-lg mx-auto">
        <div class="card-header">
          <img class="profile-img" src="images/profile_02.jpg" alt="Foto de perfil" />
          <h2 class="username">
            <span>Jane Doe</span>
          </h2>
        </div>

        <div class="px-4">
          <img class="rounded-lg" src="images/post_image_02.jpg" alt="Imagem do post" />
        </div>

        <div class="px-4 pt-4 text-gray-300">
          <p>
            <span>Esse é outro post de exemplo para o feed social com Tailwind CSS.</span>
          </p>
        </div>
      </div>

    </main>

    <!-- Script -->
    <script src="js/script.js"></script>
  <script src="script.js"></script></body>
</html>
