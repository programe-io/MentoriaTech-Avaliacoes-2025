<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Feed</title>
  <link href="style.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg">

  <!-- HEADER -->
  <header class="topo">
    <div class="logo">LOGO</div>

    <nav class="menu">
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <!-- FEED -->
  <main class="feed">

    <!-- POST 1 -->
    <div class="post">
      <div class="post-header">
        <img src="https://i.pravatar.cc/150?img=12" class="avatar">
        <span class="username">João Gabriel</span>
      </div>

      <h2>Momento especial</h2>
      <p class="post-text">Visitando um lugar incrível hoje! 🌄</p>

      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" class="post-img">

      <div class="actions">
        <button>👍 Curtir</button>
        <button>💬 Comentar</button>
      </div>
    </div>

    <!-- POST 2 -->
    <div class="post">
      <div class="post-header">
        <img src="https://i.pravatar.cc/150?img=12" class="avatar">

      </div>

      <h2>Muito bom comer</h2>
      <p class="post-text">Comida boa é tudo! 😋</p>

      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" class="post-img">

      <div class="actions">

        <button>💬 Comentar</button>

    </div>

    <!-- POST 3 -->

      </div>
    </div>

  </main>

</html>
