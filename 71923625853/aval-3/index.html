<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>InstaLite — Feed</title>
        <link rel="stylesheet" href="styles.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
        <body>
          <header>
              <div class="header-inner">
                    <h1>InstaLite</h1>
                          <nav>
                                  <a href="#" id="homeLink">Home</a>
                                          <a href="#" id="profileLink">Perfil</a>
                                                  <a href="#" id="aboutLink">Sobre</a>
                                                        </nav>
                                                              <div class="user-area">
                                                                      <span class="user-name">gilderlan Santana</span>
                                                                            </div>
                                                                                </div>
                                                                                  </header>

                                                                                    <main>
                                                                                        <section class="top-area">
                                                                                              <h2>Feed estilo Instagram</h2>
                                                                                                    <h3>Upload local de imagens</h3>
                                                                                                          <p>Use o botão <strong>+</strong> no canto inferior direito para escolher imagens. As imagens ficam no seu navegador.</p>
                                                                                                              </section>

                                                                                                                  <section class="container">
                                                                                                                        <aside class="sidebar">
                                                                                                                                <h3>Stories</h3>
                                                                                                                                        <div class="stories" id="stories">
                                                                                                                                                  <div class="story"><img src="" alt="Você" class="story-img placeholder"><span>Você</span></div>
                                                                                                                                                            <div class="story"><img src="" alt="Ana" class="story-img placeholder"><span>Ana</span></div>
                                                                                                                                                                      <div class="story"><img src="" alt="Lupe" class="story-img placeholder"><span>Lupe</span></div>
                                                                                                                                                                              </div>

                                                                                                                                                                                      <div class="uploader-preview" id="uploaderPreview">
                                                                                                                                                                                                <p>Pré-visualização:</p>
                                                                                                                                                                                                          <div id="previewImages" class="preview-images"></div>
                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                        </aside>

                                                                                                                                                                                                                              <main class="feed" id="feed" aria-live="polite">
                                                                                                                                                                                                                                      <!-- Posts inseridos pelo script -->
                                                                                                                                                                                                                                            </main>
                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                    <!-- botão flutuante + input oculto -->
                                                                                                                                                                                                                                                      <button class="fab" id="openUpload" title="Criar post">+</button>
                                                                                                                                                                                                                                                        <input id="fileInput" type="file" accept="image/*" multiple style="display:none" />

                                                                                                                                                                                                                                                          <footer>
                                                                                                                                                                                                                                                              <p>Projeto demo — InstaLite</p>
                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                  <script src="script.js"></script>
                                                                                                                                                                                                                                                                  <script src="script.js"></script></body>
                                                                                                                                                                                                                                                                  </html>
