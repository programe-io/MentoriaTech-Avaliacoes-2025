<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Brasil</title>
    <link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <div class="logo-nav">
            <img src="netflix-logo.png" alt="Logo da Netflix" class="logo">
            
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Séries</a></li>
                    <li><a href="#">Filmes</a></li>
                    <li><a href="#">Minha Lista</a></li>
                </ul>
            </nav>
        </div>
        
        <div class="perfil">
            <img src="perfil-avatar.png" alt="Ícone do perfil" class="avatar">
        </div>
    </header>

    <main>

        <aside>
            <h3>Filtrar por Gênero</h3>
            <ul>
                <li>Ação</li>
                <li>Comédia</li>
                <li>Drama</li>
                <li>Terror</li>
                <li>Documentários</li>
            </ul>
        </aside>

        <section class="catalogo">
            
            <h1>Séries e Filmes</h1>
            
            <div class="linha-categoria">
                <h2>Populares Agora</h2>
                
                <div class="itens-carrossel">
                    
                    <article class="item-catalogo">
                        <img src="poster-filme1.jpg" alt="Pôster do Filme 1">
                        <h3>Título do Filme 1</h3>
                    </article>

                    <article class="item-catalogo">
                        <img src="poster-serie1.jpg" alt="Pôster da Série 1">
                        <h3>Título da Série 1</h3>
                    </article>

                    <article class="item-catalogo">
                        <img src="poster-filme2.jpg" alt="Pôster do Filme 2">
                        <h3>Título do Filme 2</h3>
                    </article>
                </div>
            </div>

            <div class="linha-categoria">
                <h2>Séries de Drama</h2>
                <div class="itens-carrossel">
                    </div>
            </div>

        </section>
    </main>

    <footer>
        <p>Copyright 2025 Netflix</p>
    </footer>

</body>
</html>
