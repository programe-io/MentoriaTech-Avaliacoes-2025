<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link href="./output.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex items-center">
    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
      LOGO
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>
      <a href="#" class="hover:text-blue-400">Amigos</a>
      <a href="#" class="hover:text-blue-400">Perfil</a>
    </nav>
  </header>

  <!-- POSTS -->
  <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://abcdoabc.com.br/wp-content/uploads/Henrique-e-Juliano-1_cba78172.jpg" alt="">
        <h2 class="text-lg font-semibold">H&J</h2>
      </div>
      <!-- CARD IMAGE -->
      <img class="w-full h-48 object-cover" src="https://bhdetalhes.com/wp-content/uploads/2025/07/henrique-juliano-belo-horizonte-2.jpg" alt="">
      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
          5KM
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://veja.abril.com.br/wp-content/uploads/2019/10/luan-santana-2019-1_l7i2385.jpg-v.jpg?crop=1&resize=1212,909" alt="">
        <h2 class="text-lg font-semibold">LS</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://akamai.sscdn.co/uploadfile/letras/fotos/6/e/4/9/6e491e984b0c1185f4f80ba2102533eb.jpg" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          MULHER SEGURA
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="https://conteudo.imguol.com.br/c/esporte/52/2025/08/02/jorge-carrascal-novo-reforco-do-flamengo-1754180143997_v2_3x4.jpg"t="">
        <h2 class="text-lg font-semibold">CRF</h2>
      </div>
      <img class="w-full h-48 object-cover" src="https://i0.wp.com/moonbh.com.br/wp-content/uploads/2025/06/Arrascaeta-Flamengo.webp?fit=950%2C594&ssl=1" alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          CRACK 
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

  </main>

</body>
</html>
