<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Site com Imagens</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="container">
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <div class="container">
            <!-- Artigo -->
            <article>
                <h1>Bem-vindo ao nosso site!</h1>
                <img src="https://via.placeholder.com/800x400" alt="Imagem de exemplo" class="img-principal">
                <p>Este é um exemplo de site com HTML, CSS e JavaScript.</p>
                <button id="alertBtn">Clique aqui para uma mensagem</button>
            </article>
        </div>

        <div class="container">
            <!-- Seção Sobre -->
            <section id="sobre">
                <h2>Sobre</h2>
                <img src="https://via.placeholder.com/600x300" alt="Imagem sobre" class="img-sobre">
                <p>Aqui você encontra informações sobre o nosso projeto. <span>Este é um exemplo de site com algumas funcionalidades!</span></p>
            </section>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Exemplo de Site. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
