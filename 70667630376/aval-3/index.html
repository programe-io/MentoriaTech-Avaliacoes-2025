<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce de Chuteiras - Chuteira Power</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Estilos personalizados para a cor principal (Verde Limão - inspirado em chuteiras de velocidade) */
        .color-primary {
            background-color: #a3e635; /* Lime 400 */
        }
        .text-primary {
            color: #65a30d; /* Lime 600 */
        }
        .hover\:bg-primary:hover {
            background-color: #65a30d;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gray-50 font-sans">

<div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <header class="bg-white shadow-xl rounded-2xl p-4 mb-10 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <h1 class="text-3xl font-extrabold text-primary flex items-center space-x-2">
                <span class="text-4xl">👟</span>
                <span>Chuteira Power</span>
            </h1>

            <nav class="flex space-x-4 sm:space-x-6 items-center">
                <a href="#catalogo" class="text-gray-700 hover:text-primary font-medium transition hidden sm:block">Catálogo</a>
                <a href="#promocoes" class="text-gray-700 hover:text-primary font-medium transition hidden sm:block">Promoções</a>
                <button class="text-gray-900 bg-yellow-300 py-2 px-4 rounded-full text-sm font-bold hover:bg-yellow-400 transition shadow-lg flex items-center space-x-1">
                    <span>Carrinho (0)</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </button>
            </nav>
        </div>
    </header>

    <main id="catalogo">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8 border-b-4 border-primary pb-2">🚀 Catálogo de Chuteiras</h2>
        

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">

            <div class="bg-white p-5 rounded-xl shadow-2xl hover:shadow-primary/50 transition duration-300 transform hover:-translate-y-1">
                <span class="absolute top-0 right-0 color-primary text-gray-900 text-xs font-bold py-1 px-3 rounded-bl-xl">NOVO</span>
                <img src="https://cadiles.vtexassets.com/arquivos/ids/284472-800-auto?v=638563062872100000&width=800&height=auto&aspect=true" 
                     alt="Chuteira de Velocidade"
                     class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-extrabold text-gray-900">Velocidade Extrema V.3</h3>
                <p class="text-sm text-gray-500 mb-2">Campo | Leveza e Tração</p>
                <p class="text-2xl font-bold text-red-600 mb-3">R$ 499,90</p>
                <button class="w-full color-primary text-gray-900 py-2 rounded-full font-bold hover:bg-primary transition shadow-md">
                    Comprar Agora
                </button>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-2xl hover:shadow-blue-500/50 transition duration-300 transform hover:-translate-y-1">
                <img src="https://images.tcdn.com.br/img/img_prod/836830/chuteira_esportiva_masculina_futebol_de_campo_treino_jogo_tight_control_umbro_gravity_13799_1_281294e6a06b8d0a6f79e901cd27189a.jpg" 
                     alt="Chuteira de Controle"
                     class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-extrabold text-gray-900">Controle Mestre</h3>
                <p class="text-sm text-gray-500 mb-2">Society | Toque Aprimorado</p>
                <p class="text-2xl font-bold text-gray-700 mb-3">R$ 379,90</p>
                <button class="w-full bg-blue-600 text-white py-2 rounded-full font-bold hover:bg-blue-700 transition shadow-md">
                    Comprar Agora
                </button>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-2xl hover:shadow-red-500/50 transition duration-300 transform hover:-translate-y-1">
                <img src="https://images.tcdn.com.br/img/img_prod/311840/chuteira_puma_evopower_vigor_1_graphic_fg_campo_39169_1_20210806215615.jpg" 
                     alt="Chuteira de Potência"
                     class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-extrabold text-gray-900">Força Pro</h3>
                <p class="text-sm text-gray-500 mb-2">Futsal | Precisão e Impacto</p>
                <p class="text-2xl font-bold text-gray-700 mb-3">R$ 299,90</p>
                <button class="w-full bg-red-600 text-white py-2 rounded-full font-bold hover:bg-red-700 transition shadow-md">
                    Comprar Agora
                </button>
            </div>

            <div class="" 
                     alt="Chuteira Clássica em Couro"bg-white p-5 rounded-xl shadow-2xl hover:shadow-yellow-500/50 transition duration-300 transform hover:-translate-y-1">
                <img src=https://oldfirm.com.br/blog/wp-content/uploads/2023/01/Chuteira-Adidas-Copa-Icon-Preta-2023-1024x538.jpeg
                     class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="text-xl font-extrabold text-gray-900">Clássica Couro</h3>
                <p class="text-sm text-gray-500 mb-2">Campo | Conforto e Durabilidade</p>
                <p class="text-2xl font-bold text-yellow-600 mb-3">R$ 559,90</p>
                <button class="w-full bg-yellow-500 text-gray-900 py-2 rounded-full font-bold hover:bg-yellow-600 transition shadow-md">
                    Comprar Agora
                </button>
            </div>

        </div>
    </main>
</div>

<script src="script.js"></script></body>
</html>
