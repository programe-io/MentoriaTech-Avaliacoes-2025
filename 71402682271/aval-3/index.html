<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
  </head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="https://via.placeholder.com/52x52.png?text=CJ" alt="Logo ComidaJá" class="logo-img" />
        <div class="brand-text">
          <h1 class="brand-name">ComidaJá</h1>
          <p class="tagline">Entrega rápida — qualidade top</p>
        </div>
      </div>

      <nav>
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Cardápio</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <img src="https://via.placeholder.com/800x250.png?text=Comidas+Deliciosas" alt="Comidas deliciosas" class="hero-img">
      <h2>Peça comida boa e receba rápido!</h2>
      <p>Escolha seus pratos favoritos e aproveite ofertas exclusivas.</p>
    </section>

    <main class="produtos" aria-label="Lista de produtos">
      <article class="produto">
        <img src="https://via.placeholder.com/200x150.png?text=Pizza" alt="Pizza Margherita">
        <h3>Pizza Margherita</h3>
        <p class="price">R$ <span class="price-value">28,00</span></p>
        <button>Comprar</button>
      </article>

      <article class="produto">
        <img src="https://via.placeholder.com/200x150.png?text=Burger" alt="Cheese Burger">
        <h3>Cheese Burger</h3>
        <p class="price">R$ <span class="price-value">22,50</span></p>
        <button>Comprar</button>
      </article>

      <article class="produto">
        <img src="https://via.placeholder.com/200x150.png?text=Sushi" alt="Combo Sushi">
        <h3>Combo Sushi</h3>
        <p class="price">R$ <span class="price-value">35,00</span></p>
        <button>Comprar</button>
      </article>
    </main>

    <footer>
      <p>© 2025 ComidaJá — Feito com ❤️ no Brasil</p>
    </footer>
  </div>
</body>
</html>
  
  
</body>
</html>
