<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo HTML com Tags Obrigatórias</title>
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Bem-vindo ao Meu Site</h1>
        <img src="logo.png" alt="Logo do Site" width="120">
        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <aside>
            <h3>Menu Lateral</h3>
            <ul>
                <li>Opção 1</li>
                <li>Opção 2</li>
                <li>Opção 3</li>
            </ul>
        </aside>

        <article>
            <h2>Artigo Principal</h2>
            <p>Este é um exemplo de conteúdo dentro da tag article.</p>
            <img src="exemplo.jpg" alt="Imagem ilustrativa" width="250">
        </article>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 - Meu Site. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
