<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SocialBoard – Feed</title>
    <meta name="viewport" content="width=device-width">

    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body>

    <!-- ========= TOP BAR ========= -->
    <header class="topbar">
        <h1 class="logo">SocialBoard</h1>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Notificações</a>
            <a href="#">Perfil</a>
        </nav>
    </header>



    <!-- ===== PAGE STRUCTURE ===== -->
    <main class="page-layout">

        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar">
            <section class="profile-card">
                <div class="profile-photo" style="background-image:url('https://i.pravatar.cc/200')"></div>
                <h2>Wallison</h2>
                <p>@wallison_user</p>
            </section>

            <ul class="menu">
                <li><a href="#">Amigos</a></li>
                <li><a href="#">Grupos</a></li>
                <li><a href="#">Comunidades</a></li>
            </ul>
        </aside>



        <!-- ========== FEED AREA ========== -->
        <section class="feed-area">

            <!-- STORY SECTION -->
            <div class="stories">
                <div class="story" style="background:url('https://i.pravatar.cc/100?img=2')"></div>
                <div class="story" style="background:url('https://i.pravatar.cc/100?img=3')"></div>
                <div class="story" style="background:url('https://i.pravatar.cc/100?img=4')"></div>
                <div class="story" style="background:url('https://i.pravatar.cc/100?img=5')"></div>
            </div>


            <!-- POST FORM -->
            <article class="new-post">
                <textarea placeholder="Compartilhe algo agora..."></textarea>
                <button class="btn-post">Publicar</button>
            </article>



            <!-- POST 1 -->
            <article class="post-card">

                <header class="post-top">
                    <img src="https://i.pravatar.cc/200?img=14" class="author-photo">

                    <div>
                        <h3 class="author-name">Lucas Andrade</h3>
                        <span class="post-time">2h atrás</span>
                    </div>
                </header>

                <p class="post-text">
                    Que dia lindo hoje 😄🌤️
                </p>

                <img src="https://images.unsplash.com/photo-1526244434298-88fcbcb066b5" class="post-media">

                <footer class="post-actions">
                    <button id="like-post-1" class="btn-action btn-like">Curtir (9)</button>
                    <button id="comment-toggle-1" class="btn-action btn-comment">Comentar (1)</button>
                </footer>

                <section id="comments-1" class="comments-box">
                    <textarea placeholder="Escreva um comentário..."></textarea>
                    <button class="comment-send-btn">Enviar</button>
                </section>

            </article>



            <!-- POST 2 -->
            <article class="post-card">

                <header class="post-top">
                    <img src="https://i.pravatar.cc/200?img=22" class="author-photo">

                    <div>
                        <h3 class="author-name">Empresa Tech</h3>
                        <span class="post-time">45min atrás</span>
                    </div>
                </header>

                <p class="post-text">
                    Novo lançamento 😍 Veja nossa coleção!
                </p>

                <img src="https://images.unsplash.com/photo-1581291518857-4e27b48ff24e" class="post-media">

                <footer class="post-actions">
                    <button id="like-post-2" class="btn-action btn-like">Curtir (30)</button>
                    <button id="comment-toggle-2" class="btn-action btn-comment">Comentar (4)</button>
                </footer>

                <section id="comments-2" class="comments-box">
                    <textarea placeholder="Escreva um comentário..."></textarea>
                    <button class="comment-send-btn">Enviar</button>
                </section>

            </article>



        </section>


    </main>


    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
