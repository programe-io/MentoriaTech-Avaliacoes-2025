<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gradient-to-b from-blue-800 to-blue-950 h-screen text-white">

    <header class="bg-blue-900 shadow-md md:shadow-lg p-5 flex items-center justify-between">
        <div class="uppercase font-bold md:text-left">LOGO</div>
        <nav class="hidden md:flex font-semibold gap-3">
            <a href="#">Início</a>
            <a href="#">Amigos</a>

    <main class="py-4 px-2">

        <div class="flex flex-col gap-3 md:flex-row md:justify-center">

            <div class="max-w-96 bg-gray-800 py-4 shadow-md rounded-lg mx-auto">

                    <span class="text-xl font-bold">Marieli</span>
                </div>
                <div class="card-media">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQe3DL_7jMYFG7Vl7I5JP-MrJD50mDmI1zJAw&s" alt="Postagem" class="w-full">
                </div>
                <div class="card-content pt-4 px-4">
                    <p class="text-sm text-justify">Paisagem rosa</p>
                    <span class="text-xs text-right text-gray-400 block mt-4">Há 5 minutos</span>
                </div>
            </div>

            <div class="max-w-96 bg-gray-800 py-4 shadow-md rounded-lg mx-auto">
                <div class="card-header flex items-center gap-3 px-4 pb-4 border-b border-gray-700">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ58pWn2xhBAsA1Y1CGskpCALxRMqKtQDX01Q&s" alt="Perfil" class="h-12 w-12 rounded-full border-2 border-blue-500">
                    <span class="text-xl font-bold">Marieli</span>
                </div>
                <div class="card-media">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJoYUZUkZDL-ZnQb0gsEFbOIAuwWKpZ3UTig&s" alt="Postagem" class="w-full">
                </div>
                <div class="card-content pt-4 px-4">
                    <p class="text-sm text-justify">Verde que renova</p>
                    <span class="text-xs text-right text-gray-400 block mt-4">Há 30 minutos</span>
                </div>
            </div>

            <div class="max-w-96 bg-gray-800 py-4 shadow-md rounded-lg mx-auto">
                <div class="card-header flex items-center gap-3 px-4 pb-4 border-b border-gray-700">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ58pWn2xhBAsA1Y1CGskpCALxRMqKtQDX01Q&s" alt="Perfil" class="h-12 w-12 rounded-full border-2 border-blue-500">
                    <span class="text-xl font-bold">Marieli</span>
                </div>
                <div class="card-media">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1AN9rDC04asGjtnl9aWMLyMzXoI_cEKByiQ&s" alt="Postagem" class="w-full">
                </div>
                <div class="card-content pt-4 px-4">
                    <p class="text-sm text-justify">Detalhes que inspiram</p>
                    <span class="text-xs text-right text-gray-400 block mt-4">Há 1 hora</span>
                </div>
            </div>
