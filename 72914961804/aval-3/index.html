<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- NAVBAR -->
    <nav>
        <h1>SocialFeed</h1>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Explorar</a></li>
            <li><a href="#">Perfil</a></li>
        </ul>
    </nav>

    <!-- HEADER -->
    <header>
        <h2>Bem-vindo ao SocialFeed 👋</h2>
        <p>Veja as novidades e atualizações dos seus amigos.</p>
    </header>

    <!-- FEED -->
    <main class="feed">

        <!-- POST 1 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" class="avatar">
                <div>
                    <h3>Ana Souza</h3>
                    <span>10 min atrás</span>
                </div>
            </div>
            <p class="post-text">
                Começando um novo projeto em HTML e CSS! 🚀
            </p>
            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>
        </div>

        <!-- POST 2 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" class="avatar">
                <div>
                    <h3>Lucas Andrade</h3>
                    <span>2 horas atrás</span>
                </div>
            </div>
            <p class="post-text">
                Hoje foi dia de estudar responsividade! 📱💻
            </p>
            <div class="post-actions">
                <button>👍 Curtir</button>
                <button>💬 Comentar</button>
            </div>
        </div>

    </main>

</body>
</html>
