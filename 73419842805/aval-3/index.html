<!DOCTYPE html>

            <a href="#Contato" class="hover:text-blue-300 transition duration-300">Contato</a> 
        </nav>

    <main class="py-6 px-4 flex flex-col gap-6 md:flex-row md:justify-center">  
         
        <div class="bg-gray-800 p-4 rounded-lg shadow-xl md:w-1/3 w-full">
