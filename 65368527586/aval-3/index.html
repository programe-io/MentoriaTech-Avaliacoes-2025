<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="style.css" rel="stylesheet"></head>
<body>

    <nav>
        <div class="nav-content">
            <div class="logo">Instagram</div>
            <input type="text" class="search-bar" placeholder="Pesquisar">
            <div class="nav-icons">
                <i class="fa-solid fa-house"></i>
                <i class="fa-brands fa-facebook-messenger"></i>
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-regular fa-compass"></i>
                <i class="fa-regular fa-heart"></i>
                <i class="fa-regular fa-circle-user"></i>
            </div>
        </div>
    </nav>

    <main>
        <header class="profile-header">
            <div class="profile-pic-container">
                <img src="https://i.pravatar.cc/300?img=5" alt="Foto de Perfil" class="profile-pic">
            </div>

            <div class="profile-info">
                <div class="profile-title">
                    <h2 class="username">dev.criativo</h2>
                    <div class="btns-profile">
                        <button id="followBtn" class="btn-follow">Seguir</button>
                        <button>Mensagem</button>
                        <button><i class="fa-solid fa-user-plus"></i></button>
                    </div>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>

                <ul class="profile-stats">
                    <li><strong>9</strong> publicações</li>
                    <li><strong id="followersCount">1.254</strong> seguidores</li>
                    <li><strong>450</strong> seguindo</li>
                </ul>

                <div class="profile-bio">
                    <strong>Dev FullStack 💻</strong>
                    <p>Criando interfaces incríveis.<br>
                    Apaixonado por CSS e JavaScript ☕<br>
                    📍 São Paulo, Brasil</p>
                    
                    <a href="#" class="link">github.com/devcriativo</a>
                </div>
            </div>
        </header>

        <div class="profile-tabs">
            <div class="tab-item active">
                <i class="fa-solid fa-table-cells"></i> Publicações
            </div>
            <div class="tab-item">
                <i class="fa-solid fa-clapperboard"></i> Reels
            </div>
            <div class="tab-item">
                <i class="fa-regular fa-bookmark"></i> Salvos
            </div>
            <div class="tab-item">
                <i class="fa-regular fa-id-badge"></i> Marcados
            </div>
        </div>

        <div class="gallery" id="galleryGrid">
            <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=1" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 150</span>
                    <span><i class="fa-solid fa-comment"></i> 12</span>
                </div>
            </div>
            <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=2" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 320</span>
                    <span><i class="fa-solid fa-comment"></i> 45</span>
                </div>
            </div>
             <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=3" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 890</span>
                    <span><i class="fa-solid fa-comment"></i> 102</span>
                </div>
            </div>
             <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=4" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 200</span>
                    <span><i class="fa-solid fa-comment"></i> 30</span>
                </div>
            </div>
             <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=5" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 415</span>
                    <span><i class="fa-solid fa-comment"></i> 55</span>
                </div>
            </div>
             <div class="gallery-item" tabindex="0">
                <img src="https://picsum.photos/600/600?random=6" class="gallery-image" alt="Post">
                <div class="gallery-overlay">
                    <span><i class="fa-solid fa-heart"></i> 600</span>
                    <span><i class="fa-solid fa-comment"></i> 90</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
