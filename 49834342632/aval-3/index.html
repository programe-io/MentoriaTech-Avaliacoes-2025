<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title>Projeto</title>

      <style>
          body {
                margin: 0;
                      font-family: Arial, sans-serif;
                            background: linear-gradient(180deg, #061c2f, #0b2f4a);
                                  color: white;
                                      }

                                          header {
                                                background: #000;
                                                      padding: 20px;
                                                            text-align: center;
                                                                }

                                                                    header h1 span {
                                                                          color: #00e5ff;
                                                                                font-size: 26px;
                                                                                    }

                                                                                        nav {
                                                                                              margin-top: 10px;
                                                                                                  }

                                                                                                      nav a {
                                                                                                            color: white;
                                                                                                                  margin: 0 10px;
                                                                                                                        text-decoration: none;
                                                                                                                              font-weight: bold;
                                                                                                                                  }

                                                                                                                                      nav a:hover {
                                                                                                                                            color: #00e5ff;
                                                                                                                                                }

                                                                                                                                                    main {
                                                                                                                                                          padding: 30px 15px;
                                                                                                                                                              }

                                                                                                                                                                  .titulo {
                                                                                                                                                                        text-align: center;
                                                                                                                                                                              margin-bottom: 30px;
                                                                                                                                                                                  }

                                                                                                                                                                                      .titulo h2 span {
                                                                                                                                                                                            color: #00e5ff;
                                                                                                                                                                                                  font-size: 28px;
                                                                                                                                                                                                      }

                                                                                                                                                                                                          .cards {
                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                      gap: 20px;
                                                                                                                                                                                                                            flex-wrap: wrap;
                                                                                                                                                                                                                                  justify-content: center;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          .card {
                                                                                                                                                                                                                                                background: #ffffff;
                                                                                                                                                                                                                                                      color: #000;
                                                                                                                                                                                                                                                            width: 300px;
                                                                                                                                                                                                                                                                  border-radius: 12px;
                                                                                                                                                                                                                                                                        overflow: hidden;
                                                                                                                                                                                                                                                                              box-shadow: 0 6px 15px rgba(0,0,0,0.4);
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      .card img {
                                                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                                                  height: 180px;
                                                                                                                                                                                                                                                                                                        object-fit: cover;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                .card-content {
                                                                                                                                                                                                                                                                                                                      padding: 15px;
                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                              .card-content h3 {
                                                                                                                                                                                                                                                                                                                                    margin: 0 0 10px;
                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                            footer {
                                                                                                                                                                                                                                                                                                                                                  background: #000;
                                                                                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                                                                                              padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                    margin-top: 40px;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                          <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

                                                                                                                                                                                                                                                                                                                                                                            <header>
                                                                                                                                                                                                                                                                                                                                                                                <h1><span>Projeto</span></h1>
                                                                                                                                                                                                                                                                                                                                                                                    <nav>
                                                                                                                                                                                                                                                                                                                                                                                          <a href="#">Início</a>
                                                                                                                                                                                                                                                                                                                                                                                                <a href="#">Jogos</a>
                                                                                                                                                                                                                                                                                                                                                                                                      <a href="#">Contato</a>

                                                                                                                                                                                                                                                                                                                                                                                                            </header>

                                                                                                                                                                                                                                                                                                                                                                                                              <main>

                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                              <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420" alt="Jogo de Ação">
                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Jogo de Ação</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e" alt="Jogo Online">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Jogo Online</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p>Jogue com amigos e dispute rankings.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f" alt="Jogo de Estratégia">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card-content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>Jogo de Estratégia</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>Pense bem antes de cada jogada.</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>© 2025 - Projeto Escolar</span>
