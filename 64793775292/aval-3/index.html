<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação 3 - Rede Social</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gray-100">

  <!-- TOPO -->
  <header class="bg-white p-4 shadow flex justify-between items-center">
    <h1 class="text-xl font-bold">MinhaRede</h1>
    <input type="text" placeholder="Buscar" class="border px-2 py-1 rounded">
  </header>

  <div class="flex max-w-6xl mx-auto mt-6">

    <!-- MENU -->
    <nav class="w-1/4">
      <ul class="bg-white p-4 rounded shadow space-y-3">
        <li>
          <a href="#">
            <span>🏠</span> <span>Home</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>🔍</span> <span>Buscar</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>🔔</span> <span>Notificações</span>
          </a>
        </li>
        <li>
          <a href="#">
            <span>👤</span> <span>Perfil</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- FEED -->
    <main class="w-2/4 mx-4">
      <div class="bg-white p-4 rounded shadow">

        <div class="flex items-center gap-3 mb-3">
          <img src="https://via.placeholder.com/50" class="rounded-full">
          <div>
            <h2 class="font-bold">Usuário</h2>
            <p class="text-sm text-gray-500">Há 1 hora</p>
          </div>
        </div>

        <p class="mb-4">
          A tecnologia na educação facilita o aprendizado e amplia o acesso ao conhecimento.
        </p>

        <img src="https://via.placeholder.com/400x200" class="rounded mb-4">

        <!-- AÇÕES -->
        <div class="flex justify-around">
          <a href="#">
            <span>❤</span> <span>Curtir</span>
          </a>
          <a href="#">
            <span>💬</span> <span>Comentar</span>
          </a>
          <a href="#">
            <span>🔁</span> <span>Compartilhar</span>
          </a>
        </div>

      </div>
    </main>

    <!-- PERFIL -->
    <aside class="w-1/4">
      <div class="bg-white p-4 rounded shadow text-center">
        <img src="https://via.placeholder.com/80" class="rounded-full mx-auto">
        <h3 class="font-bold mt-2">Meu Perfil</h3>
        <a href="#">
          <span>@usuario</span>
        </a>
      </div>
    </aside>

  </div>

</body>
</html>
