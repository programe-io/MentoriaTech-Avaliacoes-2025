<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social - Vermelho</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <!-- NAVIGATION BAR -->
    <nav style="background:#b00000; padding:12px; color:white; display:flex; justify-content:center; gap:25px; font-size:18px;">
        <a href="#" style="color:white; text-decoration:none;">Início</a>
        <a href="#" style="color:white; text-decoration:none;">Perfil</a>
        <a href="#" style="color:white; text-decoration:none;">Configurações</a>
    </nav>

    <header>Feed Social</header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- NOVO H2 -->
        <h2 style="text-align:center; color:#b00000; margin-top:10px;">
            Últimas Atualizações
        </h2>

        <div class="feed-container">

            <div class="post">
                <h3>@usuario1</h3>
                <img src="https://tse2.mm.bing.net/th/id/OIP.iNwxvOsd5f_jZM-E8OrQAQHaE8?pid=Api&P=0&h=180" 
                     alt="Imagem do post" style="width:100%; border-radius:10px;">
                <p>Esse é meu primeiro post na plataforma! 😄</p>
                <button class="btn-like" onclick="curtir(this)">Curtir ❤️</button>
            </div>

            <div class="post">
                <h3>@micaely</h3>
                <img src="https://tse2.mm.bing.net/th/id/OIP.7Xqx6p8ij3yVd1_mbf1x6gHaE7?pid=Api&P=0&h=180" 
                     alt="Imagem do post" style="width:100%; border-radius:10px;">
                <p>Trabalhando em novos projetos! 🚀</p>
                <button class="btn-like" onclick="curtir(this)">Curtir ❤️</button>
            </div>

            <div class="post">
                <h3>@designlover</h3>
                <img src="https://tse3.mm.bing.net/th/id/OIP.2c7R8QdEdDneS10HIE8xxAHaHa?pid=Api&P=0&h=180" 
                     alt="Imagem do post" style="width:100%; border-radius:10px;">
                <p>A cor vermelha deixa tudo mais intenso! 🔥</p>
                <button class="btn-like" onclick="curtir(this)">Curtir ❤️</button>
            </div>

        </div>

    </main>

    <footer>
        Desenvolvido por <span>Micaely Nunes</span>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
