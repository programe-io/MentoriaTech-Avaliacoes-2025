<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delícias do Brasil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="style.css" rel="stylesheet"></head>
<body class="bg-gray-50 text-gray-800 transition-colors duration-300">
  <header class="bg-orange-600 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🍛 Delícias do Brasil</h1>
      <div class="flex items-center gap-3">
        <input id="search" type="search" placeholder="Buscar comida..." class="px-3 py-2 rounded-md text-sm text-gray-800 focus:outline-none" />
        <select id="filter" class="px-3 py-2 rounded-md text-sm text-gray-800">
          <option value="all">Todas</option>
          <option value="prato">Pratos</option>
          <option value="sobremesa">Sobremesas</option>
        </select>
        <button id="toggleDark" class="px-3 py-2 bg-white text-orange-700 rounded-md font-semibold">🌙</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <h2 class="text-2xl font-bold mb-6">Pratos em Destaque</h2>
    <section id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards criados via JS -->
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full shadow-lg overflow-hidden">
      <div class="p-5">
        <div class="flex justify-between items-center">
          <h3 id="modalTitle" class="text-xl font-bold"></h3>
          <button id="closeModal" class="text-gray-500 text-xl">✖</button>
        </div>
        <p id="modalDesc" class="mt-3 text-gray-700"></p>
        <h4 class="mt-4 font-semibold">Ingredientes</h4>
        <ul id="modalIngredients" class="list-disc ml-6 text-gray-700"></ul>
        <h4 class="mt-4 font-semibold">Modo de preparo</h4>
        <ol id="modalSteps" class="list-decimal ml-6 text-gray-700"></ol>
        <div class="text-right mt-5">
          <button id="closeModal2" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
