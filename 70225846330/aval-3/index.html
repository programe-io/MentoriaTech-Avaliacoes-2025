<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social Simples</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <nav>
            <h1>Meu Feed</h1>
            <a href="#">Home</a>
            <a href="#">Perfil</a>
            <a href="#">Configurações</a>
        </nav>
    </header>

    <main>
        <!-- POST 1 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" alt="foto de perfil">
                <span class="username">@usuario123</span>
            </div>

            <img class="post-img" src="https://via.placeholder.com/600x300" alt="imagem do post">

            <h2>Meu primeiro post</h2>
            <p>Esse é um texto simples de exemplo para o feed social.</p>

            <a href="#">Curtir</a>
        </div>

        <!-- POST 2 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50" alt="foto de perfil">
                <span class="username">@carla</span>
            </div>

            <img class="post-img" src="https://via.placeholder.com/600x300/333/fff" alt="imagem do post">

            <h2>Dia especial!</h2>
            <p>Adorei compartilhar este momento com vocês!</p>

            <a href="#">Curtir</a>
        </div>

    </main>

</body>
</html>
