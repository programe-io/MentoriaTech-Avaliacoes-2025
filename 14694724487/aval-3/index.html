<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="navbar">
        <div class="navbar-left">
            <h1 class="logo">facebook</h1>
        </div>
        <div class="navbar-center">
            <nav>
                <a href="#" class="nav-icon active">🏠</a>
                <a href="#" class="nav-icon">👥</a>
                <a href="#" class="nav-icon">📺</a>
            </nav>
        </div>
        <div class="navbar-right">
            <button id="profile-btn">Meu Perfil</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="left-sidebar">
            <h2>Atalhos</h2>
            <ul id="shortcuts">
                <li><a href="#">Amigos</a></li>
                <li><a href="#">Grupos</a></li>
            </ul>
        </aside>

        <main class="feed-content">
            <div class="post-creator">
                <input type="text" placeholder="No que você está pensando, [Nome]?">
                <button id="post-btn">Publicar</button>
            </div>

            <article class="post">
                <div class="post-header">
                    <img src="placeholder.jpg" alt="Foto do Usuário" class="user-avatar">
                    <span class="username">Usuário Exemplo</span>
                </div>
                <p class="post-text">Este é um exemplo de postagem no meu clone do Facebook!</p>
                <div class="post-actions">
                    <button class="like-btn">👍 Curtir</button>
                    <button class="comment-btn">💬 Comentar</button>
                </div>
            </article>
        </main>

        <aside class="right-sidebar">
            <h2>Contatos</h2>
            <ul>
                <li>Contato 1 (Online)</li>
                <li>Contato 2 (Online)</li>
            </ul>
        </aside>
    </div>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
