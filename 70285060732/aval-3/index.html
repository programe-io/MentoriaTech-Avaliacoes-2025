<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

  <!-- Navegação -->
  <nav class="page-header">
    <a href="https://www.instagram.com/" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/2560px-Instagram_logo.svg.png" 
           alt="Logo do Instagram" class="instagram-logo">
    </a>
  </nav>

  <!-- Conteúdo principal -->
  <main>
    <h2>Feed do Instagram</h2>

    <article class="post">

      <!-- Cabeçalho do post -->
      <header class="post-header">
        <img src="https://images.unsplash.com/photo-1524502397800-2eeaad7c3fe5?auto=format&fit=crop&w=200&q=80" 
             alt="Perfil de Sophia Sousa" class="profile-pic">
        <a href="https://www.instagram.com/sophia_sousa/" target="_blank">
          <strong>Sophia Sousa</strong>
        </a>
      </header>

      <!-- Imagem da publicação -->
      <section class="post-image">
        <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=900&q=80" 
             alt="Gato fofo">
      </section>

      <!-- Legenda do post -->
      <section class="post-caption">
        <p>Olha esse gato fofo que encontrei! 😻</p>
      </section>

      <!-- Ações do post -->
      <section class="post-actions">
        <span aria-label="Curtir" class="like-heart">❤</span>
        <span aria-label="Comentar">💬</span>
        <span aria-label="Compartilhar">🔄</span>
      </section>

      <!-- Estatísticas do post -->
      <section class="post-stats">
        <span>4.920 curtidas</span> •
        <span>32 comentários</span> •
        <span>14 republicações</span>
      </section>

      <!-- Comentários -->
      <section class="comments-section">
        <span class="view-comments">Ver todos os 32 comentários</span>

        <div class="comment">
          <img src="https://images.unsplash.com/photo-1502764613149-7f1d229e230f?auto=format&fit=crop&w=40&q=80" 
               alt="Perfil de catlover" class="comment-profile-pic">
          <strong>catlover:</strong> MEU DEUS QUE FOFURA 😭💕
        </div>

        <div class="comment">
          <img src="https://images.unsplash.com/photo-1502767089025-6572583495a0?auto=format&fit=crop&w=40&q=80" 
               alt="Perfil de luna_pets" class="comment-profile-pic">
          <strong>luna_pets:</strong> Parece um bichinho de pelúcia!
        </div>

        <div class="comment">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=40&q=80" 
               alt="Perfil de mariana" class="comment-profile-pic">
          <strong>mariana:</strong> Queria apertar 😍
        </div>

        <div class="comment">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=40&q=80" 
               alt="Perfil de felipe" class="comment-profile-pic">
          <strong>felipe:</strong> O rei da casa kkkkk 😂
        </div>
      </section>

      <!-- Campo de comentário -->
      <footer class="add-comment">
        <form>
          <input type="text" placeholder="Adicione um comentário..." aria-label="Comentário">
          <button type="submit">Publicar</button>
        </form>
      </footer>

    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
