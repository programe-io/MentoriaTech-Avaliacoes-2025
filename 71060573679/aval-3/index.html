<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white"> 
    
    <!-- HEADER -->
    <header class="shadow-md p-5 flex items-center">
        <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
            LOGO
        </div>

        <nav class="font-bold gap-6 hidden md:flex">
            <a href="#" class="hover:text-blue-400">Início</a>
            <a href="#" class="hover:text-blue-400">Amigos</a>
            <a href="#" class="hover:text-blue-400">Perfil</a>
        </nav>
    </header>

    <!-- POSTS -->
    <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

        <!-- POST CARD 1 -->
        <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
            <!-- CARD HEADER -->
            <div class="flex items-center gap-3 p-4">
                <img
                    class="h-12 w-12 rounded-full border-2 border-blue-500"
                    src="07550e_145827a0f9274df98d095a7a228ab435~mv2.avif"
                    alt="Foto de perfil"
                />
                <h2 class="text-lg font-semibold">Danielly</h2>
            </div>

            <!-- CARD IMAGE -->
            <img class="w-full h-48 object-cover" src="2009-LA-DANSE_1920x1080.jpg" alt="Imagem do post" />

            <!-- CARD CONTENT -->
            <div class="p-4">
                <p class="text-sm text-justify">
                    ✨ Entre passos e sonhos, encontro meu equilíbrio.
                </p>
                <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
            </div>
        </div>

        <!-- POST CARD 2 -->
        <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
            <div class="flex items-center gap-3 p-4">
                <img
                    class="h-12 w-12 rounded-full border-2 border-blue-500"
                    src="07550e_145827a0f9274df98d095a7a228ab435~mv2.avif"
                    alt="Foto de perfil"
                />
                <h2 class="text-lg font-semibold">Danielly</h2>
            </div>

            <img class="w-full h-48 object-cover" src="MG_8512.jpg.webp" alt="Imagem do post" />

            <div class="p-4">
                <p class="text-sm text-justify">
                    🩰 A dança fala onde as palavras silenciam.
                </p>
                <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
            </div>
        </div>

        <!-- POST CARD 3 -->
        <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
            <div class="flex items-center gap-3 p-4">
                <img 
                    class="h-12 w-12 rounded-full border-2 border-blue-500"
                    src="07550e_145827a0f9274df98d095a7a228ab435~mv2.avif"
                    alt="Foto de perfil"
                />
                <h2 class="text-lg font-semibold">Danielly</h2>        
            </div>

            <img class="w-full h-48 object-cover" src="1109228-les-spectacles-de-danse-classique-a-voir-absolument-a-paris-en-2024.jpg" alt="Imagem do post" />

            <div class="p-4">
                <p class="text-sm text-justify">
                    🌸 Leveza nos pés, força na alma.
                </p>
                <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
            </div>
        </div>

    </main>

<script src="script.js"></script></body>
</html>
