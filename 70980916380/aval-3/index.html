<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Ghoul Feed</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <main>
<h2>
    <header class="top-bar">
        <div class="logo">TOKYO GHOUL</div>
        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Ghoul</a>
            <a href="#">Perfil</a>
        </nav>
    </header>

    <section class="cards-container">

        <!-- CARD 1 -->
        <div class="card">
            <div class="card-header">
                <img src="https://i.pinimg.com/564x/4e/83/73/4e8373a13e5ee2b97aa8656f8243e0ab.jpg" class="avatar">
                <span class="name">Kaneki Ken</span>
            </div>

            <img src="https://wallpapers.com/images/thumbnail/kaneki-sad-v0i7i13o2olr8hpw.webp" class="card-img">

            <div class="card-content">
                <p>"Se você não quer ser ferido, então machuque."</p>
                <span class="time">há 5 minutos</span>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
            <div class="card-header">
                <img src="https://i.pinimg.com/564x/89/7e/86/897e86e7341de8da4288b7d96e61fad2.jpg" class="avatar">
                <span class="name">Touka Kirishima</span>
            </div>

            <img src="https://i.pinimg.com/736x/50/d1/89/50d189d39cb89ae32abe30797095064e.jpg" class="card-img">

            <div class="card-content">
                <p>"Somos tão frágeis… e por isso tentamos ser fortes."</p>
                <span class="time">há 12 minutos</span>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
            <div class="card-header">
                <img src="https://i.pinimg.com/564x/71/4a/38/714a38aadbcc4d6f7d06559d4cb7d5a5.jpg" class="avatar">
                <span class="name">Juuzou Suzuya</span>
            </div>

            <img src="https://weeb101.wordpress.com/wp-content/uploads/2020/09/sasori-juuzou-tokyo-ghoul-re-bent-backwards.jpg?w=1568" class="card-img">

            <div class="card-content">
                <p>"A vida não é justa. Justo é você aceitar isso."</p>
                <span class="time">há 20 minutos</span>
            </div>
        </div>

    </section>

</body>
</html>
