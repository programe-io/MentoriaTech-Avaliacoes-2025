<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loja de Tênis — Sneakery</title>
  <link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <div class="container">
    <header>
      <div class="brand">Sneakery</div>
      <nav>
        <ul class="menu">
          <li><a href="#">Início</a></li>
          <li><a href="#">Produtos</a></li>
          <li><a href="#">Carrinho</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </header>

    <!-- 🌟 CONTEÚDO PRINCIPAL -->
    <main>
      <section>
        <h2 class="titulo">Tênis em destaque</h2>
        <div class="grid">
          <article class="card">
            <img src="https://images.unsplash.com/photo-1606813902791-9af0e4b3f4b8?w=1000&q=80" alt="Tênis Nike vermelho com sola branca">
            <h3>Nike Air Red</h3>
            <p>Tênis esportivo vermelho da Nike com sola branca, ideal para corrida e estilo urbano.</p>
            <div class="preco">R$ 499,90</div>
            <button class="btn add" onclick="adicionarAoCarrinho(1)">Adicionar ao Carrinho</button>
          </article>
        </div>
      </section>

      <section class="carrinho">
        <h3>Carrinho</h3>
        <ul id="lista-carrinho"></ul>
        <p id="total">Total: R$ 0,00</p>
      </section>
    </main>

    <footer>
      © <span id="year"></span> Sneakery — Todos os direitos reservados
    </footer>
  </div>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
