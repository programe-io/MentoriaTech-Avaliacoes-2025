<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Social</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

    <div class="container">

        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Perfil</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>

        <main>

            <header>
                <h1>Feed Social</h1>
            </header>

            <!-- Imagem fixa -->
            <img src="https://via.placeholder.com/300x150" alt="Imagem do site" class="imagem-fixa">

            <!-- Descrição da seção -->
            <p class="descricao">Aqui você pode ver as últimas publicações da comunidade. <span>Destaque suas ideias!</span></p>

            <section class="post-form">
                <textarea id="postText" placeholder="Escreva algo..."></textarea>
                <button onclick="addPost()">Publicar</button>
            </section>

            <!-- Título da seção de posts -->
            <h2>Publicações Recentes</h2>

            <section id="feed" class="feed"></section>

        </main>
    </div>

    <script>
        function addPost() {
            const text = document.getElementById("postText").value;
            if (text.trim() === "") return;

            const post = document.createElement("div");
            post.className = "post";

            post.innerHTML = `
                <div class="post-header">
                    <img class="profile-pic" src="https://i.pravatar.cc/50" alt="Foto de perfil">
                    <span class="username">Usuário</span>
                </div>

                <img src="https://via.placeholder.com/500x250" alt="Imagem do post">
                <p>${text}</p>

                <div class="post-actions">
                    <button class="like-btn" onclick="likePost(this)">❤️ Curtir</button>
                    <span class="like-count">0 likes</span>
                </div>
            `;

            document.getElementById("feed").prepend(post);
            document.getElementById("postText").value = "";
        }

        function likePost(btn) {
            const likeCount = btn.nextElementSibling;
            let count = parseInt(likeCount.innerText);
            count++;
            likeCount.innerHTML = `<span>${count} likes</span>`;
        }
    </script>

</body>
</html>
