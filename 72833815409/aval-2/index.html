<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meu Blog Simples</title>
  <link rel="stylesheet" href="styles.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Meu Blog</h1>
      <button id="new-post-btn" class="btn">Novo Post</button>
    </div>
  </header>

  <main class="container">
    <section class="posts" id="posts"></section>

    <aside class="sidebar">
      <div class="widget">
        <h3>Sobre</h3>
        <p>Blog simples feito com HTML, CSS e JavaScript. Posts salvos no localStorage.</p>
      </div>
      <div class="widget">
        <h3>Categorias</h3>
        <ul>
          <li>Tecnologia</li>
          <li>Design</li>
          <li>Pessoal</li>
        </ul>
      </div>
    </aside>
  </main>

  <!-- Modal de criação/edição de post -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="close">×</button>
      <h2 id="modal-title">Novo Post</h2>
      <form id="post-form">
        <label>
          Título
          <input type="text" id="title" required maxlength="100" />
        </label>
        <label>
          Categoria
          <input type="text" id="category" maxlength="50" />
        </label>
        <label>
          Conteúdo
          <textarea id="content" rows="8" required></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Salvar</button>
          <button type="button" id="cancel" class="btn">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Meu Blog — Feito com ♥</p>
    </div>
  </footer>

  <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
