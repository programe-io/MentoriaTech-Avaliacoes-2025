<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog do Futebol</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header>
        <h1>Blog do Futebol</h1>
        <p>Notícias, curiosidades e opiniões sobre o mundo da bola ⚽</p>
    </header>

    <main>
        <section id="posts">
            <h2>Últimos Posts</h2>
            <!-- Posts serão adicionados aqui via JavaScript -->
        </section>

        <section id="new-post">
            <h2>Escreva um novo post</h2>
            <form id="postForm">
                <input type="text" id="titulo" placeholder="Título do post" required>
                <textarea id="conteudo" placeholder="Escreva aqui seu texto..." required></textarea>
                <button type="submit">Publicar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Blog do Futebol | Criado com ❤️ e JavaScript</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
