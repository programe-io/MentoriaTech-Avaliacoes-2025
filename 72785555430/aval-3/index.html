<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed - Luara</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #3b82f6, #10b981, #ec4899);
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    header {
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ffe4e6;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 320px;
      max-width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      background-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .perfil img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    .perfil h2 {
      font-size: 1.2rem;
      margin: 0;
    }

    .feed-img {
      width: 100%;
      height: 230px;
      border-radius: 10px;
      object-fit: cover;
      background-color: rgba(255, 255, 255, 0.2);
      margin-bottom: 10px;
    }

    .frase {
      font-size: 0.95rem;
      color: #f9fafb;
    }

    .tempo {
      text-align: right;
      font-size: 0.8rem;
      color: #f3f4f6;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      color: #f3f4f6;
      padding: 15px;
      border-top: 2px solid rgba(255, 255, 255, 0.3);
      margin-top: 30px;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
  <header>
    <h1>Meu Feed</h1>
    <nav>
      <a href="#">Início</a>
      <a href="#">Amigos</a>
      <a href="#">Perfil</a>
    </nav>
  </header>

  <main>
    <!-- CARD 1 - Florzinha -->
    <div class="card">
      <div>
        <div class="perfil">
          <img src="https://i.pinimg.com/564x/03/d7/99/03d799af6472701a888de918f9e911c0.jpg" alt="Foto de perfil Luara">
          <h2>Luara</h2>
        </div>

        <img
          src="https://www.nicelembrancinhas.com.br/image/cache/catalog/MENINAS%20SUPER%20PODEROSAS/FLORZINHA%209CM-650x650.png"
          alt="Florzinha"
          class="feed-img"
        />

        <p class="frase">Força, coragem e muita inteligência! 💗🌸</p>
      </div>
      <span class="tempo">há 30 minutos</span>
    </div>

    <!-- CARD 2 - Docinho -->
    <div class="card">
      <div>
        <div class="perfil">
          <img src="https://i.pinimg.com/564x/03/d7/99/03d799af6472701a888de918f9e911c0.jpg" alt="Foto de perfil Luara">
          <h2>Luara</h2>
        </div>

        <img
          src="https://i.pinimg.com/236x/db/ba/fc/dbbafce6a91e2406b37bd829c3f47808.jpg"
          alt="Docinho"
          class="feed-img"
        />

        <p class="frase">Amigas unidas, poder garantido! 💚💥</p>
      </div>
      <span class="tempo">há 15 minutos</span>
    </div>

    <!-- CARD 3 - Lindinha -->
    <div class="card">
      <div>
        <div class="perfil">
          <img src="https://i.pinimg.com/564x/03/d7/99/03d799af6472701a888de918f9e911c0.jpg" alt="Foto de perfil Luara">
          <h2>Luara</h2>
        </div>

        <img
          src="https://i.pinimg.com/736x/d3/44/16/d34416b3a87b253acf058cf5c5098f7a.jpg"
          alt="Lindinha"
          class="feed-img"
        />

        <p class="frase">Doçura, alegria e um coração gigante! 💙✨</p>
      </div>
      <span class="tempo">há 5 minutos</span>
    </div>
  </main>

  <footer>
    © 2025 - Feed criado com carinho por Luara
  </footer>
</body>
</html>
