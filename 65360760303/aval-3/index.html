<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnimeSphere - O Universo dos Animes</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
    <header class="main-header">
        <h1><span>🌌</span> AnimeSphere</h1>
        <p>Descubra, Explore e Marque Seus Animes Favoritos!</p>
        <nav class="main-nav" aria-label="Navegação principal">
            <ul>
                <li><a href="#anime-list-section"><span>Populares</span></a></li>
                <li><a href="#favorites-section"><span>Meus Favoritos</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="anime-list-section" class="content-section" aria-labelledby="popular-animes-title">
            <h2 id="popular-animes-title"><span>🔥</span> Animes Populares</h2>
            <div id="anime-list" class="anime-grid" role="list">
                <article class="anime-item" role="listitem">
                    <img src="images/naruto.jpg" alt="Imagem do anime Naruto" />
                    <h3><span>Naruto</span></h3>
                </article>
                <article class="anime-item" role="listitem">
                    <img src="images/onepiece.jpg" alt="Imagem do anime One Piece" />
                    <h3><span>One Piece</span></h3>
                </article>
                <article class="anime-item" role="listitem">
                    <img src="images/demon-slayer.jpg" alt="Imagem do anime Demon Slayer" />
                    <h3><span>Demon Slayer</span></h3>
                </article>
            </div>
        </section>

        <section id="favorites-section" class="content-section" aria-labelledby="my-favorites-title">
            <h2 id="my-favorites-title"><span>⭐️</span> Meus Favoritos</h2>
            <ul id="favorites-list" class="favorites-ul">
                <li class="empty-message"><span>Nenhum anime favorito adicionado ainda.</span></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 AnimeSphere Project. Feito com HTML, CSS e JavaScript.</p>
    </footer>

    <script src="script.js"></script>
<script src="script.js"></script></body>
</html>
