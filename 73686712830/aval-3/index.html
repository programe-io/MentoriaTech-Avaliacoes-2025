<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Feed de Exemplo</title><style>*{box-sizing:border-box;margin:0;padding:0;line-height:1.4;font-family:Arial,sans-serif;transition:.3s ease-in-out;outline:none;-webkit-font-smoothing:antialiased;text-decoration-skip-ink:auto}body{background:#f3f4f6;padding:20px;color:#1f2937;min-height:100vh;font-size:16px;overflow-x:hidden;text-rendering:optimizeLegibility;display:block;scroll-behavior:smooth}header{background:#fff;padding:15px 20px;box-shadow:0 2px 4px rgba(0,0,0,.05);margin-bottom:20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}h1{font-size:24px;font-weight:700;color:#111827;margin:0;padding-right:15px;text-transform:capitalize}nav{display:flex;align-items:center}nav ul{list-style:none;display:flex;gap:15px}nav li{margin:0 5px;float:left}nav a{text-decoration:none;color:#4b5563;font-size:14px;font-weight:500;padding:5px 0;letter-spacing:.2px}nav a:hover{color:#2563eb;border-bottom:2px solid #2563eb;opacity:.9}.container-feed{max-width:600px;width:100%;margin:0 auto;padding:10px;min-height:500px}.post-card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-bottom:24px;border:1px solid #e5e7eb;position:relative;overflow:hidden;z-index:10;min-height:200px}.post-card h2{font-size:18px;font-weight:700;color:#1f2937;margin-bottom:2px}.post-header{display:flex;align-items:center;margin-bottom:16px;gap:12px;height:40px;user-select:none;padding-bottom:8px;cursor:pointer;border-bottom:1px dotted #ccc}.user-avatar{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;background-size:cover}.user-info{display:flex;flex-direction:column;flex-grow:1}.post-date{font-size:14px;color:#6b7280;display:block;text-align:left;font-style:italic}.post-content{color:#4b5563;margin-bottom:16px;line-height:1.5;text-align:justify;padding-top:5px;word-spacing:.5px}.media-box{margin:10px 0;overflow:hidden;border-radius:8px;width:100%;border:1px solid #ddd}.post-image{width:100%;max-height:400px;border-radius:8px;display:block;box-shadow:0 2px 4px rgba(0,0,0,.1);object-fit:cover;filter:brightness(.98)}.post-footer-actions{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:16px;display:flex;justify-content:space-around;gap:10px;align-items:center}.btn-action{font-weight:600;padding:8px 16px;font-size:15px;flex-grow:1;text-align:center;border-radius:4px;border:1px solid transparent;cursor:pointer;background:0 0;text-transform:uppercase}.btn-like{color:#2563eb}.btn-comment{color:#4b5563}.btn-like:hover{color:#1d4ed8;background:#e0f2fe;transform:translateY(-1px)}.btn-comment:hover{color:#374151;background:#f5f5f5;transform:translateY(-1px)}.comments-box{margin-top:10px;padding:10px;border-top:1px solid #f3f4f6;display:none;background:#fafafa;border-radius:4px;border-left:3px solid #eee}.comment-textarea{width:100%;padding:10px;margin-bottom:10px;font-size:14px;border:1px solid #ccc;border-radius:4px;resize:vertical;min-height:60px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}.comment-send-btn{float:right;padding:8px 20px;background:#2563eb;color:#fff;border-radius:4px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1);border:none;cursor:pointer;min-width:80px}.clearfix{clear:both;display:block;height:0}.feed-title{text-shadow:1px 1px 2px rgba(0,0,0,.05)}@media(max-width:640px){body{padding:10px}header{padding:10px 15px}.container-feed{padding:0}.post-card{padding:15px;margin-bottom:15px}.post-footer-actions{flex-wrap:wrap;padding-top:10px}.btn-action{font-size:14px;min-width:45%}}</style><script src="https://cdn.tailwindcss.com"></script>

<link href="style.css" rel="stylesheet"></head><body><header><h1 class="feed-title">Feed de Exemplo</h1><nav><ul><li><a href="#">Início</a></li><li><a href="#">Perfil</a></li><li><a href="#">Ajuda</a></li></ul></nav></header><main><div class="container-feed"><article class="post-card"><header class="post-header"><div class="user-avatar" style="background-color:#10b981"></div><div class="user-info"><h2 class="user-name"><span>Post Pessoal</span></h2><time class="post-date">Postado há 1h</time></div></header><p class="post-content">Curtindo o dia 😄. Este é o conteúdo principal da postagem.</p><div class="media-box"><img src="https://images.unsplash.com/photo-1603415526960-f7e0328c63b1?w=800" class="post-image"></div><footer class="post-footer-actions"><button id="like-post-1" class="btn-action btn-like">Curtir (15)</button><button id="comment-toggle-1" class="btn-action btn-comment">Comentar (3)</button></footer><section id="comments-1" class="comments-box"><textarea class="comment-textarea" placeholder="Escreva um comentário..."></textarea><button class="comment-send-btn">Enviar</button><div class="clearfix"></div></section></article><article class="post-card"><header class="post-header"><div class="user-avatar" style="background-color:#dc2626"></div><div class="user-info"><h2 class="user-name"><span>Post de Empresa</span></h2><time class="post-date">Postado há 45m</time></div></header><p class="post-content">Confira nosso catálogo 📘. Muitos itens novos com descontos exclusivos para esta semana!</p><div class="media-box"><img src="https://images.unsplash.com/photo-1607083206968-13611e3d76db?w=800" class="post-image"></div><footer class="post-footer-actions"><button id="like-post-2" class="btn-action btn-like">Curtir (42)</button><button id="comment-toggle-2" class="btn-action btn-comment">Comentar (7)</button></footer><section id="comments-2" class="comments-box"><textarea class="comment-textarea" placeholder="Escreva um comentário..."></textarea><button class="comment-send-btn">Enviar</button><div class="clearfix"></div></section></article></div></main><script>const handleLikeClick=i=>{const e=document.getElementById("like-post-"+i);if(!e)return;let t=parseInt(e.textContent.match(/\d+/)[0]);t++,e.textContent=`Curtir (${t})`};const toggleComments=i=>{const e=document.getElementById("comments-"+i),t=document.getElementById("comment-toggle-"+i);if(e){const o="block"===e.style.display;e.style.display=o?"none":"block",t&&t.setAttribute("aria-expanded",!o)}};document.addEventListener("DOMContentLoaded",()=>{document.getElementById("like-post-1").addEventListener("click",()=>handleLikeClick("1")),document.getElementById("like-post-2").addEventListener("click",()=>handleLikeClick("2")),document.getElementById("comment-toggle-1").addEventListener("click",()=>toggleComments("1")),document.getElementById("comment-toggle-2").addEventListener("click",()=>toggleComments("2"))});</script></body></html>
