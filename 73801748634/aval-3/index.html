<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <link href="./output.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>

<body class="bg-gradient-to-b from-blue-900 to-blue-950 min-h-screen text-white">

  <!-- HEADER -->
  <header class="shadow-md p-5 flex items-center">
    <div class="flex-1 text-center md:text-left uppercase font-bold tracking-wider">
    paisagens
    </div>
    <nav class="font-bold gap-6 hidden md:flex">
      <a href="#" class="hover:text-blue-400">Início</a>
      <a href="#" class="hover:text-blue-400">Amigos</a>
      <a href="#" class="hover:text-blue-400">Perfil</a>
    </nav>
  </header>

  <!-- POSTS -->
  <main class="p-8 flex flex-col md:flex-row justify-center gap-6">

    <!-- POST CARD 1 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <!-- CARD HEADER -->
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="images/profile_01.jpg" alt="">
        <h2 class="text-lg font-semibold">lago</h2>
      </div>
      <!-- CARD IMAGE -->
      <img class="w-full h-48 object-cover" src=https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?cs=srgb&dl=pexels-souvenirpixels-417074.jpg&fm=jpg alt="">
      <!-- CARD CONTENT -->
      <div class="p-4">
        <p class="text-sm text-justify">
          uma paisagen natural vai muito alem do que os olhos podem enxerga
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 2 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="images/profile_01.jpg" alt="">
        <h2 class="text-lg font-semibold">floresta</h2>
      </div>
      <img class="w-full h-48 object-cover" src=https://tse3.mm.bing.net/th/id/OIP.qU311jXcRw13McILu1LhlgHaEo?rs=1&pid=ImgDetMain&o=7&rm=3 alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          a paisagem parece viva porque a natureza e filha do deus vivo
        </p>
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

    <!-- POST CARD 3 -->
    <div class="bg-gray-800 rounded-lg shadow-md overflow-hidden max-w-xs">
      <div class="flex items-center gap-3 p-4">
        <img class="h-12 w-12 rounded-full border-2 border-blue-500" src="images/profile_01.jpg" alt="">
        <h2 class="text-lg font-semibold">mar</h2>
      </div>
      <img class="w-full h-48 object-cover" src=https://www.oficinadanet.com.br/imagens/post/19258/praia.jpg alt="">
      <div class="p-4">
        <p class="text-sm text-justify">
          Aproveite as paisagens deste belo passeio chamado vida
        <span class="text-xs text-gray-400 block text-right mt-3">há 10 minutos</span>
      </div>
    </div>

  </main>

</html>
