<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Post Card Hello Kitty</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>

<header class="top-header">
    <h2>🎀 Cartão Especial da Hello Kitty 🎀</h2>

    <nav class="navbar">
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Cartões</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="postcard">
        <div class="kitty-side">
            <img src="https://upload.wikimedia.org/wikipedia/en/0/05/Hello_Kitty.png" alt="Hello Kitty">
        </div>

        <div class="text-side">
            <h1>Olá! Sou a Hello Kitty 🎀</h1>
            <p>
                Que o seu dia seja cheio de fofura, sorrisos e boas energias!  
                Nunca esqueça de espalhar amor por onde você passar. 💗
            </p>
            <span class="signature">— Com carinho, Hello Kitty ✨</span>
        </div>
    </div>
</main>

<script src="script.js"></script></body>
</html>
