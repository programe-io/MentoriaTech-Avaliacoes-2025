<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Neymar</title>
    <link rel="stylesheet" href="style.css">
<link href="style.css" rel="stylesheet"></head>
<body>

    <header>
        <h1>Feed do Neymar JR ⚽💛💚</h1>
    </header>

    <!-- NAV obrigatória -->
    <nav class="menu">
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Fotos</a></li>
            <li><a href="#">Vídeos</a></li>
            <li><a href="#">Perfil</a></li>
        </ul>
    </nav>

    <!-- MAIN obrigatório -->
    <main class="feed">

        <!-- H2 obrigatório -->
        <h2>Últimas Atualizações do Neymar</h2>

        <!-- P obrigatório -->
        <p class="descricao">
            Aqui você acompanha as novidades, fotos e momentos recentes do Neymar Jr.
        </p>

        <!-- Post 1 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50/FFD700/000?text=N" alt="perfil Neymar">
                <div>
                    <h3>Neymar Jr</h3>
                    <span>1 hora atrás</span>
                </div>
            </div>

            <p class="post-text">
                Treino finalizado! Rumo à vitória! 💪⚽🔥
            </p>

            <img class="post-img" src="https://via.placeholder.com/600x300/00A859/FFF?text=Treino" alt="foto do treino">
        </div>

        <!-- Post 2 -->
        <div class="post">
            <div class="post-header">
                <img src="https://via.placeholder.com/50/FFD700/000?text=N" alt="perfil Neymar">
                <div>
                    <h3>Neymar Jr</h3>
                    <span>5 horas atrás</span>
                </div>
            </div>

            <p class="post-text">
                Sempre representando o Brasil 💛💚
            </p>

            <img class="post-img" src="https://via.placeholder.com/600x300/008B45/FFF?text=Brasil" alt="foto do Brasil">
        </div>

    </main>

</body>
</html>
